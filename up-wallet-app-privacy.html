let LANG = new URLSearchParams(location.search).get("lang") === "en" ? "en" : "it";
const I18N = {
  it: {
    pageTitle: "UP Wallet per Android — Privacy — ChainIntegrate",
    h1: "UP Wallet per Android — Informativa sulla privacy",
    subtitle: "Ultimo aggiornamento: 8 ottobre 2026. Riguarda l'app Android UP Wallet (it.chainintegrate.upwallet), in prova.",
    langToggleBtn: "English",
    s1t: "1 · In breve",
    s1: `<ul>
      <li><b>Nessun account e nessuna chiave.</b> L'app non chiede registrazioni e non conserva chiavi private o seed phrase: le firme le fa il tuo wallet (MetaMask), i permessi li applica il Key Manager della tua Universal Profile.</li>
      <li><b>Nessuna pubblicità, nessun tracciamento, nessuna statistica d'uso.</b> Le statistiche di MetaMask Connect sono disattivate e la telemetria di WalletConnect non è attiva.</li>
      <li><b>Quello che l'app ricorda resta sul telefono</b> e non entra nei backup di Android.</li>
      <li><b>Le blockchain sono pubbliche:</b> le operazioni che invii sono visibili a chiunque e non si possono cancellare.</li>
    </ul>`,
    s2t: "2 · Chi è il titolare",
    s2: `ChainIntegrate, che sviluppa l'app e gestisce il sito <code>crosschain-lukso.chainintegrate.it</code> e il relayer del sito. Contatti: e-mail <a href="mailto:info@chainintegrate.it">info@chainintegrate.it</a>, <a href="https://t.me/Simone_1977_2" target="_blank" rel="noopener">Telegram</a> oppure una segnalazione su <a href="https://github.com/ChainIntegrate/up-wallet-android/issues" target="_blank" rel="noopener">GitHub</a>.`,
    s3t: "3 · Cosa resta sul telefono",
    s3: `<ul>
      <li>l'indirizzo della UP e la rete scelti, per ritrovarli alla prossima apertura;</li>
      <li>i dati del collegamento con MetaMask e delle sessioni WalletConnect con le dApp (chiavi temporanee del canale cifrato, indirizzo e rete presentati alla dApp);</li>
      <li>un registro diagnostico (al massimo 300 righe): orari, apertura e chiusura dell'app, nomi delle richieste (per esempio "eth_sendTransaction"), il loro esito e il nome della dApp. Non contiene messaggi, importi, firme né indirizzi. Lo vedi e lo svuoti in fondo alla pagina dell'app ("Registro diagnostico"); esce dal telefono solo se lo copi tu.</li>
    </ul>
    Questi dati non vengono inviati a ChainIntegrate, non entrano nei backup di Android e si cancellano disinstallando l'app o cancellandone i dati dalle impostazioni del telefono.`,
    s4t: "4 · Con chi parla l'app, e cosa vede",
    s4: `<ul>
      <li><b>MetaMask</b> (ConsenSys Software Inc.): l'app parla con l'app MetaMask del tuo telefono attraverso il server di inoltro di MetaMask. I messaggi sono cifrati tra le due app; il server vede l'indirizzo IP e i tempi del collegamento.</li>
      <li><b>WalletConnect</b> (Reown, Inc.): il collegamento con le dApp passa dai server di Reown, che vedono i metadati della sessione (indirizzo della UP, rete, nome e indirizzo della dApp) e l'indirizzo IP; il contenuto delle richieste è cifrato tra l'app e la dApp. Reown verifica anche il dominio della dApp.</li>
      <li><b>Nodi RPC pubblici</b> della rete scelta (l'elenco è nel codice del sito, <code>chains.js</code>): per leggere saldi, contratti e permessi e per simulare le operazioni. Vedono l'indirizzo IP e gli indirizzi consultati.</li>
      <li><b>Le dApp</b> che colleghi: vedono l'indirizzo della UP e la rete, e ricevono le risposte che approvi.</li>
      <li><b>Il relayer del sito</b> (ChainIntegrate), solo se scegli "paga il gas con il relayer del sito": riceve l'operazione firmata (indirizzo della UP, rete, chiamata) e la invia alla blockchain. Vedi il punto 5.</li>
    </ul>
    Le notifiche delle richieste sono create dall'app sul telefono: non c'è un server di notifiche. MetaMask, Reown e i gestori dei nodi trattano questi dati secondo le loro informative.`,
    s5t: "5 · Cosa conserva ChainIntegrate",
    s5: `Solo quando usi il relayer del sito, il server registra: data e ora, rete, indirizzo della UP, identificativo della transazione, esito; per le richieste rifiutate anche l'indirizzo IP. Il server web registra a sua volta l'indirizzo IP di chi apre il sito. Questi registri servono al funzionamento e alla sicurezza del servizio e sono conservati <b>al massimo 30 giorni</b>.<br>
    Quando il gas lo paga il paymaster sponsor, il servizio che approva le operazioni tiene anche un elenco delle approvazioni e dei rifiuti (data e ora, rete, indirizzo della UP, numero dell'operazione; nessun indirizzo IP), che serve per i conteggi del servizio e, per gli abbonati, per scalare il saldo: questo elenco resta finché serve al servizio e agli obblighi contabili. Le operazioni inviate restano comunque sulla blockchain, pubblica e permanente.<br>
    Per il servizio di gas a pagamento (abbonamento, pagina <code>up-subscribe.html</code> del sito) vale quanto scritto in quella pagina: l'e-mail che inserisci lì serve solo per l'attivazione e gli avvisi di saldo basso. L'app non chiede e-mail.`,
    s6t: "6 · Permessi dell'app",
    s6: `<ul>
      <li><b>Internet</b>: per parlare con MetaMask, con le dApp e con la blockchain;</li>
      <li><b>Notifiche</b>: per avvisarti quando una dApp manda una richiesta mentre l'app è in secondo piano;</li>
      <li><b>Servizio in primo piano</b>: tiene attiva l'app mentre una dApp è collegata, con una notifica fissa che lo dice; si ferma quando la sessione finisce;</li>
      <li><b>Elenco dei browser</b>: solo per il pulsante "Torna alla dApp", che riapre il tuo browser.</li>
    </ul>`,
    s7t: "7 · I tuoi diritti",
    s7: `Secondo il Regolamento UE 2016/679 (GDPR) puoi chiedere l'accesso ai dati che ti riguardano nei registri del punto 5, la loro rettifica o cancellazione, o opporti al trattamento, scrivendo ai contatti del punto 2 (indica rete, indirizzo della UP e giorno, così possiamo trovarli). Puoi anche presentare reclamo al Garante per la protezione dei dati personali (<a href="https://www.garanteprivacy.it" target="_blank" rel="noopener">garanteprivacy.it</a>). Quello che sta sulla blockchain non può essere cancellato da nessuno.`,
    s8t: "8 · Minori e modifiche",
    s8: `L'app non è pensata per chi ha meno di 18 anni. Se questa informativa cambia, cambia la data in alto; le versioni precedenti restano nella cronologia del <a href="https://github.com/ChainIntegrate/Cross_Chain/commits/main/up-wallet-app-privacy.html" target="_blank" rel="noopener">repository</a>.`,

    footerHtml: `Servizi di consulenza in integrazione dati &amp; blockchain a cura di ChainIntegrate <a href="https://www.linkedin.com/company/chainintegrate" target="_blank" rel="noopener" aria-label="LinkedIn" class="footer-li"><svg width="20" height="20" viewBox="0 0 20 20"><rect width="20" height="20" rx="4" fill="#0A66C2"/><text x="10" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#fff">in</text></svg></a> · <a href="https://t.me/Simone_1977_2" target="_blank" rel="noopener">Assistenza via Telegram</a> · <a href="https://github.com/ChainIntegrate/Cross_Chain" target="_blank" rel="noopener">Codice sorgente su GitHub</a> · <a href="https://github.com/ChainIntegrate/up-wallet-android" target="_blank" rel="noopener">App Android (in prova)</a>`,
  },
  en: {
    pageTitle: "UP Wallet for Android — Privacy — ChainIntegrate",
    h1: "UP Wallet for Android — Privacy policy",
    subtitle: "Last updated: 8 October 2026. Covers the UP Wallet Android app (it.chainintegrate.upwallet), in testing.",
    langToggleBtn: "Italiano",
    s1t: "1 · In short",
    s1: `<ul>
      <li><b>No account and no keys.</b> The app asks for no sign-up and keeps no private keys or seed phrases: your wallet (MetaMask) signs, and your Universal Profile's Key Manager enforces the permissions.</li>
      <li><b>No ads, no tracking, no usage statistics.</b> MetaMask Connect's analytics are turned off and WalletConnect's telemetry is not enabled.</li>
      <li><b>What the app remembers stays on the phone</b> and is not included in Android backups.</li>
      <li><b>Blockchains are public:</b> the operations you send are visible to anyone and cannot be deleted.</li>
    </ul>`,
    s2t: "2 · Who is responsible",
    s2: `ChainIntegrate, which develops the app and runs the site <code>crosschain-lukso.chainintegrate.it</code> and the site's relayer. Contact: e-mail <a href="mailto:info@chainintegrate.it">info@chainintegrate.it</a>, <a href="https://t.me/Simone_1977_2" target="_blank" rel="noopener">Telegram</a> or an issue on <a href="https://github.com/ChainIntegrate/up-wallet-android/issues" target="_blank" rel="noopener">GitHub</a>.`,
    s3t: "3 · What stays on the phone",
    s3: `<ul>
      <li>the UP address and the network you chose, to find them again next time;</li>
      <li>the data of the connection with MetaMask and of the WalletConnect sessions with dApps (temporary keys of the encrypted channel, address and network presented to the dApp);</li>
      <li>a diagnostic log (at most 300 lines): times, app opened and closed, names of the requests (for example "eth_sendTransaction"), their outcome and the dApp's name. It holds no messages, amounts, signatures or addresses. You see and clear it at the bottom of the app's page ("Diagnostic log"); it leaves the phone only if you copy it.</li>
    </ul>
    This data is not sent to ChainIntegrate, is not included in Android backups, and is deleted when you uninstall the app or clear its data in the phone's settings.`,
    s4t: "4 · Who the app talks to, and what they see",
    s4: `<ul>
      <li><b>MetaMask</b> (ConsenSys Software Inc.): the app talks to the MetaMask app on your phone through MetaMask's relay server. Messages are encrypted between the two apps; the server sees the IP address and the timing of the connection.</li>
      <li><b>WalletConnect</b> (Reown, Inc.): the connection with dApps goes through Reown's servers, which see the session metadata (UP address, network, the dApp's name and address) and the IP address; the content of requests is encrypted between the app and the dApp. Reown also verifies the dApp's domain.</li>
      <li><b>Public RPC nodes</b> of the chosen network (the list is in the site's code, <code>chains.js</code>): to read balances, contracts and permissions and to simulate operations. They see the IP address and the addresses looked up.</li>
      <li><b>The dApps</b> you connect: they see the UP address and the network, and receive the answers you approve.</li>
      <li><b>The site's relayer</b> (ChainIntegrate), only if you choose "pay the gas with the site relayer": it receives the signed operation (UP address, network, call) and sends it to the blockchain. See section 5.</li>
    </ul>
    Request notifications are created by the app on the phone: there is no notification server. MetaMask, Reown and the node operators handle this data under their own policies.`,
    s5t: "5 · What ChainIntegrate keeps",
    s5: `Only when you use the site's relayer, the server records: date and time, network, UP address, transaction identifier, outcome; for refused requests, the IP address too. The web server also records the IP address of whoever opens the site. These logs serve the operation and security of the service and are kept <b>for at most 30 days</b>.<br>
    When the gas is paid by the sponsor paymaster, the service that approves operations also keeps a list of approvals and refusals (date and time, network, UP address, operation number; no IP address), used for the service's counts and, for subscribers, to charge the balance: this list is kept as long as the service and accounting obligations need it. The operations sent stay on the blockchain anyway, which is public and permanent.<br>
    For the paid gas service (subscription, the site's <code>up-subscribe.html</code> page), what that page says applies: the e-mail you enter there is used only for activation and low-balance alerts. The app asks for no e-mail.`,
    s6t: "6 · App permissions",
    s6: `<ul>
      <li><b>Internet</b>: to talk to MetaMask, to dApps and to the blockchain;</li>
      <li><b>Notifications</b>: to tell you when a dApp sends a request while the app is in the background;</li>
      <li><b>Foreground service</b>: keeps the app running while a dApp is connected, with a persistent notification saying so; it stops when the session ends;</li>
      <li><b>List of browsers</b>: only for the "Back to the dApp" button, which reopens your browser.</li>
    </ul>`,
    s7t: "7 · Your rights",
    s7: `Under Regulation (EU) 2016/679 (GDPR) you can ask for access to the data about you in the logs of section 5, for its correction or deletion, or object to its processing, through the contacts in section 2 (give network, UP address and day, so that we can find it). You can also lodge a complaint with the Italian data protection authority, the Garante per la protezione dei dati personali (<a href="https://www.garanteprivacy.it" target="_blank" rel="noopener">garanteprivacy.it</a>). What is on the blockchain cannot be deleted by anyone.`,
    s8t: "8 · Minors and changes",
    s8: `The app is not meant for people under 18. If this policy changes, the date at the top changes; earlier versions stay in the <a href="https://github.com/ChainIntegrate/Cross_Chain/commits/main/up-wallet-app-privacy.html" target="_blank" rel="noopener">repository</a>'s history.`,

    footerHtml: `Data &amp; blockchain integration consulting by ChainIntegrate <a href="https://www.linkedin.com/company/chainintegrate" target="_blank" rel="noopener" aria-label="LinkedIn" class="footer-li"><svg width="20" height="20" viewBox="0 0 20 20"><rect width="20" height="20" rx="4" fill="#0A66C2"/><text x="10" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#fff">in</text></svg></a> · <a href="https://t.me/Simone_1977_2" target="_blank" rel="noopener">Support via Telegram</a> · <a href="https://github.com/ChainIntegrate/Cross_Chain" target="_blank" rel="noopener">Source code on GitHub</a> · <a href="https://github.com/ChainIntegrate/up-wallet-android" target="_blank" rel="noopener">Android app (in testing)</a>`,
  },
};
const t = (k) => I18N[LANG][k] ?? I18N.it[k] ?? k;
function applyI18n() {
  document.documentElement.lang = LANG;
  document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = t(el.getAttribute("data-i18n")); });
  document.querySelectorAll("[data-i18n-html]").forEach((el) => { el.innerHTML = t(el.getAttribute("data-i18n-html")); });
}
applyI18n();
document.getElementById("langToggle").addEventListener("click", () => { LANG = LANG === "it" ? "en" : "it"; applyI18n(); });
</script>
