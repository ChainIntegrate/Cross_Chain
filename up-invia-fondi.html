<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<script src="theme.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta property="og:type" content="website">
<meta property="og:image" content="https://crosschain-lukso.chainintegrate.it/og-image.png">
<meta name="twitter:card" content="summary">
<meta name="twitter:image" content="https://crosschain-lukso.chainintegrate.it/og-image.png">
<meta name="referrer" content="no-referrer">
<title data-i18n="pageTitle">Invia — ora in UP Wallet — ChainIntegrate</title>
<meta name="description" content="La pagina Invia è stata unita a UP Wallet: valuta, token e NFT si inviano dal pannello 6.">
<link rel="icon" href="favicon.ico">
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --border: #2a2f3a; --field: #10131a; --chip: #2a2f3a; --disabled: #3a3f4b; --raised: #1d2330;
    --text: #e6e8ec; --text-dim: #9aa1ad;
    --accent: #5b8cff; --ok: #3fbf6f; --warn: #e0a83c; --err: #e05a5a;
  }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
         max-width: 820px; margin: 0 auto; padding: 32px 20px 80px; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .subtitle { color: var(--text-dim); font-size: 13px; margin-bottom: 28px; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 20px; }
  .panel h2 { font-size: 14px; margin: 0 0 14px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.03em; }
  .text { font-size: 14px; line-height: 1.6; overflow-wrap: anywhere; }
  .text ul { margin: 0 0 10px; padding-left: 20px; }
  .text li { margin-bottom: 6px; }
  .text a { color: var(--accent); }
  code { font-size: 12.5px; }
  .brand-row { margin-bottom: 24px; }
  .brand-logo { display: block; width: 100%; height: auto; border-radius: 10px; }
  .top-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .lang-btn { width: auto; background: var(--chip); color: var(--text); border: none; border-radius: 6px; padding: 6px 14px; font-size: 12px; cursor: pointer; flex-shrink: 0; }
  .site-footer { margin-top: 40px; padding: 18px 20px; background: #f5f6f8; border: 1px solid #e3e5ea; border-radius: 10px; color: #4b4f58; }
  .footer-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .footer-logo { height: 48px; width: auto; flex-shrink: 0; }
  .footer-text { font-size: 13px; line-height: 1.6; }
  .footer-li { display: inline-flex; vertical-align: middle; margin: 0 2px; }
  .site-footer a { color: #2563eb; text-decoration: none; font-weight: 600; }
  .site-footer a:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="brand-row">
  <img src="banner.png" alt="ChainIntegrate" class="brand-logo" onerror="this.style.display='none'">
</div>

<div class="top-row">
  <div>
    <h1 data-i18n="h1">La pagina Invia ora è in UP Wallet</h1>
    <div class="subtitle" data-i18n="subtitle"></div>
  </div>
  <button class="lang-btn" id="langToggle" data-i18n="langToggleBtn">English</button>
</div>

<div class="panel">
  <div class="text" data-i18n-html="body"></div>
</div>

<div class="site-footer">
  <div class="footer-row">
    <img src="logo.png" alt="ChainIntegrate" class="footer-logo" onerror="this.style.display='none'">
    <div class="footer-text" data-i18n-html="footerHtml"></div>
  </div>
</div>

<script>
// Static text only: every string below is written in this file, none comes from outside.
// The Send page was merged into UP Wallet (panel 6); this page stays so old links keep working.
let LANG = new URLSearchParams(location.search).get("lang") === "en" ? "en" : "it";
const I18N = {
  it: {
    pageTitle: "Invia — ora in UP Wallet — ChainIntegrate",
    h1: "La pagina Invia ora è in UP Wallet",
    subtitle: "Valuta, token e NFT dalla tua Universal Profile si inviano dal pannello 6 di UP Wallet.",
    langToggleBtn: "English",
    body: `Il pannello <b>6 · Invia dalla UP</b> di <a href="up-wallet.html">UP Wallet</a> fa tutto quello che faceva questa pagina, sul computer e nell'app Android:
    <ul>
      <li>valuta della rete, token ERC-20 / LSP7 e NFT (LSP8, ERC-721, ERC-1155), con il pulsante <b>Tutto</b>;</li>
      <li>l'elenco di quello che la UP possiede (tocca una riga per sceglierla), compresi i token segnalati come spam, mostrati a richiesta;</li>
      <li>il destinatario per indirizzo o per nome di Universal Profile;</li>
      <li>i controlli prima di firmare (permessi del controller, saldi, possesso dell'NFT), la simulazione, il gas pagato dal relayer del sito dove è attivo, e la verifica sulla catena dopo l'invio.</li>
    </ul>
    Non serve collegare una dApp: bastano la rete, l'indirizzo della UP e MetaMask con il controller (pannelli 1–3).<br><br>
    <a href="up-wallet.html">Apri UP Wallet →</a>`,
    footerHtml: `Servizi di consulenza in integrazione dati &amp; blockchain a cura di ChainIntegrate <a href="https://www.linkedin.com/company/chainintegrate" target="_blank" rel="noopener" aria-label="LinkedIn" class="footer-li"><svg width="20" height="20" viewBox="0 0 20 20"><rect width="20" height="20" rx="4" fill="#0A66C2"/><text x="10" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#fff">in</text></svg></a> · <a href="https://t.me/Simone_1977_2" target="_blank" rel="noopener">Assistenza via Telegram</a> · <a href="https://github.com/ChainIntegrate/Cross_Chain" target="_blank" rel="noopener">Codice sorgente su GitHub</a> · <a href="https://github.com/ChainIntegrate/up-wallet-android" target="_blank" rel="noopener">App Android (in prova)</a>`,
  },
  en: {
    pageTitle: "Send — now in UP Wallet — ChainIntegrate",
    h1: "The Send page is now in UP Wallet",
    subtitle: "Currency, tokens and NFTs are sent from your Universal Profile in panel 6 of UP Wallet.",
    langToggleBtn: "Italiano",
    body: `Panel <b>6 · Send from the UP</b> of <a href="up-wallet.html">UP Wallet</a> does everything this page did, on the computer and in the Android app:
    <ul>
      <li>the network's currency, ERC-20 / LSP7 tokens and NFTs (LSP8, ERC-721, ERC-1155), with the <b>All</b> button;</li>
      <li>the list of what the UP holds (tap a row to choose it), including spam-flagged tokens, shown on request;</li>
      <li>the recipient by address or by Universal Profile name;</li>
      <li>the checks before signing (controller permissions, balances, NFT ownership), the simulation, the gas paid by the site relayer where it is active, and the check on the chain after the send.</li>
    </ul>
    No dApp needs to be connected: the network, the UP address and MetaMask with the controller are enough (panels 1–3).<br><br>
    <a href="up-wallet.html">Open UP Wallet →</a>`,
    footerHtml: `Data &amp; blockchain integration consulting by ChainIntegrate <a href="https://www.linkedin.com/company/chainintegrate" target="_blank" rel="noopener" aria-label="LinkedIn" class="footer-li"><svg width="20" height="20" viewBox="0 0 20 20"><rect width="20" height="20" rx="4" fill="#0A66C2"/><text x="10" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#fff">in</text></svg></a> · <a href="https://t.me/Simone_1977_2" target="_blank" rel="noopener">Support via Telegram</a> · <a href="https://github.com/ChainIntegrate/Cross_Chain" target="_blank" rel="noopener">Source code on GitHub</a> · <a href="https://github.com/ChainIntegrate/up-wallet-android" target="_blank" rel="noopener">Android app (in testing)</a>`,
  },
};
const t = (k) => I18N[LANG][k] ?? I18N.it[k] ?? k;
function applyI18n() {
  document.documentElement.lang = LANG;
  document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = t(el.getAttribute("data-i18n")); });
  document.querySelectorAll("[data-i18n-html]").forEach((el) => { el.innerHTML = t(el.getAttribute("data-i18n-html")); });
}
applyI18n();
document.getElementById("langToggle").addEventListener("click", () => { LANG = LANG === "it" ? "en" : "it"; applyI18n(); });
</script>
</body>
</html>
