function t(key, vars) {
  const entry = I18N[LANG][key];
  return typeof entry === "function" ? entry(vars || {}) : entry;
}

function applyI18n() {
  document.documentElement.lang = LANG;
  document.title = t("pageTitle");
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.getAttribute("data-i18n")); });
  document.querySelectorAll("[data-i18n-html]").forEach(el => { el.innerHTML = t(el.getAttribute("data-i18n-html")); });
  document.querySelectorAll("[data-i18n-placeholder]").forEach(el => { el.placeholder = t(el.getAttribute("data-i18n-placeholder")); });
  if (!source) $("sourceStatus").innerHTML = `<span class="empty">${t("notLoaded")}</span>`;
  if (!signerAddress) $("signerStatus").innerHTML = `<span class="empty">${t("notConnected")}</span>`;
}
$("langToggle").addEventListener("click", () => {
  LANG = LANG === "it" ? "en" : "it";
  applyI18n();
});

// Nick's deterministic deployment proxy: same address on almost every EVM chain. Its calldata
// is salt (32 bytes) ++ init code, and it deploys with CREATE2(salt, init code).
const NICK_FACTORY = "0x4e59b44847b379578588920cA78FbF26c0B4956C";
const LUKSO_RPC = "https://rpc.mainnet.lukso.network";
const LUKSO_EXPLORER_API = "https://explorer.execution.mainnet.lukso.network/api/v2/addresses/";

const CHAINS = [

// Upper bound of the gas price, read straight from the RPC. ethers' getFeeData() is avoided on
// purpose: on some chains (e.g. Polygon) it calls a third-party gas-station API and fails when
// that service is down or blocked. Same formula as ethers: 2 * baseFee + priority fee.
async function estimateMaxGasPrice(provider) {
  const gasPrice = BigInt(await provider.send("eth_gasPrice", []));
  const block = await provider.send("eth_getBlockByNumber", ["latest", false]);
  if (!block || !block.baseFeePerGas) return gasPrice;
  const baseFee = BigInt(block.baseFeePerGas);
  const tip = gasPrice > baseFee ? gasPrice - baseFee : 0n;
  return 2n * baseFee + tip;
}

// --- State and invalidation ---
let source = null;         // verified original deploy read from LUKSO
let signerProvider = null, signerAddress = null;
let lastCheckOk = false;
let checkedContext = null; // { rpc, chainId, signer, gasLimit }

function invalidateCheck() {
  if (lastCheckOk) log(t("staleCheckLog"), "line-warn");
  lastCheckOk = false;
  checkedContext = null;
  $("publishBtn").disabled = true;
}
function resetSource() {
  source = null;
  $("sourceStatus").innerHTML = `<span class="empty">${t("notLoaded")}</span>`;

}
["implAddress", "txHash"].forEach(id => $(id).addEventListener("input", resetSource));

// --- 1. Read and verify the original deploy on LUKSO ---
async function findCreationTx(impl) {
  // Blockscout API of the LUKSO explorer; best effort, the user can paste the hash instead.
  try {
    const res = await fetch(LUKSO_EXPLORER_API + impl, { referrerPolicy: "no-referrer" });
    if (!res.ok) return null;
    const j = await res.json();
    const h = j.creation_transaction_hash || j.creation_tx_hash;
    return typeof h === "string" && /^0x[0-9a-fA-F]{64}$/.test(h) ? h : null;
  } catch (e) {
    return null;
  }
}

function showSourceError(msg) {
  $("sourceStatus").innerHTML = `<span class="badge err">${escapeHtml(msg)}</span>`;
}

$("loadBtn").addEventListener("click", async () => {
  source = null;
  invalidateCheck();
  const implRaw = $("implAddress").value.trim();
  if (!ethers.isAddress(implRaw)) { showSourceError(t("invalidImpl")); return; }
  const impl = ethers.getAddress(implRaw);
  $("sourceStatus").innerHTML = `<span class="empty">${t("loading")}</span>`;

  try {
    const lukso = new ethers.JsonRpcProvider(LUKSO_RPC, 42, { staticNetwork: true, batchMaxCount: 1 });
    const code = await lukso.getCode(impl);
    if (code === "0x") { showSourceError(t("implNotOnLukso")); return; }

    let txHash = $("txHash").value.trim();
    if (!txHash) {
      txHash = await findCreationTx(impl);
      if (!txHash) { showSourceError(t("creationTxNotFound")); return; }
      $("txHash").value = txHash;
    }
    if (!/^0x[0-9a-fA-F]{64}$/.test(txHash)) { showSourceError(t("txNotFound")); return; }

    const tx = await lukso.getTransaction(txHash);
    if (!tx) { showSourceError(t("txNotFound")); return; }
    if (!tx.to || tx.to.toLowerCase() !== NICK_FACTORY.toLowerCase()) {
      showSourceError(t("notViaFactory", { to: tx.to || "(contract creation)" }));
      return;
    }
    const data = tx.data;
    if (data.length <= 2 + 64) { showSourceError(t("txNotFound")); return; }
    const salt = "0x" + data.slice(2, 66);
    const initCode = "0x" + data.slice(66);
    const predicted = ethers.getCreate2Address(NICK_FACTORY, salt, ethers.keccak256(initCode));
    if (predicted.toLowerCase() !== impl.toLowerCase()) {
      showSourceError(t("addressMismatch", { predicted, impl }));
      return;
    }

    source = { impl, txHash, data, runtimeHash: ethers.keccak256(code), codeBytes: (code.length - 2) / 2 };
    $("sourceStatus").innerHTML =
      `<span class="badge ok">OK</span> ${escapeHtml(t("sourceOk", { tx: txHash, impl }))}<br>` +
      escapeHtml(t("sourceSize", { bytes: source.codeBytes }));
  } catch (e) {
    showSourceError(t("genericError", { err: e.shortMessage || e.message }));
  }
});

// --- 2. Signing wallet ---
const discoveredProviders = [];
window.addEventListener("eip6963:announceProvider", (e) => discoveredProviders.push(e.detail));
window.dispatchEvent(new Event("eip6963:requestProvider"));

let watchedSigner = null;
function watchSigner(p) {
  if (watchedSigner === p || typeof p.on !== "function") return;
  watchedSigner = p;
  p.on("chainChanged", invalidateCheck);
  p.on("accountsChanged", (accs) => { signerAddress = accs && accs[0] ? accs[0] : null; invalidateCheck(); });
}

$("connectSigner").addEventListener("click", async () => {
  let candidate = discoveredProviders.find(p => !/lukso|universal profile/i.test(p.info.name))?.provider;
  if (!candidate && window.ethereum && window.ethereum !== window.lukso) candidate = window.ethereum;
  if (!candidate) {
    $("signerStatus").innerHTML = `<span class="badge err">${t("noSignerFound")}</span>`;
    return;
  }
  try {
    const accounts = await candidate.request({ method: "eth_requestAccounts" });
    signerAddress = accounts[0];
    signerProvider = candidate;
    watchSigner(candidate);
    invalidateCheck();
    let netLabel = "";
    try {
      netLabel = ` · chainId ${parseInt(await candidate.request({ method: "eth_chainId" }), 16)}`;
    } catch (e) { /* the address is shown anyway */ }
    $("signerStatus").innerHTML = `<span class="badge ok">${t("connectedBadge")}</span> ${escapeHtml(signerAddress + netLabel)}`;
  } catch (e) {
    $("signerStatus").innerHTML = `<span class="badge err">${t("connectionRejected")}</span>`;
  }
});

// The transaction is signed on the wallet's chain while every check runs against the RPC:
// both must be the selected chain.
async function checkChains(net, provider) {
  const rpcChainId = Number(await provider.send("eth_chainId", []));
  const expectedChainId = net.chainId || rpcChainId;
  if (rpcChainId !== expectedChainId) {
    return { ok: false, msg: t("rpcChainMismatch", { rpcChainId, netName: net.name, chainId: expectedChainId }) };
  }
  let walletChainId;
  try {
    walletChainId = parseInt(await signerProvider.request({ method: "eth_chainId" }), 16);
  } catch (e) {
    return { ok: false, msg: t("walletNetworkCheckFailed") };
  }
  if (walletChainId !== expectedChainId) {
    return { ok: false, msg: t("walletWrongNetwork", { walletChainId, netName: net.name, chainId: expectedChainId }) };
  }
  return { ok: true, chainId: expectedChainId };
}

// --- 4. Verify ---
$("checkBtn").addEventListener("click", async () => {
  $("log").innerHTML = "";
  lastCheckOk = false;
  checkedContext = null;
  $("publishBtn").disabled = true;

  if (!source) { log(t("loadSourceFirst"), "line-err"); return; }
  if (!signerAddress) { log(t("connectSignerFirst"), "line-err"); return; }
  const net = getNetwork();
  if (!net || !net.rpc) { log(t("missingRpc"), "line-err"); return; }

  try {
    const provider = new ethers.JsonRpcProvider(net.rpc, undefined, { batchMaxCount: 1 });
    const chains = await checkChains(net, provider);
    if (!chains.ok) { log(chains.msg, "line-err"); return; }
    log(t("chainsOk", { chainId: chains.chainId }), "line-ok");

    if ((await provider.getCode(NICK_FACTORY)) === "0x") { log(t("noFactory"), "line-err"); return; }
    log(t("factoryOk"), "line-ok");

    const existing = await provider.getCode(source.impl);
    if (existing !== "0x") {
      if (ethers.keccak256(existing) === source.runtimeHash) log(t("alreadyPublished", { net: net.name }), "line-ok");
      else log(t("differentCode"), "line-err");
      return;
    }
    log(t("freeOk"), "line-ok");

    const gasEstimate = await provider.estimateGas({ from: signerAddress, to: NICK_FACTORY, data: source.data })
      .catch(e => { log(t("gasFail", { err: e.shortMessage || e.message }), "line-err"); throw e; });
    log(t("gasOk", { gas: gasEstimate.toString() }), "line-ok");

    const gasPrice = await estimateMaxGasPrice(provider);
    if (!gasPrice) { log(t("noGasPrice"), "line-err"); return; }
    const gasLimit = gasEstimate + gasEstimate / 5n; // +20%: large init code, estimates can be tight
    const cost = gasLimit * gasPrice;
    log(t("costLog", { cost: ethers.formatEther(cost) }), "line-dim");
    const balance = await provider.getBalance(signerAddress);
    if (balance < cost) { log(t("insufficientBalance", { shortfall: ethers.formatEther(cost - balance) }), "line-err"); return; }
    log(t("balanceOk"), "line-ok");

    lastCheckOk = true;
    checkedContext = { rpc: net.rpc, chainId: chains.chainId, signer: signerAddress, gasLimit };
    $("publishBtn").disabled = false;
    log(t("readyLog"), "line-warn");
  } catch (e) {
    log(t("genericError", { err: e.shortMessage || e.message }), "line-err");
  }
});

// --- 4. Publish ---
$("publishBtn").addEventListener("click", async () => {
  if (!lastCheckOk || !checkedContext || !source) return;
  $("publishBtn").disabled = true;
  const net = getNetwork();
  const ctx = checkedContext;

  try {
    if (!net || net.rpc !== ctx.rpc) { log(t("staleCheckLog"), "line-err"); return; }
    const walletChainId = parseInt(await signerProvider.request({ method: "eth_chainId" }), 16);
    if (walletChainId !== ctx.chainId) {
      log(t("walletWrongNetwork", { walletChainId, netName: net.name, chainId: ctx.chainId }), "line-err");
      return;
    }
    const signerObj = await new ethers.BrowserProvider(signerProvider).getSigner();
    if (signerObj.address.toLowerCase() !== ctx.signer.toLowerCase()) {
      log(t("signerChanged", { now: signerObj.address, checked: ctx.signer }), "line-err");
      return;
    }

    log(t("sendingLog"), "line-dim");
    const tx = await signerObj.sendTransaction({ to: NICK_FACTORY, data: source.data, gasLimit: ctx.gasLimit });
    log(t("txHashLog", { hash: tx.hash }), "line-dim");
    log(t("waitingLog"), "line-dim");
    const receipt = await tx.wait();
    if (!receipt || receipt.status !== 1) { log(t("txFailed"), "line-err"); return; }

    const provider = new ethers.JsonRpcProvider(net.rpc, undefined, { batchMaxCount: 1 });
    let code = "0x";
    const attempts = 6;
    for (let i = 0; i < attempts; i++) {
      code = await provider.getCode(source.impl);
      if (code !== "0x") break;
      if (i < attempts - 1) {
        log(t("waitingIndexLog", { i: i + 1, n: attempts }), "line-dim");
        await new Promise(r => setTimeout(r, 2500));
      }
    }
    if (code !== "0x" && ethers.keccak256(code) === source.runtimeHash) {
      log(t("publishedOk", { net: net.name, impl: source.impl }), "line-ok");
      if (net.explorer) log(net.explorer + source.impl, "line-dim");
      log(t("nextStepLog"), "line-dim");
    } else {
      log(t("publishedMismatch"), "line-err");
    }
  } catch (e) {
    log(t("genericError", { err: e.shortMessage || e.message }), "line-err");
  } finally {
    lastCheckOk = false;
    checkedContext = null;
  }
});

applyI18n();
</script>
