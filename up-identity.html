<div class="panel">

  </div>
</div>

<div class="panel">

  <input type="text" id="upAddress" placeholder="0x...">
  <button id="readBtn" data-i18n="readBtn">Leggi il profilo</button>
  <div class="status" id="status"></div>
</div>

<div class="panel" id="resultPanel" hidden>

</div>

  <div id="ctrlList"></div>
</div>

<div class="panel" id="pubPanel" hidden>

  <div class="status" id="pubState"></div>
  <button id="pubConnect" class="secondary" data-i18n="pubConnectBtn">Connetti il controller della UP (MetaMask)</button>
  <div class="status" id="pubSigner"></div>
  <button id="pubBtn" class="danger" disabled data-i18n="pubBtn">Pubblica il profilo di LUKSO su questa rete (una transazione)</button>
  <div id="pubLog"></div>
</div>

<div class="panel" id="assetPanel" hidden>

    <div class="assets" id="assetsLukso"></div>
  </div>
</div>

<div class="site-footer">

// ==================== LSP2 VerifiableURI ====================
// New format: 0x0000 + method (4) + hash length (2) + hash + URI. Old JSONURL: method (4) + hash (32) + URI.
function decodeVerifiableUri(value) {
  if (!value || value === "0x") return null;
  const b = ethers.getBytes(value);
  let method, hash, uriBytes;
  if (b.length >= 8 && b[0] === 0 && b[1] === 0) {
    method = ethers.hexlify(b.slice(2, 6));
    const len = (b[6] << 8) | b[7];
    hash = ethers.hexlify(b.slice(8, 8 + len));
    uriBytes = b.slice(8 + len);
  } else if (b.length >= 36) {
    method = ethers.hexlify(b.slice(0, 4));
    hash = ethers.hexlify(b.slice(4, 36));
    uriBytes = b.slice(36);
  } else return { bad: true };
  let uri;
  try { uri = ethers.toUtf8String(uriBytes); } catch (e) { return { bad: true }; }
  return { method, hash, uri };
}
// Resolves ipfs:// and https:// to the URLs to try, in order. Anything else is not fetched.
function urlsFor(uri) {
  if (/^ipfs:\/\//i.test(uri)) { const p = uri.replace(/^ipfs:\/\//i, "").replace(/^ipfs\//, ""); return IPFS_GATEWAYS.map(g => g + p); }
  if (/^https:\/\//i.test(uri)) return [uri];
  return [];
}
async function fetchBytes(uri) {
  if (/^data:/i.test(uri)) {
    const m = uri.match(/^data:[^,]*?(;base64)?,(.*)$/is);
    if (!m) throw new Error("data URI");
    return m[1] ? ethers.decodeBase64(m[2]) : ethers.toUtf8Bytes(decodeURIComponent(m[2]));
  }
  const urls = urlsFor(uri);
  if (!urls.length) throw new Error(uri);
  let lastErr = null;
  for (const u of urls) {
    try {
      const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), 15000);
      const r = await fetch(u, { signal: ctl.signal, referrerPolicy: "no-referrer" });
      clearTimeout(tm);
      if (!r.ok) { lastErr = new Error(`HTTP ${r.status}`); continue; }
      return new Uint8Array(await r.arrayBuffer());
    } catch (e) { lastErr = e; }
  }
  throw lastErr || new Error("fetch");
}
// Images: tried on each gateway in turn; the first that loads becomes the element's background.
// Only ipfs:// (through a gateway) and https:// are used, set through the DOM, never as HTML.
function setImage(elem, uri, onOk) {
  const urls = /^data:image\//i.test(uri || "") ? [uri] : urlsFor(uri || "");
  const next = (i) => {
    if (i >= urls.length) return;
    const img = new Image();
    img.referrerPolicy = "no-referrer";
    img.onload = () => { elem.style.backgroundImage = `url("${encodeURI(urls[i])}")`; if (onOk) onOk(); };
    img.onerror = () => next(i + 1);
    img.src = urls[i];
  };
  next(0);
}

// Reads LSP3Profile on one network: { state: "noUp" | "none" | "bad" | "fetchFail" | "ok" | "hashBad", ... }
async function readProfile(net, up) {
  const provider = new ethers.JsonRpcProvider(net.rpc, undefined, { batchMaxCount: 1 });
  const id = Number(await provider.send("eth_chainId", []));
  if (net.chainId && id !== net.chainId) return { state: "rpc", id };
  if ((await provider.getCode(up)) === "0x") return { state: "noUp", provider, chainId: id };
  const raw = await new ethers.Contract(up, UP_ABI, provider).getData(LSP3_KEY);
  const v = decodeVerifiableUri(raw);
  if (!v) return { state: "none", provider, chainId: id, raw };
  if (v.bad) return { state: "bad", provider, chainId: id, raw };
  let bytes;
  try { bytes = await fetchBytes(v.uri); } catch (e) { return { state: "fetchFail", err: e.message || String(e), provider, chainId: id, raw, ...v }; }
  const known = v.method.toLowerCase() === KECCAK_UTF8;
  const verified = known && ethers.keccak256(bytes).toLowerCase() === v.hash.toLowerCase();
  if (known && !verified) return { state: "hashBad", provider, chainId: id, raw, ...v };
  let json = null;
  try { json = JSON.parse(ethers.toUtf8String(bytes)); } catch (e) { return { state: "bad", provider, chainId: id, raw, ...v }; }
  return { state: "ok", verified, provider, chainId: id, raw, json: json && json.LSP3Profile ? json.LSP3Profile : json, ...v };
}

    d.append(el("div", "line-dim", `${role} · 0x${x.perms.toString(16)}`));
    box.appendChild(d);
  });
}

// Section 5: both networks read in parallel; each column fills in when its read finishes.
// Token and collection images. Indexer rows carry a URL; LSP7/LSP8 rows carry the asset's LSP4Metadata
// value, resolved here like LSP3 (file downloaded, hash checked when the method is known, a mismatch
// shows no image): the collection icon first, else the first image. One resolution per asset per read.
const lsp4Images = new Map();
function lsp4Image(raw) {
  if (!lsp4Images.has(raw)) lsp4Images.set(raw, (async () => {
    const v = decodeVerifiableUri(raw);
    if (!v || v.bad) return null;
    const bytes = await fetchBytes(v.uri);
    if (v.method.toLowerCase() === KECCAK_UTF8 && ethers.keccak256(bytes).toLowerCase() !== v.hash.toLowerCase()) return null;
    const j = JSON.parse(ethers.toUtf8String(bytes));
    const m = (j && j.LSP4Metadata) || j || {};
    return pickImage(m.icon, 64) || (Array.isArray(m.images) && Array.isArray(m.images[0]) ? pickImage(m.images[0], 128) : null);
  })().catch(() => null));
  return lsp4Images.get(raw);
}
function showThumb(thumb, r) {
  const set = (url) => { if (url) setImage(thumb, url, () => thumb.classList.add("has-img")); };
  if (r.image) { set(r.image); return; }
  if (r.lsp4Metadata) lsp4Image(r.lsp4Metadata).then(url => { if (url) { r.image = url; set(url); } });
}

// Results are kept by read (seq), so a column that finishes before the profile is rendered is not lost.
let assets = { seq: 0 };
function loadAssets(my, net, rn, rl, up) {
  $("assetPanel").hidden = false;
  assets = { seq: my };
  const one = (side, p, key) => {
    const done = (a) => {
      if (assets.seq !== my) return;
      assets[side] = a;
      if (last && last.seq === my) render(last);
    };
    if (p.state === "noUp") { done(null); return; }
    if (!p.provider) { done({ failed: p.err || "RPC" }); return; }
    AssetList.list(p.provider, up, key).then(done, (e) => done({ failed: e.message }));
  };
  one("net", rn, net.key);
  one("lukso", rl, LUKSO.key);
}

// ==================== 6. PUBLISH (align LSP3Profile with LUKSO) ====================
// One Key Manager transaction: UP.setData(LSP3Profile, <LUKSO's value>), signed by a controller on
// the chosen network. Only LUKSO's value, verified on this read (hash checked), is ever written;
// everything is read again right before signing, simulated, and checked after confirmation.
const SUPER_SETDATA = 1n << 17n, SETDATA = 1n << 18n;
const KM_IFACE = new ethers.Interface(["function execute(bytes) payable returns (bytes)"]);
const UP_W_IFACE = new ethers.Interface(["function setData(bytes32,bytes)", "function getData(bytes32) view returns (bytes)", "function getDataBatch(bytes32[]) view returns (bytes[])", "function owner() view returns (address)"]);
let pubWallet = null, pubAddr = null, pubBusy = false;
const discovered = [];
window.addEventListener("eip6963:announceProvider", (e) => discovered.push(e.detail));
window.dispatchEvent(new Event("eip6963:requestProvider"));

function pubLog(msg, cls) { const d = el("div", cls || "", msg); $("pubLog").appendChild(d); }
// Can `addr` write LSP3Profile on this UP? { ok, why } or { ctrl: false } / { ctrl: true, ok: false }.
async function lsp3Permission(provider, up, addr) {
  const [perm, keys] = await new ethers.Contract(up, UP_W_IFACE, provider).getDataBatch([BackupCheck.permKey(addr), BackupCheck.dataKeysKey(addr)]);
  const p = perm && perm !== "0x" ? BigInt(perm) : 0n;
  if (p === 0n) return { ctrl: false };
  if (p & SUPER_SETDATA) return { ctrl: true, ok: true, why: t("pubWhySuper") };
  if (p & SETDATA) {
    // AllowedERC725YDataKeys: a CompactBytesArray of keys or key prefixes (2-byte length + bytes).
    const b = keys && keys !== "0x" ? ethers.getBytes(keys) : new Uint8Array();
    for (let i = 0; i + 2 <= b.length;) {
      const n = (b[i] << 8) | b[i + 1];
      const k = ethers.hexlify(b.slice(i + 2, i + 2 + n)).toLowerCase();
      if (n >= 1 && n <= 32 && LSP3_KEY.startsWith(k)) return { ctrl: true, ok: true, why: t("pubWhyAllowed") };
      i += 2 + n;
    }
  }
  return { ctrl: true, ok: false };
}
// The state of section 6 for the current read: what can be done, and with which signer.
async function renderPub() {
  const r = last;
  const show = !!(r && r.net && r.net.provider && r.net.state !== "noUp" && r.net.chainId !== LUKSO.chainId);
  $("pubPanel").hidden = !show;
  if (!show) return;
  const src = r.lukso;
  const ready = src && src.state === "ok" && src.verified;
  const same = ready && r.net.raw && r.net.raw.toLowerCase() === src.raw.toLowerCase();
  setStatus("pubState", !ready ? t("pubNeedLukso") : same ? t("pubSame") : t("pubReady"), !ready ? "line-warn" : same ? "line-ok" : "line-dim");
  let can = false;
  if (!pubAddr) setStatus("pubSigner", t("pubSignerNone"), "line-dim");
  else {
    try {
      const perm = await lsp3Permission(r.net.provider, r.up, pubAddr);
      if (r !== last) return;
      if (!perm.ctrl) setStatus("pubSigner", t("pubSignerNot", { addr: pubAddr }), "line-err");
      else if (!perm.ok) setStatus("pubSigner", t("pubSignerNoPerm", { addr: pubAddr }), "line-err");
      else { setStatus("pubSigner", t("pubSignerOk", { addr: pubAddr, why: perm.why }), "line-ok"); can = true; }
    } catch (e) { setStatus("pubSigner", t("pubError", { err: e.shortMessage || e.message }), "line-err"); }
  }
  $("pubBtn").disabled = pubBusy || !ready || same || !can;
  $("pubConnect").disabled = pubBusy;
}
$("pubConnect").addEventListener("click", async () => {
  const w = discovered.find(p => !/lukso|universal profile/i.test(p.info.name))?.provider || (window.ethereum && window.ethereum !== window.lukso ? window.ethereum : null);
  if (!w) { setStatus("pubSigner", t("pubNoWallet"), "line-err"); return; }
  try {
    // The wallet's account picker every time, so the signer can be chosen (genesis key or backup).
    try { await w.request({ method: "wallet_requestPermissions", params: [{ eth_accounts: {} }] }); } catch (e) { if (e && e.code === 4001) throw e; }
    const accs = await w.request({ method: "eth_requestAccounts" });
    pubWallet = w; pubAddr = ethers.getAddress(accs[0]);
    if (typeof w.on === "function" && !w.__idWatched) {
      w.__idWatched = true;
      w.on("accountsChanged", (a) => { pubAddr = a && a[0] ? ethers.getAddress(a[0]) : null; renderPub(); });
    }
  } catch (e) { setStatus("pubSigner", t("pubRejected"), "line-err"); return; }
  renderPub();
});
$("pubBtn").addEventListener("click", async () => {
  const r = last;
  if (pubBusy || !r || !pubWallet || !pubAddr) return;
  pubBusy = true; $("pubBtn").disabled = true; $("pubConnect").disabled = true; $("readBtn").disabled = true;
  const provider = r.net.provider, up = r.up, value = r.lukso.raw;
  let reread = false;
  pubLog(t("pubStart", { time: new Date().toLocaleTimeString(), up, net: r.netName }), "line-dim");
  try {
    // Read again: LUKSO's value and this network's must still be the ones shown.
    const luksoNow = await new ethers.Contract(up, UP_W_IFACE, r.lukso.provider).getData(LSP3_KEY);
    const netNow = await new ethers.Contract(up, UP_W_IFACE, provider).getData(LSP3_KEY);
    if (luksoNow.toLowerCase() !== value.toLowerCase() || (netNow || "0x").toLowerCase() !== (r.net.raw || "0x").toLowerCase()) { pubLog(t("pubChanged"), "line-err"); return; }
    const walletChain = parseInt(await pubWallet.request({ method: "eth_chainId" }), 16);
    if (walletChain !== r.net.chainId) { pubLog(t("pubWrongChain", { got: walletChain, net: r.netName, exp: r.net.chainId }), "line-err"); return; }
    const perm = await lsp3Permission(provider, up, pubAddr);
    if (!perm.ok) { pubLog(perm.ctrl ? t("pubSignerNoPerm", { addr: pubAddr }) : t("pubSignerNot", { addr: pubAddr }), "line-err"); return; }
    const km = ethers.getAddress(await new ethers.Contract(up, UP_W_IFACE, provider).owner());
    const data = KM_IFACE.encodeFunctionData("execute", [UP_W_IFACE.encodeFunctionData("setData", [LSP3_KEY, value])]);
    pubLog(t("pubPlan", { signer: pubAddr, km, net: r.netName, uri: r.lukso.uri }), "line-dim");
    pubLog(t("pubSimulating"), "line-dim");
    try { await provider.call({ from: pubAddr, to: km, data }); }
    catch (e) { pubLog(t("pubSimFail", { err: e.shortMessage || e.reason || e.message }), "line-err"); return; }
    // The signer pays the gas: check its balance before the wallet opens (a fresh backup key often
    // holds nothing on this network, and the wallet then shows only a generic fee alert).
    const cur = r.netDef.currency && r.netDef.currency !== "?" ? r.netDef.currency : "";
    try {
      const [gas, fee, bal] = await Promise.all([provider.estimateGas({ from: pubAddr, to: km, data }), provider.getFeeData(), provider.getBalance(pubAddr)]);
      const price = fee.maxFeePerGas || fee.gasPrice;
      if (price) {
        const cost = gas * price;
        const v = { addr: pubAddr, bal: ethers.formatEther(bal), cost: ethers.formatEther(cost), cur };
        if (bal < cost) { pubLog(t("pubNoGas", v), "line-err"); return; }
        pubLog(t("pubGasOk", v), "line-dim");
      }
    } catch (e) { /* no estimate: the wallet still shows its own fee */ }
    pubLog(t("pubSimOk"), "line-ok");
    const signer = await new ethers.BrowserProvider(pubWallet).getSigner();
    if (signer.address.toLowerCase() !== pubAddr.toLowerCase()) { pubLog(t("pubSignerChanged", { now: signer.address, checked: pubAddr }), "line-err"); return; }
    const tx = await signer.sendTransaction({ to: km, data });
    pubLog(t("pubTx", { hash: tx.hash }), "line-dim");
    const url = getExplorerUrl(r.netDef, "/tx/", tx.hash);
    if (url) pubLog(url, "line-dim");
    pubLog(t("pubWaiting"), "line-dim");
    const receipt = await waitReceipt(provider, tx.hash, signer.provider);
    if (!receipt) { pubLog(t("pubNoReceipt"), "line-warn"); return; }
    if (receipt.status !== 1) { pubLog(t("pubTxFailed"), "line-err"); return; }
    // Public RPCs are load-balanced: read at the receipt's block, retrying while a node lags behind.
    let got = null;
    for (let i = 0; i < 6; i++) {
      if (i) await new Promise(res => setTimeout(res, 1500));
      // At the receipt's block; if the RPC refuses a read at a past block, at the latest one.
      const upC = new ethers.Contract(up, UP_W_IFACE, provider);
      try { got = await upC.getData(LSP3_KEY, { blockTag: receipt.blockNumber }); } catch (e) { got = await upC.getData(LSP3_KEY).catch(() => null); }
      if (got && got.toLowerCase() === value.toLowerCase()) break;
    }
    if (got && got.toLowerCase() === value.toLowerCase()) pubLog(t("pubOk"), "line-ok");
    else pubLog(t("pubVerifyBad", { what: `LSP3Profile ${got ? got.slice(0, 20) + "…" : "?"}` }), "line-warn");
    reread = true;
  } catch (e) {
    if (e && (e.code === "ACTION_REJECTED" || e.code === 4001 || (e.info && e.info.error && e.info.error.code === 4001))) pubLog(t("pubCancelled"), "line-warn");
    else pubLog(t("pubError", { err: e.shortMessage || e.message }), "line-err");
  } finally {
    pubBusy = false; $("readBtn").disabled = false;
    // After a confirmed transaction, read everything again: the cards then show the aligned profile.
    if (reread) $("readBtn").click(); else renderPub();
  }
});

$("readBtn").addEventListener("click", async () => {
  const my = ++readSeq;
  const net = getNetwork();
  const raw = $("upAddress").value.trim();
  if (!net || !net.rpc) { setStatus("status", t("needNet"), "line-err"); return; }
  if (!ethers.isAddress(raw)) { setStatus("status", t("needAddr"), "line-err"); return; }
  const up = ethers.getAddress(raw);
  $("readBtn").disabled = true;
  setStatus("status", t("reading"), "line-dim");
  try {
    const [rn, rl] = await Promise.all([
      readProfile(net, up).catch(e => ({ state: "fetchFail", err: e.shortMessage || e.message })),
      readProfile(LUKSO, up).catch(e => ({ state: "fetchFail", err: e.shortMessage || e.message })),
    ]);
    if (my !== readSeq) return;
    if (rn.state === "rpc") { setStatus("status", t("rpcWrong", { id: rn.id, exp: net.chainId }), "line-err"); return; }
    if (rl.state === "noUp") rl.lukso = true;
    const netName = net.chainId ? net.name : `${t("customNetName")} (chainId ${rn.chainId})`;
    const netDef = { ...net, name: netName };
    loadAssets(my, net, rn, rl, up);
    if (rn.state === "noUp") { setStatus("status", t("notDeployed", { net: netName }), "line-err"); last = { seq: my, up, netName, netDef, net: rn, lukso: rl }; render(last); $("ctrlPanel").hidden = true; return; }
    setStatus("status", "", "");
    let ctrl;
    try { ctrl = await BackupCheck.read(rn.provider, up); } catch (e) { ctrl = { err: e.shortMessage || e.message }; }
    if (my !== readSeq) return;
    last = { seq: my, up, netName, netDef, net: rn, lukso: rl, ctrl };
    render(last);
  } finally {
    if (my === readSeq) $("readBtn").disabled = false;
  }
});

applyI18n();
</script>
</body>
</html>
