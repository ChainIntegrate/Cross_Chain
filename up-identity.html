// ==================== LSP2 VerifiableURI ====================
// New format: 0x0000 + method (4) + hash length (2) + hash + URI. Old JSONURL: method (4) + hash (32) + URI.
function decodeVerifiableUri(value) {
  if (!value || value === "0x") return null;
  const b = ethers.getBytes(value);
  let method, hash, uriBytes;
  if (b.length >= 8 && b[0] === 0 && b[1] === 0) {
    method = ethers.hexlify(b.slice(2, 6));
    const len = (b[6] << 8) | b[7];
    hash = ethers.hexlify(b.slice(8, 8 + len));
    uriBytes = b.slice(8 + len);
  } else if (b.length >= 36) {
    method = ethers.hexlify(b.slice(0, 4));
    hash = ethers.hexlify(b.slice(4, 36));
    uriBytes = b.slice(36);
  } else return { bad: true };
  let uri;
  try { uri = ethers.toUtf8String(uriBytes); } catch (e) { return { bad: true }; }
  return { method, hash, uri };
}
// Resolves ipfs:// and https:// to the URLs to try, in order. Anything else is not fetched.
function urlsFor(uri) {
  if (/^ipfs:\/\//i.test(uri)) { const p = uri.replace(/^ipfs:\/\//i, "").replace(/^ipfs\//, ""); return IPFS_GATEWAYS.map(g => g + p); }
  if (/^https:\/\//i.test(uri)) return [uri];
  return [];
}
async function fetchBytes(uri) {
  if (/^data:/i.test(uri)) {
    const m = uri.match(/^data:[^,]*?(;base64)?,(.*)$/is);
    if (!m) throw new Error("data URI");
    return m[1] ? ethers.decodeBase64(m[2]) : ethers.toUtf8Bytes(decodeURIComponent(m[2]));
  }
  const urls = urlsFor(uri);
  if (!urls.length) throw new Error(uri);
  let lastErr = null;
  for (const u of urls) {
    try {
      const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), 15000);
      const r = await fetch(u, { signal: ctl.signal, referrerPolicy: "no-referrer" });
      clearTimeout(tm);
      if (!r.ok) { lastErr = new Error(`HTTP ${r.status}`); continue; }
      return new Uint8Array(await r.arrayBuffer());
    } catch (e) { lastErr = e; }
  }
  throw lastErr || new Error("fetch");
}
// Images: tried on each gateway in turn; the first that loads becomes the element's background.

    const img = new Image();
    img.referrerPolicy = "no-referrer";
    img.onload = () => { elem.style.backgroundImage = `url("${encodeURI(urls[i])}")`; };
    img.onerror = () => next(i + 1);
    img.src = urls[i];
  };
  next(0);
}

// Reads LSP3Profile on one network: { state: "noUp" | "none" | "bad" | "fetchFail" | "ok" | "hashBad", ... }
async function readProfile(net, up) {
  const provider = new ethers.JsonRpcProvider(net.rpc, undefined, { batchMaxCount: 1 });
  const id = Number(await provider.send("eth_chainId", []));
  if (net.chainId && id !== net.chainId) return { state: "rpc", id };
  if ((await provider.getCode(up)) === "0x") return { state: "noUp", provider, chainId: id };
  const raw = await new ethers.Contract(up, UP_ABI, provider).getData(LSP3_KEY);
  const v = decodeVerifiableUri(raw);
  if (!v) return { state: "none", provider, chainId: id, raw };
  if (v.bad) return { state: "bad", provider, chainId: id, raw };
  let bytes;
  try { bytes = await fetchBytes(v.uri); } catch (e) { return { state: "fetchFail", err: e.message || String(e), provider, chainId: id, raw, ...v }; }
  const known = v.method.toLowerCase() === KECCAK_UTF8;
  const verified = known && ethers.keccak256(bytes).toLowerCase() === v.hash.toLowerCase();
  if (known && !verified) return { state: "hashBad", provider, chainId: id, raw, ...v };
  let json = null;
  try { json = JSON.parse(ethers.toUtf8String(bytes)); } catch (e) { return { state: "bad", provider, chainId: id, raw, ...v }; }
  return { state: "ok", verified, provider, chainId: id, raw, json: json && json.LSP3Profile ? json.LSP3Profile : json, ...v };
}

// ==================== RENDERING ====================
function setStatus(id, text, cls) { const el = $(id); el.className = "status " + (cls || ""); el.textContent = text; }
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function pickImage(list, want) {
  if (!Array.isArray(list) || !list.length) return null;
  const sorted = [...list].filter(i => i && typeof i.url === "string").sort((a, b) => Math.abs((a.width || want) - want) - Math.abs((b.width || want) - want));
  return sorted.length ? sorted[0].url : null;
}
function renderCard(box, where, p) {
  box.innerHTML = "";
  const bg = el("div", "bg"), body = el("div", "body");
  box.append(bg, body);
  const av = el("div", "avatar");
  body.append(av, el("div", "where", where));
  if (!p || p.state === "noUp") { body.append(el("div", "desc", p && p.lukso ? t("luksoNone") : t("noProfile"))); return; }
  if (p.state === "none") { body.append(el("div", "desc", t("noProfile"))); return; }
  if (p.state === "bad") { body.append(el("div", "desc", t("badValue"))); return; }
  if (p.state === "fetchFail") { body.append(el("div", "desc", t("fetchFail", { err: p.err })), el("div", "meta", t("source", { uri: p.uri }))); return; }
  if (p.state === "hashBad") { body.append(el("div", "desc line-err", t("hashBad")), el("div", "meta", t("source", { uri: p.uri }))); return; }
  const j = p.json || {};
  const bgUrl = pickImage(j.backgroundImage, 800), avUrl = pickImage(j.profileImage, 256);
  if (bgUrl) setImage(bg, bgUrl);
  if (avUrl) setImage(av, avUrl);
  body.append(el("div", "name", typeof j.name === "string" && j.name ? j.name : t("noName")));
  if (typeof j.description === "string" && j.description) body.append(el("div", "desc", j.description.slice(0, 2000)));
  if (Array.isArray(j.links) && j.links.length) {
    const ls = el("div", "links");
    j.links.slice(0, 20).forEach(l => {
      if (!l || typeof l.url !== "string" || !/^https?:\/\//i.test(l.url)) return;
      const a = el("a", "", typeof l.title === "string" && l.title ? l.title : l.url);
      a.href = l.url; a.target = "_blank"; a.rel = "noopener noreferrer";
      ls.appendChild(a);
    });
    body.append(ls);
  }
  if (Array.isArray(j.tags) && j.tags.length) {
    const ts = el("div", "tags");
    j.tags.slice(0, 30).forEach(tg => { if (typeof tg === "string") ts.appendChild(el("span", "", tg)); });
    body.append(ts);
  }
  body.append(el("div", "meta " + (p.verified ? "line-ok" : "line-warn"), p.verified ? t("hashOk") : t("hashUnknown")));
  body.append(el("div", "meta", t("source", { uri: p.uri })));
}

let last = null, readSeq = 0;
function render(r) {
  $("resultPanel").hidden = false;
  renderCard($("cardNet"), t("where", { net: r.netName }), r.net);
  renderCard($("cardLukso"), t("whereLukso"), r.lukso);
  const hasNet = r.net && !["none", "noUp"].includes(r.net.state), hasLukso = r.lukso && !["none", "noUp"].includes(r.lukso.state);
  if (hasNet && hasLukso && r.net.raw && r.lukso.raw) setStatus("compare", r.net.raw.toLowerCase() === r.lukso.raw.toLowerCase() ? t("same") : t("diff"), r.net.raw.toLowerCase() === r.lukso.raw.toLowerCase() ? "line-ok" : "line-warn");
  else if (!hasNet && hasLukso) setStatus("compare", t("netEmpty"), "line-dim");
  else if (hasNet && !hasLukso) setStatus("compare", t("luksoEmptyOnly"), "line-dim");
  else setStatus("compare", "", "");
  if (r.ctrl) renderCtrl(r.ctrl);
}
function renderCtrl(c) {
  $("ctrlPanel").hidden = false;
  if (c.err) { setStatus("ctrlStatus", t("ctrlFail", { err: c.err }), "line-err"); $("ctrlList").innerHTML = ""; return; }
  setStatus("ctrlStatus", c.hasBackup ? t("ctrlBackupOk") : t("ctrlBackupNo"), c.hasBackup ? "line-ok" : "line-warn");
  const box = $("ctrlList"); box.innerHTML = "";
  c.controllers.forEach(x => {
    const d = el("div", "ctrl");
    d.append(el("div", "addr", `[${x.index}] ${x.address || "?"}`));
    const admin = (x.perms & BackupCheck.ADMIN) === BackupCheck.ADMIN;
    const role = x.role === "entrypoint" ? t("roleEp") : x.role === "urd" ? t("roleUrd") : x.role === "malformed" ? t("roleBad") : admin ? t("roleAdmin") : t("roleLimited");
    d.append(el("div", "line-dim", `${role} · 0x${x.perms.toString(16)}`));
    box.appendChild(d);
  });
}

$("readBtn").addEventListener("click", async () => {
  const my = ++readSeq;
  const net = getNetwork();
  const raw = $("upAddress").value.trim();
  if (!net || !net.rpc) { setStatus("status", t("needNet"), "line-err"); return; }
  if (!ethers.isAddress(raw)) { setStatus("status", t("needAddr"), "line-err"); return; }
  const up = ethers.getAddress(raw);
  $("readBtn").disabled = true;
  setStatus("status", t("reading"), "line-dim");
  try {
    const [rn, rl] = await Promise.all([
      readProfile(net, up).catch(e => ({ state: "fetchFail", err: e.shortMessage || e.message })),
      readProfile(LUKSO, up).catch(e => ({ state: "fetchFail", err: e.shortMessage || e.message })),
    ]);
    if (my !== readSeq) return;
    if (rn.state === "rpc") { setStatus("status", t("rpcWrong", { id: rn.id, exp: net.chainId }), "line-err"); return; }
    if (rl.state === "noUp") rl.lukso = true;
    const netName = net.chainId ? net.name : `${t("customNetName")} (chainId ${rn.chainId})`;
    if (rn.state === "noUp") { setStatus("status", t("notDeployed", { net: netName }), "line-err"); last = { netName, net: rn, lukso: rl }; render(last); $("ctrlPanel").hidden = true; return; }
    setStatus("status", "", "");
    let ctrl;
    try { ctrl = await BackupCheck.read(rn.provider, up); } catch (e) { ctrl = { err: e.shortMessage || e.message }; }
    if (my !== readSeq) return;
    last = { netName, net: rn, lukso: rl, ctrl };
    render(last);
  } finally {
    if (my === readSeq) $("readBtn").disabled = false;
  }
});

applyI18n();
</script>
