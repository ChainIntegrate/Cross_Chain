<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>UP Deploy — Sola Verifica</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.4/ethers.umd.min.js"></script>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --border: #2a2f3a;
    --text: #e6e8ec; --text-dim: #9aa1ad;
    --accent: #5b8cff; --ok: #3fbf6f; --warn: #e0a83c; --err: #e05a5a;
  }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
         max-width: 820px; margin: 0 auto; padding: 32px 20px 80px; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .subtitle { color: var(--text-dim); font-size: 13px; margin-bottom: 28px; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 20px; }
  .panel h2 { font-size: 14px; margin: 0 0 14px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.03em; }
  label { display: block; font-size: 13px; color: var(--text-dim); margin: 14px 0 6px; }
  label:first-child { margin-top: 0; }
  select, input, textarea { width: 100%; background: #10131a; border: 1px solid var(--border); color: var(--text);
                  border-radius: 6px; padding: 10px 12px; font-size: 13.5px; font-family: inherit; }
  textarea { font-family: monospace; font-size: 11.5px; min-height: 90px; resize: vertical; word-break: break-all; }
  button { width: 100%; background: var(--accent); color: white; border: none; border-radius: 6px;
           padding: 12px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 12px; }
  button.secondary { background: #2a2f3a; }
  #log { font-family: monospace; font-size: 12.5px; white-space: pre-wrap; word-break: break-all; line-height: 1.6; margin-top: 10px; }
  .line-ok { color: var(--ok); } .line-warn { color: var(--warn); } .line-err { color: var(--err); } .line-dim { color: var(--text-dim); }
</style>
</head>
<body>

<h1>UP Deploy — Sola Verifica</h1>
<div class="subtitle">Controlla, senza firmare né spendere nulla, se una Universal Profile risulta correttamente deployata su una rete a partire dalla sua calldata originale. Solo lettura — nessun wallet richiesto.</div>

<div class="panel">
  <h2>1 · Dati</h2>
  <label>Indirizzo UP atteso</label>
  <input type="text" id="expectedAddress" placeholder="0x...">
  <label>Calldata di deploy originale (0x6a66a753...)</label>
  <textarea id="calldataInput" placeholder="0x6a66a753..."></textarea>
</div>

<div class="panel">
  <h2>2 · Rete da controllare</h2>
  <input type="text" id="networkFilter" placeholder="Filtra per nome...">
  <select id="network" style="margin-top:8px;"></select>
  <div id="customRpcWrap" style="display:none;">
    <label>RPC URL custom</label>
    <input type="text" id="customRpc" placeholder="https://...">
  </div>
</div>

<div class="panel">
  <h2>3 · Verifica</h2>
  <button id="verifyBtn">Verifica deploy</button>
  <div id="log" class="line-dim">In attesa dei dati sopra.</div>
</div>

<script>
const FACTORY_ADDRESS = "0x2300000A84D25dF63081feAa37ba6b62C4c89a30";
const SECONDARY_IMPL = "0x2fe3aed98684e7351ad2d408a43ce09a738bf8a4";

const CHAINS = [
  { key: "ethereum", name: "Ethereum", rpc: "https://ethereum-rpc.publicnode.com" },
  { key: "base", name: "Base", rpc: "https://mainnet.base.org" },
  { key: "arbitrum-one", name: "Arbitrum One", rpc: "https://arb1.arbitrum.io/rpc" },
  { key: "optimism", name: "Optimism", rpc: "https://mainnet.optimism.io" },
  { key: "polygon", name: "Polygon", rpc: "https://polygon.drpc.org" },
  { key: "bnb-smart-chain", name: "BNB Smart Chain", rpc: "https://bsc-dataseed1.bnbchain.org" },
  { key: "avalanche-c-chain", name: "Avalanche C-Chain", rpc: "https://api.avax.network/ext/bc/C/rpc" },
  { key: "gnosis", name: "Gnosis", rpc: "https://rpc.gnosischain.com" },
  { key: "sei", name: "Sei", rpc: "https://evm-rpc.sei-apis.com" },
  { key: "linea", name: "Linea", rpc: "https://rpc.linea.build" },
  { key: "scroll", name: "Scroll", rpc: "https://rpc.scroll.io" },
  { key: "blast", name: "Blast", rpc: "https://rpc.blast.io" },
  { key: "zksync", name: "zkSync", rpc: "https://mainnet.era.zksync.io" },
  { key: "custom", name: "Custom RPC...", rpc: null },
];

const $ = (id) => document.getElementById(id);
function log(msg, cls) {
  const l = document.createElement("div");
  if (cls) l.className = cls;
  l.textContent = msg;
  $("log").appendChild(l);
}

const networkSelectEl = $("network");
function renderNetworkOptions(filter) {
  const f = (filter || "").toLowerCase();
  networkSelectEl.innerHTML = "";
  CHAINS.filter(c => c.name.toLowerCase().includes(f)).forEach(c => {
    const opt = document.createElement("option");
    opt.value = c.key;
    opt.textContent = c.name;
    networkSelectEl.appendChild(opt);
  });
}
renderNetworkOptions("");
$("networkFilter").addEventListener("input", (e) => renderNetworkOptions(e.target.value));
networkSelectEl.addEventListener("change", () => {
  $("customRpcWrap").style.display = networkSelectEl.value === "custom" ? "block" : "none";
});
function getNetwork() {
  const key = networkSelectEl.value;
  if (key === "custom") return { name: "Custom", rpc: $("customRpc").value.trim() };
  return CHAINS.find(c => c.key === key);
}

function minimalProxyInitcode(impl) {
  return "0x3d602d80600a3d3981f3363d3d373d3d3d363d73" + impl.slice(2).toLowerCase() + "5af43d82803e903d91602b57fd5bf3";
}
// Runtime code EIP-1167 reale (senza il preambolo di 10 byte del constructor) — è quello
// che getCode() restituisce davvero on-chain, a differenza dell'init code sopra.
function minimalProxyRuntimeCode(impl) {
  return "0x363d3d373d3d3d363d73" + impl.slice(2).toLowerCase() + "5af43d82803e903d91602b57fd5bf3";
}
function computeKeyManagerAddress(primaryAddress) {
  const salt = ethers.keccak256(primaryAddress);
  const initcodeHash = ethers.keccak256(minimalProxyInitcode(SECONDARY_IMPL));
  return ethers.getCreate2Address(FACTORY_ADDRESS, salt, initcodeHash);
}

function decodeCalldata(calldataHex) {
  const coder = ethers.AbiCoder.defaultAbiCoder();
  let data = calldataHex.trim();
  if (!data.startsWith("0x")) data = "0x" + data;
  const body = "0x" + data.slice(10);
  const outerTypes = ["tuple(bytes32,uint256,address,bytes)", "tuple(uint256,address,bytes,bool,bytes)", "address", "bytes"];
  const [primaryT, secondaryT, postDeploymentModule, postDeploymentModuleCalldata] = coder.decode(outerTypes, body);
  const primary = { salt: primaryT[0], fundingAmount: primaryT[1], impl: primaryT[2], initCalldata: primaryT[3] };
  const secondary = { fundingAmount: secondaryT[0], impl: secondaryT[1], initCalldata: secondaryT[2], addPrimaryContractAddress: secondaryT[3], extraInitParams: secondaryT[4] };
  const generatedSaltEncoded = coder.encode(
    ["bytes32", "address", "bytes", "bool", "bytes", "address", "bytes"],
    [primary.salt, secondary.impl, secondary.initCalldata, secondary.addPrimaryContractAddress, secondary.extraInitParams, postDeploymentModule, postDeploymentModuleCalldata]
  );
  const generatedSalt = ethers.keccak256(generatedSaltEncoded);
  const initcodeHash = ethers.keccak256(minimalProxyInitcode(primary.impl));
  const predictedPrimary = ethers.getCreate2Address(FACTORY_ADDRESS, generatedSalt, initcodeHash);
  const predictedSecondary = computeKeyManagerAddress(predictedPrimary);
  return { primary, secondary, predictedPrimary, predictedSecondary };
}

$("verifyBtn").addEventListener("click", async () => {
  $("log").innerHTML = "";
  const calldataRaw = $("calldataInput").value.trim();
  const expected = $("expectedAddress").value.trim();
  const net = getNetwork();

  if (!calldataRaw) { log("Incolla la calldata.", "line-err"); return; }
  if (!net.rpc) { log("Manca l'RPC della rete.", "line-err"); return; }

  try {
    const d = decodeCalldata(calldataRaw);
    log(`UP predetta: ${d.predictedPrimary}`, "line-dim");
    log(`Key Manager predetto: ${d.predictedSecondary}`, "line-dim");

    if (expected && ethers.isAddress(expected)) {
      if (d.predictedPrimary.toLowerCase() !== expected.toLowerCase()) {
        log(`❌ La calldata NON produce l'indirizzo atteso (${expected}).`, "line-err");
        return;
      }
      log("✅ La calldata produce esattamente l'indirizzo atteso.", "line-ok");
    }

    const provider = new ethers.JsonRpcProvider(net.rpc, undefined, { batchMaxCount: 1 });

    async function getCodeStable(address, attempts, delayMs) {
      let last = "0x";
      for (let i = 0; i < attempts; i++) {
        last = (await provider.getCode(address)).toLowerCase();
        if (last !== "0x") return last;
        if (i < attempts - 1) await new Promise(r => setTimeout(r, delayMs));
      }
      return last;
    }

    log(`Interrogo ${net.name}...`, "line-dim");
    const actualPrimaryCode = await getCodeStable(d.predictedPrimary, 4, 2000);
    const actualSecondaryCode = await getCodeStable(d.predictedSecondary, 4, 2000);

    const expectedPrimaryCode = minimalProxyRuntimeCode(d.primary.impl).toLowerCase();
    const expectedSecondaryCode = minimalProxyRuntimeCode(SECONDARY_IMPL).toLowerCase();

    const primaryOk = actualPrimaryCode === expectedPrimaryCode;
    const secondaryOk = actualSecondaryCode === expectedSecondaryCode;

    if (primaryOk && secondaryOk) {
      log(`✅✅✅ DEPLOY VERIFICATO su ${net.name}.`, "line-ok");
      log(`UP:          ${d.predictedPrimary}`, "line-ok");
      log(`Key Manager: ${d.predictedSecondary}`, "line-ok");
    } else {
      log(`❌ Non risulta un deploy corrispondente su ${net.name}.`, "line-err");
      if (!primaryOk) log(`UP: ${actualPrimaryCode === "0x" ? "nessun contratto a questo indirizzo" : "bytecode diverso dall'atteso"}.`, "line-err");
      if (!secondaryOk) log(`Key Manager: ${actualSecondaryCode === "0x" ? "nessun contratto a questo indirizzo" : "bytecode diverso dall'atteso"}.`, "line-err");
    }

    // Controllo aggiuntivo: l'indirizzo del proxy predetto (o già deployato) non dice nulla
    // sul fatto che l'implementazione a cui punta (LSP0 e Key Manager) abbia davvero bytecode
    // su questa rete. Se manca, il profilo è — o sarebbe — "muto": ogni delegatecall verso
    // un indirizzo senza codice ritorna successo senza fare nulla, quindi nessun errore visibile
    // a deploy avvenuto. Vale la pena segnalarlo sempre, non solo quando il proxy è già presente.
    log("Controllo che le implementazioni referenziate dalla calldata abbiano bytecode su questa rete...", "line-dim");
    const primaryImplCode = await provider.getCode(d.primary.impl);
    const secondaryImplCode = await provider.getCode(SECONDARY_IMPL);
    const primaryImplOk = primaryImplCode !== "0x";
    const secondaryImplOk = secondaryImplCode !== "0x";
    if (primaryImplOk && secondaryImplOk) {
      log(`✅ Entrambe le implementazioni (LSP0 ${d.primary.impl}, Key Manager ${SECONDARY_IMPL}) hanno bytecode su questa rete: un eventuale deploy sarebbe funzionante, non solo "presente".`, "line-ok");
    } else {
      log(`⚠️ ATTENZIONE — anche se il proxy risultasse deployato all'indirizzo atteso, sarebbe "muto" su questa rete:`, "line-warn");
      if (!primaryImplOk) log(`  l'implementazione LSP0 (${d.primary.impl}) non ha bytecode qui — le chiamate alla UP andrebbero a vuoto senza errore.`, "line-warn");
      if (!secondaryImplOk) log(`  l'implementazione Key Manager (${SECONDARY_IMPL}) non ha bytecode qui — le chiamate al Key Manager andrebbero a vuoto senza errore.`, "line-warn");
    }
  } catch (e) {
    log("Errore: " + (e.shortMessage || e.message), "line-err");
  }
});
</script>

</body>
</html>
