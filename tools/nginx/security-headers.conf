# Response headers of the website (nginx), as on the live server in /etc/nginx/snippets/.
# Include it in the site's server block and again in every location that has its own add_header
# (nginx drops the server-level headers there). The pages must never be framed: UP Wallet, the
# Backup page and the gas relay pages sign transactions (AUDIT 2026-10-26 WEB-1).
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.4/; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss://relay.walletconnect.org wss://relay.walletconnect.com; frame-src https://verify.walletconnect.org https://verify.walletconnect.com; worker-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
