# Per-IP request rate for the relayer and the signing service (/relay/, /relay/sponsor/), in front of the
# services' own limits (AUDIT CC-01). Goes in the http context: /etc/nginx/conf.d/crosschain-relay-limit.conf.
# The site's pages poll relay/receipt and relay/info about once a second while an operation is under way,
# so 10 requests a second with a burst of 40 leaves normal use untouched and only stops floods.
#
# The key: an IPv4 address as it is, an IPv6 address by its /64 (one subscriber usually holds a whole /64,
# so a key per address would not bind; audit 2026-11-24 R16). nginx prints $remote_addr compressed (RFC
# 5952), so each pattern below reads the first 64 bits from one way of writing it; generated and checked
# against the relayer's ipKey() on random addresses. An address none of them matches keeps its own key.
#
# The zone is named crosschain_relay64, not crosschain_relay as before: nginx cannot change the key of a zone
# it already holds, so a reload with the new key under the old name was refused (in error.log only, "uses the
# ... key while previously it used the ... key"; `nginx -t` passes) and every later reload of the server with
# it, until the name changed on 2026-11-25. Whenever the key changes, change the name too (here and in the
# limit_req lines of the site's server block), or restart nginx.
map $remote_addr $crosschain_relay_key {
    "~^(?<a>[0-9a-f]{1,4}):(?<b>[0-9a-f]{1,4}):(?<c>[0-9a-f]{1,4}):(?<d>[0-9a-f]{1,4}):" "$a:$b:$c:$d";
    "~^(?<p0>[0-9a-f]{1,4}):(?<p1>[0-9a-f]{1,4}):(?<p2>[0-9a-f]{1,4})::([0-9a-f]{1,4}(:[0-9a-f]{1,4}){0,3})?$" "$p0:$p1:$p2:0";
    "~^(?<p0>[0-9a-f]{1,4}):(?<p1>[0-9a-f]{1,4})::(?<s0>[0-9a-f]{1,4}):(?<s1>[0-9a-f]{1,4}):(?<s2>[0-9a-f]{1,4}):(?<s3>[0-9a-f]{1,4}):(?<s4>[0-9a-f]{1,4})$" "$p0:$p1:0:$s0";
    "~^(?<p0>[0-9a-f]{1,4}):(?<p1>[0-9a-f]{1,4})::([0-9a-f]{1,4}(:[0-9a-f]{1,4}){0,3})?$" "$p0:$p1:0:0";
    "~^(?<p0>[0-9a-f]{1,4})::(?<s0>[0-9a-f]{1,4}):(?<s1>[0-9a-f]{1,4}):(?<s2>[0-9a-f]{1,4}):(?<s3>[0-9a-f]{1,4}):(?<s4>[0-9a-f]{1,4}):(?<s5>[0-9a-f]{1,4})$" "$p0:0:$s0:$s1";
    "~^(?<p0>[0-9a-f]{1,4})::(?<s0>[0-9a-f]{1,4}):(?<s1>[0-9a-f]{1,4}):(?<s2>[0-9a-f]{1,4}):(?<s3>[0-9a-f]{1,4}):(?<s4>[0-9a-f]{1,4})$" "$p0:0:0:$s0";
    "~^(?<p0>[0-9a-f]{1,4})::([0-9a-f]{1,4}(:[0-9a-f]{1,4}){0,3})?$" "$p0:0:0:0";
    "~^::(?<s0>[0-9a-f]{1,4}):(?<s1>[0-9a-f]{1,4}):(?<s2>[0-9a-f]{1,4}):(?<s3>[0-9a-f]{1,4}):(?<s4>[0-9a-f]{1,4}):(?<s5>[0-9a-f]{1,4}):(?<s6>[0-9a-f]{1,4})$" "0:$s0:$s1:$s2";
    "~^::(?<s0>[0-9a-f]{1,4}):(?<s1>[0-9a-f]{1,4}):(?<s2>[0-9a-f]{1,4}):(?<s3>[0-9a-f]{1,4}):(?<s4>[0-9a-f]{1,4}):(?<s5>[0-9a-f]{1,4})$" "0:0:$s0:$s1";
    "~^::(?<s0>[0-9a-f]{1,4}):(?<s1>[0-9a-f]{1,4}):(?<s2>[0-9a-f]{1,4}):(?<s3>[0-9a-f]{1,4}):(?<s4>[0-9a-f]{1,4})$" "0:0:0:$s0";
    "~^::([0-9a-f]{1,4}(:[0-9a-f]{1,4}){0,3})?$" "0:0:0:0";
    default $binary_remote_addr;
}
limit_req_zone $crosschain_relay_key zone=crosschain_relay64:10m rate=10r/s;
limit_req_status 429;
