# Per-IP request rate for the relayer and the signing service (/relay/, /relay/sponsor/), in front of the
# services' own limits (AUDIT CC-01). Goes in the http context: /etc/nginx/conf.d/crosschain-relay-limit.conf.
# The site's pages poll relay/receipt and relay/info about once a second while an operation is under way,
# so 10 requests a second with a burst of 40 leaves normal use untouched and only stops floods.
limit_req_zone $binary_remote_addr zone=crosschain_relay:10m rate=10r/s;
limit_req_status 429;
