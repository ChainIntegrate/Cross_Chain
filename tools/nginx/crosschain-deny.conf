# What the git clone in the web root holds but the website must not serve (AUDIT M-08).
# Include it in the site's server block. 404 for dot files and folders (except /.well-known/,
# used to renew the certificate), /tools/ and every .md file.
location ~ /\.(?!well-known/) { return 404; }
location ^~ /tools/ { return 404; }
location ~* \.md$ { return 404; }
