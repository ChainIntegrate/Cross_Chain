function applyI18n() {
  document.documentElement.lang = LANG;
  document.title = t("pageTitle");
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.getAttribute("data-i18n")); });
  document.querySelectorAll("[data-i18n-html]").forEach(el => { el.innerHTML = t(el.getAttribute("data-i18n-html")); });
  renderPrices(); if (lastCheck) renderCheck(lastCheck); updateButtons();
}
// The check's lines are written in the page's language: run it again after a switch.
$("langToggle").addEventListener("click", () => { LANG = LANG === "it" ? "en" : "it"; applyI18n(); if (lastCheck) scheduleCheck(0); });

// Data from wallets, RPCs and the service is written with textContent, never innerHTML.
function setStatus(id, text, cls) { const el = $(id); el.textContent = ""; const s = document.createElement("span"); if (cls) s.className = cls; s.textContent = text; el.appendChild(s); }
function log(msg, cls) { const d = document.createElement("div"); if (cls) d.className = cls; d.textContent = msg; $("log").appendChild(d); }
const validEmail = (e) => e.length <= 254 && /^[^\s@<>()",;:\\[\]]+@[^\s@<>()",;:\\[\]]+\.[^\s@<>()",;:\\[\]]{2,}$/.test(e);

// ==================== networks and price list ====================
let nets = [], prices = null, priceState = "loading", busy = false;
async function loadNetworks() {
  const info = await GasRelayClient.loadInfo(true);
  nets = CHAINS.filter(c => NATIVE_USDC[c.chainId] && info && info.chains[String(c.chainId)] && info.chains[String(c.chainId)].sponsorPaymaster);
  const sel = $("network"); sel.textContent = "";
  nets.forEach(c => { const o = document.createElement("option"); o.value = c.key; o.textContent = `${c.name} (chainId ${c.chainId})`; sel.appendChild(o); });
  const want = new URLSearchParams(location.search).get("network");
  if (want && nets.some(c => c.key === want)) sel.value = want;
  // Any address that is not a customer gets the subscription data, price list included.
  if (nets.length) { const st = await GasRelayClient.sponsorStatus(nets[0].chainId, ethers.ZeroAddress); prices = st && st.subscription ? st.subscription.prices : null; priceState = prices ? "ok" : st ? "closed" : "down"; }
  renderPrices();
}
function renderPrices() {
  const pr = prices || PRICE_LIST;
  const shown = (nets.length ? nets : CHAINS.filter(c => PRICE_LIST[c.chainId])).filter(c => pr[String(c.chainId)]);
  const list = shown.map(c => `${c.name} ${pr[String(c.chainId)]} USDC`);
  const ex = shown.map(c => `${Math.floor(5 / Number(pr[String(c.chainId)]))} ${LANG === "it" ? "operazioni su" : "operations on"} ${c.name}`);
  const line = t("priceLine", { list: list.join(" · "), example: ex.join(LANG === "it" ? " oppure " : " or ") });
  const note = prices ? "" : priceState === "closed" ? t("subsClosed") : priceState === "down" || !nets.length ? t("priceNone") : "";
  setStatus("priceBox", line, "");
  if (note) { const d = document.createElement("div"); d.className = "line-err"; d.style.marginTop = "6px"; d.textContent = note; $("priceBox").appendChild(d); }
}
const getNet = () => nets.find(c => c.key === $("network").value) || null;

// ==================== wallet ====================
let signerProvider = null, signerAddress = null;
const discovered = [];
window.addEventListener("eip6963:announceProvider", (e) => discovered.push(e.detail));
window.dispatchEvent(new Event("eip6963:requestProvider"));
$("connectSigner").addEventListener("click", async () => {
  let candidate = discovered.find(p => !/lukso|universal profile/i.test(p.info.name))?.provider;
  if (!candidate && window.ethereum && window.ethereum !== window.lukso) candidate = window.ethereum;
  if (!candidate) { setStatus("checkBox", t("noSignerFound"), "line-err"); return; }
  try {
    const acc = await candidate.request({ method: "eth_requestAccounts" });
    signerAddress = acc[0] ? ethers.getAddress(acc[0]) : null;
    if (signerProvider !== candidate && candidate.on) {
      candidate.on("accountsChanged", (a) => { signerAddress = a && a[0] ? ethers.getAddress(a[0]) : null; scheduleCheck(0); });
      candidate.on("chainChanged", () => scheduleCheck(0));
    }
    signerProvider = candidate;
    scheduleCheck(0);
  } catch (e) { setStatus("checkBox", t("connectionRejected"), "line-err"); }
});

// ==================== check ====================
// Bumped by every change: a payment prepared while it changed is not sent (AUDIT M-2).
let gen = 0, check = null, lastCheck = null, checkRun = 0, checkTimer = null;
function scheduleCheck(delay = 500) { gen++; check = null; updateButtons(); clearTimeout(checkTimer); checkTimer = setTimeout(runCheck, delay); }
["upAddress"].forEach(id => $(id).addEventListener("input", () => scheduleCheck()));
$("network").addEventListener("change", () => scheduleCheck(0));
["email"].forEach(id => $(id).addEventListener("input", updateButtons));
["ackRisk", "ackPrivacy"].forEach(id => $(id).addEventListener("change", updateButtons));
$("recheckBtn").addEventListener("click", () => scheduleCheck(0));

async function runCheck() {
  const run = ++checkRun;
  setStatus("checkBox", t("checkRunning"), "empty");
  let c;
  try { c = await computeCheck(); } catch (e) { c = { rows: [["kNet", t("genericError", { err: e.shortMessage || e.message }), "err"]], ok: false }; }
  if (run !== checkRun) return;
  check = c.ok ? c : null; lastCheck = c;
  renderCheck(c); updateButtons();
}
async function computeCheck() {
  const rows = [], out = { rows, ok: false };
  const net = getNet();
  if (!net) { rows.push(["kNet", t("priceNone"), "err"]); return out; }
  const provider = new ethers.JsonRpcProvider(net.rpc, undefined, { batchMaxCount: 1 });
  const chainId = Number(await provider.send("eth_chainId", []));
  if (chainId !== net.chainId) { rows.push(["kNet", `RPC chainId ${chainId}`, "err"]); return out; }
  rows.push(["kNet", t("netOk", { name: net.name, id: chainId }), "ok"]);
  const raw = $("upAddress").value.trim();
  if (!ethers.isAddress(raw)) { rows.push(["kUp", t("upMissing"), "err"]); return out; }
  const up = ethers.getAddress(raw);
  if ((await provider.getCode(up)) === "0x") { rows.push(["kUp", t("upNotDeployed"), "err"]); out.fix = "deploy"; out.up = up; out.net = net; return out; }
  rows.push(["kUp", `${up} — ${t("upOk")}`, "ok"]);
  if (!signerAddress || !signerProvider) { rows.push(["kSigner", t("signerNone"), "warn"]); return out; }
  const walletChain = parseInt(await signerProvider.request({ method: "eth_chainId" }), 16);
  if (walletChain !== chainId) { rows.push(["kSigner", t("walletWrong", { got: walletChain, name: net.name, exp: chainId }), "err"]); return out; }
  rows.push(["kSigner", signerAddress, "ok"]);
  // The service: what to pay and to whom. Never trusted alone: checked against the page's own values.
  const st = await GasRelayClient.sponsorStatus(chainId, up);
  const sub = st && st.subscription;
  if (!sub) { rows.push(["kSvc", t(st ? "subsClosed" : "svcDown"), "err"]); return out; }
  if (!sub.usdc || ethers.getAddress(sub.usdc) !== NATIVE_USDC[chainId] || ethers.getAddress(sub.receiver) !== RECEIVER || ethers.parseUnits(String(sub.amount), 6) !== AMOUNT) { rows.push(["kSvc", t("svcBadData"), "err"]); return out; }
  rows.push(["kSvc", t("svcOk", { amount: "5", receiver: RECEIVER }), "ok"]);
  // The UP's 4337 setup, the paymaster and the controller: the relayer client's own checks.
  const ready = await GasRelayClient.check(provider, { chainId, up, signer: signerAddress, forSubscription: true });
  if (ready.state !== "ready") {
    const what = (ready.reasons || []).map(([k, v]) => GasRelayClient.text(k, v)).join("; ") || t("svcDown");
    rows.push(["kSetup", t("setupMissing", { what }), "err"]); out.fix = "setup"; out.up = up; out.net = net; return out;
  }
  rows.push(["kSetup", t("setupOk"), "ok"]);
  out.status = sub.status;
  const bal = await new ethers.Contract(NATIVE_USDC[chainId], ERC20, provider).balanceOf(up);
  const enough = bal >= AMOUNT;
  rows.push(["kUsdc", t(enough ? "usdcOk" : "usdcLow", { bal: ethers.formatUnits(bal, 6), need: "5", token: NATIVE_USDC[chainId] }), enough ? "ok" : "err"]);
  const status = sub.status;
  rows.push(["kStatus", status === "active" ? t("stActive", { bal: st.balance || "0" }) : t(status === "paid" ? "stPaid" : status === "requested" ? "stRequested" : "stNone"), status === "paid" ? "warn" : status === "active" ? "ok" : ""]);
  Object.assign(out, { ok: enough, provider, chainId, up, net, ready, status });
  return out;
}
function renderCheck(c) {
  const box = $("checkBox"); box.textContent = "";
  const grid = document.createElement("div"); grid.className = "kv";
  for (const [k, v, cls] of c.rows) {
    const kd = document.createElement("div"); kd.className = "k"; kd.textContent = t(k);
    const vd = document.createElement("div"); vd.className = "v" + (cls ? " " + cls : ""); vd.textContent = v;
    grid.append(kd, vd);
  }
  box.appendChild(grid);
  const a = $("fixLink");
  if (c.fix && c.up && c.net) {
    const q = new URLSearchParams({ up: c.up, network: c.net.key });
    a.href = c.fix === "deploy" ? `up-deploy-public.html?${q}` : `up-gas-relay.html?${q}`;
    a.textContent = t(c.fix === "deploy" ? "fixDeploy" : "fixSetup");
    a.hidden = false;
  } else a.hidden = true;
}
function updateButtons() {
  const email = $("email").value.trim();
  let hint = "";
  if (!$("ackRisk").checked) hint = t("hintAck");
  else if (lastCheck && lastCheck.status === "paid") hint = t("hintPaid");
  else if (!check) hint = t("hintCheck");
  else if (!validEmail(email) || !$("ackPrivacy").checked) hint = t("hintEmail");
  else hint = t("hintReady");
  $("payHint").textContent = hint;
  $("payBtn").disabled = busy || hint !== t("hintReady");
}

// ==================== payment ====================
$("payBtn").addEventListener("click", async () => {
  if (busy || !check) return;
  const email = $("email").value.trim().toLowerCase();
  if (!validEmail(email)) { log(t("badEmail"), "line-err"); return; }
  busy = true; updateButtons();
  const g = gen;
  $("log").textContent = "";
  const c = check;
  const fmt = (w) => `${ethers.formatEther(w)} ${c.net.currency || ""}`.trim();
  try {
    log(t("preparing"), "line-dim");
    const data = ERC20.encodeFunctionData("transfer", [RECEIVER, AMOUNT]);
    const ready = await GasRelayClient.check(c.provider, { chainId: c.chainId, up: c.up, signer: signerAddress, forSubscription: true });
    if (ready.state !== "ready") throw new Error(t("hintCheck"));
    const prep = await GasRelayClient.prepare(c.provider, { chainId: c.chainId, up: c.up, ready, to: NATIVE_USDC[c.chainId], value: 0n, data, fmt });
    if (g !== gen) { log(t("editedDuringCheckLog"), "line-err"); return; }
    log(prep.plan, "line-dim");
    const hash = await GasRelayClient.signAndSend(signerProvider, { chainId: c.chainId, prep, signer: signerAddress, log, subscribe: { email } });
    const url = getExplorerUrl(c.net, EXPLORER_PATH, hash);
    if (url) log(url, "line-dim");
    const res = await GasRelayClient.waitResult(c.provider, hash, prep.hash, { log, fmt });
    if (!res.success) { if (!res.unknown) log(t("opFailed"), "line-err"); return; }
    log(t("waitingWatcher"), "line-dim");
    // The service records the payment within about a minute of the block.
    for (let i = 0; i < 24; i++) {
      await new Promise(r => setTimeout(r, 10000));
      const st = await GasRelayClient.sponsorStatus(c.chainId, c.up);
      const s = st && st.subscription && st.subscription.status;
      if (s === "paid" || s === "active") { log(t("paidOk"), "line-ok"); scheduleCheck(0); return; }
    }
    log(t("paidLater"), "line-warn");
  } catch (e) {
    log(e.message && e.message.length < 600 ? e.message : t("genericError", { err: e.shortMessage || e.message }), "line-err");
  } finally { busy = false; updateButtons(); }
});

// ==================== start ====================
const q = new URLSearchParams(location.search);
if (q.get("up") && ethers.isAddress(q.get("up"))) $("upAddress").value = ethers.getAddress(q.get("up"));
applyI18n();
loadNetworks().then(() => scheduleCheck(0));
</script>
</body>
</html>
