function t(key, vars) {
  const v = I18N[LANG][key];
  return typeof v === "function" ? v(vars || {}) : v;
}

function applyI18n() {
  document.documentElement.lang = LANG;
  document.title = t("pageTitle");
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.getAttribute("data-i18n")); });
  document.querySelectorAll("[data-i18n-html]").forEach(el => { el.innerHTML = t(el.getAttribute("data-i18n-html")); });
  document.querySelectorAll("[data-i18n-placeholder]").forEach(el => { el.placeholder = t(el.getAttribute("data-i18n-placeholder")); });
  $("langToggle").textContent = t("langToggleBtn");
  if (!signerAddress) setSignerStatus(`<span class="empty">${t("notConnected")}</span>`);
  if (bk) renderBackup(); else if (!$("backupStatus").textContent.trim() || $("backupStatus").querySelector("[data-i18n]")) $("backupStatus").innerHTML = `<span class="empty">${t("backupNotRead")}</span>`;
  $("genesisNote").textContent = genesisMissing ? t("genesisUnknown") : "";
}

$("langToggle").addEventListener("click", () => {
  LANG = LANG === "it" ? "en" : "it"; SiteUI.saveLang(LANG);
  applyI18n();
});

// ==================== APP ====================
const FACTORY_ADDRESS = "0x2300000A84D25dF63081feAa37ba6b62C4c89a30"; // LSP23 factory, same address on every EVM network
const DEPLOY_SELECTOR = "0x6a66a753"; // deployERC1167Proxies(...) on LSP23LinkedContractsFactory
// Data key prefix of LSP6 "AddressPermissions:Permissions:<address>" (bytes10 + bytes2 padding).
const PERM_PREFIX = "4b80742de2bf82acb3630000";

// Bit order as defined in @lukso/lsp6-contracts LSP6Constants.sol (bits 0..22).
const PERMISSION_BITS = [
  "CHANGEOWNER","ADDCONTROLLER","EDITPERMISSIONS","ADDEXTENSIONS","CHANGEEXTENSIONS",
  "ADDUNIVERSALRECEIVERDELEGATE","CHANGEUNIVERSALRECEIVERDELEGATE","REENTRANCY",
  "SUPER_TRANSFERVALUE","TRANSFERVALUE","SUPER_CALL","CALL","SUPER_STATICCALL","STATICCALL",
  "SUPER_DELEGATECALL","DELEGATECALL","DEPLOY","SUPER_SETDATA","SETDATA","ENCRYPT","DECRYPT",
  "SIGN","EXECUTE_RELAY_CALL"
];

// Indirizzi di infrastruttura LUKSO ufficiale, riconoscibili e non legati a un singolo profilo.
// Stesso indirizzo su ogni rete dove LUKSO ha deployato gli stessi contratti (deploy deterministico).
// Verificato su explorer.execution.mainnet.lukso.network (contratto verificato, nome confermato).
const KNOWN_ADDRESSES = {
  "0x7870c5b8bc9572a8001c3f96f7ff59961b23500d": {
    labelKey: "knownLsp1Label",
    noteKey: "knownLsp1Note"
  }
};

// Nome rete leggibile a partire dal chainId, usato per mostrare all'utente a quale rete
// è connesso il wallet firmatario (LUKSO stessa non è nell'elenco CHAINS sopra perché
// quell'elenco è quello delle reti di destinazione del deploy, non della UP originale).
function chainDisplayName(chainId) {
  if (chainId === 42) return "LUKSO Mainnet";
  if (chainId === 4201) return "LUKSO Testnet";
  const found = CHAINS.find(c => c.chainId === chainId);
  return found ? found.name : t("unknownNetworkLabel", { chainId });
}

// --- Network: every redeploy network and LUKSO, where the UP was born (it has its own controller list) ---
const networkSelectEl = $("network");
const NETWORKS = [LUKSO_CHAIN, LUKSO_TESTNET_CHAIN, ...CHAINS];
function renderNetworkOptions(filter) {
  const f = (filter || "").toLowerCase();
  networkSelectEl.innerHTML = "";
  NETWORKS.filter(c => c.name.toLowerCase().includes(f)).forEach(c => {
    const opt = document.createElement("option");
    opt.value = c.key;
    opt.textContent = c.chainId ? `${c.name} (chainId ${c.chainId})` : c.name;
    networkSelectEl.appendChild(opt);
  });
}
renderNetworkOptions("");
$("networkFilter").addEventListener("input", (e) => {
  renderNetworkOptions(e.target.value);
  // Filtering can silently change the selected option: propagate it like a user selection.
  networkSelectEl.dispatchEvent(new Event("change"));
});
networkSelectEl.addEventListener("change", () => {
  $("customRpcWrap").style.display = networkSelectEl.value === "custom" ? "block" : "none";
});
function getNetwork() {
  const key = networkSelectEl.value;
  if (key === "custom") {
    return { name: t("customNetName"), rpc: $("customRpc").value.trim(), explorer: $("customExplorer").value.trim() || null };
  }
  return NETWORKS.find(c => c.key === key);
}

// --- The UP: from the extension, or the Universal Profiles app (site-ui.js), or typed ---
$("connectUp").addEventListener("click", async () => {
  try {
    const a = await SiteUI.upAddress();
    if (!a) return;
    $("upAddress").value = ethers.getAddress(a);
    $("upAddress").dispatchEvent(new Event("change"));
    resetBackupView();
  } catch (e) { /* rejected */ }
});

// --- The signing controller, via EIP-6963 (never the Universal Profile extension) ---
let signerProvider = null, signerAddress = null;
const discoveredProviders = [];
window.addEventListener("eip6963:announceProvider", (e) => discoveredProviders.push(e.detail));
window.dispatchEvent(new Event("eip6963:requestProvider"));
function setSignerStatus(html) { $("signerStatus").innerHTML = html; }
// The connected signer; through WalletConnect also the wallet's name and a button to disconnect (the way to
// pick another account there).
function showSigner(netLabel = "") {
  const wc = signerProvider && signerProvider.isWalletConnect;
  setSignerStatus(`<span class="badge ok">${t("connectedBadge")}</span> ${escapeHtml(signerAddress + netLabel)}` +
    (wc ? `<div class="line-dim" style="margin-top:6px;">WalletConnect · ${escapeHtml(signerProvider.walletName)} <button type="button" id="signerDisconnect" class="secondary" style="width:auto; margin:0 0 0 8px; padding:4px 10px; font-size:12px;">${t("wcDisconnectBtn")}</button></div>` : ""));
  if (wc) $("signerDisconnect").addEventListener("click", async () => {
    await signerProvider.disconnect();
    signerProvider = null; signerAddress = null; watchedSigner = null;
    setSignerStatus(`<span class="empty">${t("notConnected")}</span>`);
    resetBackupView();
  });
}
async function connectSignerWallet() {
  let candidate = discoveredProviders.find(p => !/lukso|universal profile/i.test(p.info.name))?.provider;
  if (!candidate && window.ethereum && window.ethereum !== window.lukso) candidate = window.ethereum;
  // No wallet in this browser (a phone): MetaMask on the phone through WalletConnect (site-ui.js).
  if (!candidate) {
    try { candidate = await SiteUI.walletConnectSigner({ chain: getNetwork }); } catch (e) { candidate = null; }
    if (!candidate) {
      if (!signerAddress) setSignerStatus(`<span class="empty">${t("notConnected")}</span>`);
      return false;
    }
  }
  try {
    // Ask the wallet to show its account picker every time, so the signer can be chosen (genesis
    // key, backup, ...). eth_requestAccounts alone silently returns the account already connected.
    // Wallets without wallet_requestPermissions fall back to it; a refusal in the picker stops here.
    try { await candidate.request({ method: "wallet_requestPermissions", params: [{ eth_accounts: {} }] }); }
    catch (e) { if (e && e.code === 4001) throw e; }
    const accounts = await candidate.request({ method: "eth_requestAccounts" });
    signerAddress = accounts[0];
    signerProvider = candidate;
    watchSigner(candidate);
    let netLabel = "";
    try {
      const chainIdHex = await candidate.request({ method: "eth_chainId" });
      netLabel = ` · ${chainDisplayName(parseInt(chainIdHex, 16))}`;
    } catch (e) { /* the address is shown even when the network cannot be read */ }
    showSigner(netLabel);
    return true;
  } catch (e) {
    setSignerStatus(`<span class="badge err">${t("connectionRejected")}</span>`);
    return false;
  }
}
let watchedSigner = null;
function watchSigner(p) {
  if (watchedSigner === p || typeof p.on !== "function") return;
  watchedSigner = p;
  p.on("chainChanged", () => resetBackupView());
  p.on("accountsChanged", (accs) => {
    signerAddress = accs && accs[0] ? accs[0] : null;
    if (signerAddress) showSigner(); else setSignerStatus(`<span class="empty">${t("notConnected")}</span>`);
    resetBackupView();
  });
}

// --- The genesis key(s): the controllers set by the UP's creation on LUKSO ---
// Read from the LUKSO explorer: the creation transaction's LSP23 calldata, straight or from its trace.
// The explorer is not trusted: a calldata counts only if it predicts exactly this UP's address.
// Used for the "genesis key" badge and the warning before removing it; nothing else depends on it.
const LUKSO_EXPLORER_API = "https://explorer.execution.mainnet.lukso.network/api/v2/";
let genesisCache = { up: "", list: [] }, genesisMissing = false;
async function explorerGet(path) {
  const res = await fetch(LUKSO_EXPLORER_API + path, { referrerPolicy: "no-referrer", signal: AbortSignal.timeout(8000) });
  if (!res.ok) throw new Error(`explorer HTTP ${res.status}`);
  return res.json();
}
const isDeployCall = (to, input) =>
  typeof input === "string" && input.toLowerCase().startsWith(DEPLOY_SELECTOR) && String(to || "").toLowerCase() === FACTORY_ADDRESS.toLowerCase();
const minimalProxyInitcode = (impl) => "0x3d602d80600a3d3981f3363d3d373d3d3d363d73" + impl.slice(2).toLowerCase() + "5af43d82803e903d91602b57fd5bf3";
// The controllers in an LSP23 calldata, or null when it does not create `up`.
function genesisFromCalldata(data, up) {
  const coder = ethers.AbiCoder.defaultAbiCoder();
  const [p, s, module, moduleCalldata] = coder.decode(["tuple(bytes32,uint256,address,bytes)", "tuple(uint256,address,bytes,bool,bytes)", "address", "bytes"], "0x" + data.slice(10));
  const salt = ethers.keccak256(coder.encode(["bytes32", "address", "bytes", "bool", "bytes", "address", "bytes"], [p[0], s[1], s[2], s[3], s[4], module, moduleCalldata]));
  if (ethers.getCreate2Address(FACTORY_ADDRESS, salt, ethers.keccak256(minimalProxyInitcode(p[2]))).toLowerCase() !== up.toLowerCase()) return null;
  const [keys] = coder.decode(["bytes32[]", "bytes[]"], moduleCalldata);
  return keys.map(k => k.toLowerCase().slice(2)).filter(k => k.startsWith(PERM_PREFIX)).map(k => "0x" + k.slice(24))
    .filter(a => !KNOWN_ADDRESSES[a]).map(a => ethers.getAddress(a).toLowerCase());
}
async function genesisOf(up) {
  if (genesisCache.up === up) return genesisCache.list;
  let list = [];
  try {
    const addr = await explorerGet("addresses/" + up);
    const txHash = addr.creation_transaction_hash || addr.creation_tx_hash;
    if (txHash) {
      const tx = await explorerGet("transactions/" + txHash);
      let inputs = isDeployCall(tx.to && tx.to.hash, tx.raw_input || tx.input) ? [tx.raw_input || tx.input] : [];
      if (!inputs.length) {
        const trace = await explorerGet("transactions/" + txHash + "/raw-trace");
        inputs = (Array.isArray(trace) ? trace : []).map(c => c.action || c).filter(a => isDeployCall(a.to, a.input)).map(a => a.input);
      }
      for (const data of inputs) { try { const g = genesisFromCalldata(data, up); if (g) { list = g; break; } } catch (e) { /* not this one */ } }
    }
  } catch (e) { /* explorer unreachable: no genesis badge */ }
  genesisCache = { up, list };
  genesisMissing = !list.length;
  $("genesisNote").textContent = genesisMissing ? t("genesisUnknown") : "";
  return list;
}

// ==================== 5. Backup controller ====================
// Adds a second controller with exactly the signer's permissions (and its AllowedCalls /
// AllowedERC725YDataKeys, if any), or removes a lost controller. One Key Manager transaction,
// simulated before MetaMask opens and re-read after confirmation. Detection and the list are
// read by backup-check.js, the same code that drives the alert on the other pages.
const BK = window.BackupCheck;
const KM_EXEC_IFACE = new ethers.Interface(["function execute(bytes) payable returns (bytes)"]);
const UP_DATA_IFACE = new ethers.Interface(["function setDataBatch(bytes32[] dataKeys, bytes[] dataValues)", "function getDataBatch(bytes32[]) view returns (bytes[])"]);
const LUKSO_CHAIN_IDS = [42, 4201];
let bk = null;      // last read: { up, rpc, chainId, netName, provider, r, signer, signerCtrl, genesis }
let bkBusy = false;

const permNames = (p) => { const f = []; for (let i = 0; i < 24; i++) if ((p >> BigInt(i)) & 1n) f.push(i === 23 ? "ERC4337" : PERMISSION_BITS[i]); return f.join(", ") || "—"; };
const permHex = (p) => "0x" + p.toString(16);
function bkLog(msg, cls) {
  const l = document.createElement("div");
  if (cls) l.className = cls;
  l.textContent = msg;
  $("backupLog").appendChild(l);
  // While an action runs, the fixed box shows its latest step (first line only).
  if (bkBusy && !/^—— /.test(msg)) { const first = String(msg).split("\n")[0]; $("busyMsg").textContent = first.length > 200 ? first.slice(0, 200) + "…" : first; }
}
// The log keeps every action of the session: each one starts with time, UP and network.
function bkSeparator() {
  const net = getNetwork();
  const up = $("upAddress").value.trim();
  bkLog(`—— ${new Date().toLocaleTimeString()} · UP ${up || "?"} · ${net ? net.name : "?"} ——`, "line-dim");
}
function setBusy(on) {
  bkBusy = on;
  if (on) $("busyMsg").textContent = t("busyStart");
  $("busyToast").classList.toggle("on", on);
  updateBackupButtons();
}
function setBackupStatus(text, cls) {
  const el = $("backupStatus");
  el.innerHTML = "";
  const sp = document.createElement("div");
  sp.className = cls || "";
  sp.style.whiteSpace = "pre-wrap";
  sp.textContent = text;
  el.appendChild(sp);
}
// Same rule as backup-check.js: two admin controllers with the same permissions, ERC4337 ignored.
function backupAmong(list) {
  const groups = {}, seen = new Set();
  list.filter(c => c.role === "controller" && (c.perms & BK.ADMIN) === BK.ADMIN && !seen.has(c.address) && seen.add(c.address))
    .forEach(c => { const g = (c.perms & ~BK.ERC4337).toString(16); groups[g] = (groups[g] || 0) + 1; });
  return Object.values(groups).some(n => n >= 2);
}
function resetBackupView() {
  if (!bk) return;
  bk = null;
  setBackupStatus(t("bkChangedRead"), "line-warn");
  $("backupList").innerHTML = "";
  updateBackupButtons();
}
function signerState(b) {
  if (!b || !b.signer) return "none";
  if (!b.signerCtrl) return "notCtrl";
  return (b.signerCtrl.perms & BK.ADMIN) === BK.ADMIN ? "ok" : "notAdmin";
}
function updateBackupButtons() {
  const ok = !bkBusy && bk && signerState(bk) === "ok";
  $("addBackupBtn").disabled = !ok;
  $("addPhoneBtn").disabled = !ok;
  $("removeBtn").disabled = !ok || !$("removeSelect").value;
  $("readCtrlBtn").disabled = bkBusy;
  $("connectSigner").disabled = bkBusy;
}
function renderBackup() {
  if (!bk) return;
  const { r, netName } = bk;
  const summary = r.hasBackup ? t("bkSummaryOk", { net: netName, n: Math.max(2, r.admins.length) })
    : r.admins.length ? t("bkSummaryMissing", { net: netName }) : t("bkSummaryNoAdmin", { net: netName });
  const st = signerState(bk);
  const signerLine = st === "none" ? t("bkSignerNone") : st === "notCtrl" ? t("bkSignerNotCtrl", { addr: bk.signer })
    : st === "notAdmin" ? t("bkSignerNotAdmin", { addr: bk.signer }) : t("bkSignerOk", { addr: bk.signer });
  setBackupStatus(summary + "\n" + signerLine, r.hasBackup ? (st === "ok" ? "line-ok" : "line-warn") : r.admins.length ? "line-warn" : "line-err");
  const box = $("backupList");
  box.innerHTML = "";
  r.controllers.forEach(c => {
    const card = document.createElement("div");
    card.className = "ctrl-card";
    const a = document.createElement("div");
    a.className = "addr";
    a.textContent = `[${c.index}] ${c.address || "?"}`;
    const role = document.createElement("div");
    role.style.marginTop = "4px";
    const badges = [];
    if (c.role === "entrypoint") badges.push(["ok", t("bkRoleEp")]);
    else if (c.role === "urd") badges.push(["ok", t("bkRoleUrd")]);
    else if (c.role === "malformed") badges.push(["err", t("bkRoleBad")]);
    else {
      if (bk.signer && c.address.toLowerCase() === bk.signer.toLowerCase()) badges.push(["ok", t("bkRoleYou")]);
      else badges.push(["warn", t("bkRoleCtrl")]);
      if ((c.perms & BK.ADMIN) === BK.ADMIN) badges.push(["err", t("bkAdmin")]);
      if (bk.genesis.includes(c.address.toLowerCase())) badges.push(["warn", t("bkGenesis")]);
    }
    // A space between badges too, so a copied list stays readable.
    badges.forEach(([cls, text], i) => { const s = document.createElement("span"); s.className = "badge " + cls; s.style.marginRight = "6px"; s.textContent = text; if (i) role.append(" "); role.appendChild(s); });
    // What it is for, in plain words.
    const why = [];
    if (c.role === "entrypoint") why.push(t("bkWhyEp"));
    else if (c.role === "urd") why.push(t("bkWhyUrd"));
    else if (c.role === "malformed") why.push(t("bkWhyBad"));
    else {
      const admin = (c.perms & BK.ADMIN) === BK.ADMIN;
      why.push(t(admin ? "bkWhyAdmin" : "bkWhyLimited"));
      if (admin && r.admins.some(o => o !== c && (o.perms & ~BK.ERC4337) === (c.perms & ~BK.ERC4337))) why.push(t("bkWhyPair"));
      if (bk.genesis.includes(c.address.toLowerCase())) why.push(t("bkWhyGenesis"));
      if (bk.signer && c.address.toLowerCase() === bk.signer.toLowerCase()) why.push(t("bkWhyYou"));
    }
    const whyEl = document.createElement("div");
    whyEl.style.cssText = "font-size:12.5px; color:var(--text); margin-top:6px; line-height:1.5;";
    whyEl.textContent = why.join(" ");
    const flags = document.createElement("div");
    flags.className = "flags";
    flags.textContent = `${permHex(c.perms)} — ${permNames(c.perms)}`;
    card.append(a, role, whyEl, flags);
    box.appendChild(card);
  });
  const sel = $("removeSelect");
  const prev = sel.value;
  sel.innerHTML = "";
  const removable = r.controllers.filter(c => c.role === "controller" && !(bk.signer && c.address.toLowerCase() === bk.signer.toLowerCase()));
  if (!removable.length) {
    const o = document.createElement("option"); o.value = ""; o.textContent = t("removeNone"); sel.appendChild(o);
  } else {
    removable.forEach(c => {
      const o = document.createElement("option");
      o.value = c.address;
      const tags = [(c.perms & BK.ADMIN) === BK.ADMIN ? t("bkAdmin") : t("bkRoleCtrl")];
      if (bk.genesis.includes(c.address.toLowerCase())) tags.push(t("bkGenesis"));
      o.textContent = `${c.address} — ${permHex(c.perms)} · ${tags.join(", ")}`;
      sel.appendChild(o);
    });
    if (removable.some(c => c.address === prev)) sel.value = prev;
  }
  updateBackupButtons();
}

// Reads the UP's controllers on the selected network. Returns the state or null (and says why).
// The block of this page's last backup write, per UP and chain. Later reads are pinned at or after it:
// a load-balanced RPC answering from an older node would otherwise show the list as it was before the
// write, and the next write would overwrite an entry (AUDIT 2026-10-02 L-4).
let bkSeen = { key: "", block: 0 };
async function readBackup() {
  bk = null;
  $("backupList").innerHTML = "";
  updateBackupButtons();
  const raw = $("upAddress").value.trim();
  if (!ethers.isAddress(raw)) { setBackupStatus(t("bkNeedUp"), "line-err"); return null; }
  const net = getNetwork();
  if (!net || !net.rpc) { setBackupStatus(t("bkNeedNet"), "line-err"); return null; }
  setBackupStatus(t("bkReading"), "line-dim");
  try {
    const up = ethers.getAddress(raw);
    const probe = new ethers.JsonRpcProvider(net.rpc, undefined, { batchMaxCount: 1 });
    const chainId = Number(await probe.send("eth_chainId", []));
    if (net.chainId && chainId !== net.chainId) { setBackupStatus(t("rpcChainMismatchErr", { rpcChainId: chainId, netName: net.name, chainId: net.chainId }), "line-err"); return null; }
    const provider = new ethers.JsonRpcProvider(net.rpc, chainId, { staticNetwork: true, batchMaxCount: 1 });
    if ((await provider.getCode(up)) === "0x") { setBackupStatus(t("bkNotDeployed", { up }), "line-err"); return null; }
    let at;
    if (bkSeen.key === `${chainId}:${up}`) {
      let head = 0;
      for (let i = 0; i < 6; i++) { if (i) await new Promise(res => setTimeout(res, 1500)); head = await provider.getBlockNumber(); if (head >= bkSeen.block) break; }
      if (head < bkSeen.block) { setBackupStatus(t("bkRpcBehind", { block: bkSeen.block, head }), "line-err"); return null; }
      at = { blockTag: head };
    }
    const r = await BK.read(provider, up, at);
    const signer = signerAddress ? ethers.getAddress(signerAddress) : null;
    const signerCtrl = signer ? r.controllers.find(c => c.role === "controller" && c.address === signer) || null : null;
    // The genesis controllers, from the UP's creation transaction on LUKSO (empty when not found).
    const genesis = await genesisOf(up);
    const netName = net.chainId ? net.name : `${t("customNetName")} (chainId ${chainId})`;
    bk = { up, rpc: net.rpc, chainId, netName, provider, r, signer, signerCtrl, genesis };
    renderBackup();
    return bk;
  } catch (e) {
    setBackupStatus(t("bkReadFail", { err: e.shortMessage || e.message }), "line-err");
    return null;
  }
}
$("readCtrlBtn").addEventListener("click", async () => {
  if (bkBusy) return;
  bkSeparator();
  setBusy(true); $("busyMsg").textContent = t("bkReading");
  try { await readBackup(); } finally { setBusy(false); }
});
// Connecting reads the controllers right away when UP and network are set.
$("connectSigner").addEventListener("click", async () => {
  if (bkBusy) return;
  if (!(await connectSignerWallet())) return;
  if (!ethers.isAddress($("upAddress").value.trim())) return;
  setBusy(true); $("busyMsg").textContent = t("bkReading");
  try { await readBackup(); } finally { setBusy(false); }
});
$("removeSelect").addEventListener("change", updateBackupButtons);
$("copyBackupLog").addEventListener("click", async () => {
  try { await navigator.clipboard.writeText($("backupLog").innerText); $("copyBackupLog").textContent = t("copiedLog"); }
  catch (e) { /* clipboard not allowed: the log can still be selected by hand */ }
  setTimeout(() => { $("copyBackupLog").textContent = t("copyLogBtn"); }, 1500);
});

// A fresh read, then the checks every write needs: admin signer, wallet on the same chain.
async function freshAdminState() {
  const b = await readBackup();
  if (!b) return null;
  const st = signerState(b);
  if (st !== "ok") { bkLog(st === "none" ? t("bkSignerNone") : t(st === "notCtrl" ? "bkSignerNotCtrl" : "bkSignerNotAdmin", { addr: b.signer }), "line-err"); return null; }
  let walletChainId;
  try { walletChainId = parseInt(await signerProvider.request({ method: "eth_chainId" }), 16); }
  catch (e) { bkLog(t("walletNetworkCheckFailed", { netName: b.netName }), "line-err"); return null; }
  if (walletChainId !== b.chainId) { bkLog(t("walletWrongNetwork", { walletChainId, netName: b.netName, chainId: b.chainId }) + (signerProvider.isWalletConnect ? " " + signerProvider.wrongChainText() : ""), "line-err"); return null; }
  b.km = b.r.km ? ethers.getAddress(b.r.km) : null;
  if (!b.km || (await b.provider.getCode(b.km)) === "0x") { bkLog(t("bkReadFail", { err: "Key Manager" }), "line-err"); return null; }
  return b;
}

// After a write: every controller listed just before its block (except the one removed) must still be
// listed. The "before" list is read at the previous block, not taken from the page's own read: a stale
// read is exactly what could have made the write overwrite an entry (AUDIT 2026-10-02 L-4).
async function stillListed(b, at, removed) {
  const [before, after] = await Promise.all([BK.read(b.provider, b.up, { blockTag: at.blockTag - 1 }), BK.read(b.provider, b.up, at)]);
  const now = new Set(after.controllers.map(c => (c.address || "").toLowerCase()));
  return before.controllers.filter(c => c.address && c.address.toLowerCase() !== String(removed || "").toLowerCase() && !now.has(c.address.toLowerCase()))
    .map(c => `${c.address} no longer listed`);
}

// Simulates, sends through MetaMask, waits, then re-reads with `verify(at)` (a list of problems).
async function sendBackupTx(b, data, verify, what) {
  bkLog(t("bkSimulating"), "line-dim");
  try { await b.provider.call({ from: b.signer, to: b.km, data }); }
  catch (e) { bkLog(t("bkSimFail", { err: e.shortMessage || e.reason || e.message }), "line-err"); return false; }
  // The signer pays the gas: check its balance before MetaMask opens (a fresh backup key often holds
  // nothing on this network, and the wallet then shows only a generic fee alert).
  try {
    const [gas, fee, bal] = await Promise.all([b.provider.estimateGas({ from: b.signer, to: b.km, data }), b.provider.getFeeData(), b.provider.getBalance(b.signer)]);
    const price = fee.maxFeePerGas || fee.gasPrice;
    if (price) {
      const net = getNetwork();
      const cur = net && net.currency && net.currency !== "?" ? net.currency : "";
      const v = { addr: b.signer, bal: ethers.formatEther(bal), cost: ethers.formatEther(gas * price), cur };
      if (bal < gas * price) { bkLog(t("bkNoGas", v), "line-err"); return false; }
      bkLog(t("bkGasOk", v), "line-dim");
    }
  } catch (e) { /* no estimate: MetaMask still shows its own fee */ }
  bkLog(t("bkSimOk"), "line-ok");
  const browserProvider = new ethers.BrowserProvider(signerProvider);
  browserProvider.pollingInterval = 1000; // confirm as soon as the block is there (default 4 s)
  const signerObj = await browserProvider.getSigner();
  if (signerObj.address.toLowerCase() !== b.signer.toLowerCase()) { bkLog(t("signerChangedErr", { now: signerObj.address, checked: b.signer }), "line-err"); return false; }
  const tx = await SignCheck.sendTransaction(signerObj, { to: b.km, data, chainId: b.chainId }, { what, toLabel: { it: "Key Manager della UP", en: "the UP's Key Manager" } });
  bkLog(t("bkTx", { hash: tx.hash }), "line-dim");
  bkLog(t("bkWaiting"), "line-dim");
  const receipt = await tx.wait();
  if (!receipt || receipt.status !== 1) { bkLog(t("bkTxFailed"), "line-err"); return false; }
  bkSeen = { key: `${b.chainId}:${b.up}`, block: receipt.blockNumber };
  const net = getNetwork();
  const url = net && getExplorerUrl(net, "/tx/", tx.hash);
  if (url) bkLog(url, "line-dim");
  // Public RPCs are load-balanced: read at the receipt's block, retrying while a node lags behind.
  let problems = ["not read"];
  for (let i = 0; i < 6 && problems.length; i++) {
    if (i) await new Promise(res => setTimeout(res, 1500));
    try { problems = await verify({ blockTag: receipt.blockNumber }); } catch (e) { problems = [e.shortMessage || e.message]; }
  }
  return problems;
}

$("addBackupBtn").addEventListener("click", async () => {
  if (bkBusy) return;
  bkSeparator();
  setBusy(true);
  try {
    const b = await freshAdminState();
    if (!b) return;
    const rawAddr = $("backupAddress").value.trim();
    if (!ethers.isAddress(rawAddr) || BigInt(rawAddr) === 0n) { bkLog(t("bkBadAddr"), "line-err"); return; }
    const backup = ethers.getAddress(rawAddr);
    if (backup === b.signer) { bkLog(t("bkSameAsSigner"), "line-err"); return; }
    if ([b.up, b.km, BK.ENTRY_POINT].map(x => x.toLowerCase()).includes(backup.toLowerCase()) || backup.toLowerCase() === b.r.urd || KNOWN_ADDRESSES[backup.toLowerCase()]) { bkLog(t("bkSystem"), "line-err"); return; }
    const upData = new ethers.Contract(b.up, UP_DATA_IFACE, b.provider);
    const [existing, calls, dataKeys] = await upData.getDataBatch([BK.permKey(backup), BK.callsKey(b.signer), BK.dataKeysKey(b.signer)]);
    if ((existing && existing !== "0x" && BigInt(existing) !== 0n) || b.r.controllers.some(c => c.address === backup)) { bkLog(t("bkAlready"), "line-err"); return; }
    // A plain account, or one delegated through EIP-7702 (code 0xef0100 + address): never a contract.
    const code = (await b.provider.getCode(backup)).toLowerCase();
    if (code !== "0x" && !code.startsWith("0xef0100")) { bkLog(t("bkContract"), "line-err"); return; }
    const raw = b.signerCtrl.raw;
    const keys = [BK.ARRAY_KEY, BK.indexKey(b.r.len), BK.permKey(backup)];
    const vals = [ethers.toBeHex(b.r.len + 1, 16), backup, raw];
    const copy = [];
    if (calls && calls !== "0x") { keys.push(BK.callsKey(backup)); vals.push(calls); copy.push("calls"); }
    if (dataKeys && dataKeys !== "0x") { keys.push(BK.dataKeysKey(backup)); vals.push(dataKeys); copy.push("keys"); }
    bkLog(t("bkPlanAdd", { signer: b.signer, km: b.km, len: b.r.len, len1: b.r.len + 1, backup, perms: permHex(b.signerCtrl.perms), names: permNames(b.signerCtrl.perms), extra: copy.length ? t("bkPlanExtra") : "" }), "line-dim");
    const data = KM_EXEC_IFACE.encodeFunctionData("execute", [UP_DATA_IFACE.encodeFunctionData("setDataBatch", [keys, vals])]);
    const what = { it: `Aggiunge il backup ${backup} alla UP ${b.up}, con gli stessi permessi di ${b.signer}`, en: `Adds the backup ${backup} to the UP ${b.up}, with the same permissions as ${b.signer}` };
    const problems = await sendBackupTx(b, data, async (at) => {
      const [p, lenRaw, item] = await upData.getDataBatch([BK.permKey(backup), BK.ARRAY_KEY, BK.indexKey(b.r.len)], at);
      const out = [];
      if (String(p).toLowerCase() !== String(raw).toLowerCase()) out.push(`permissions ${p}`);
      if (BigInt(lenRaw || "0x0") !== BigInt(b.r.len + 1)) out.push(`list length ${lenRaw}`);
      if (String(item).toLowerCase() !== backup.toLowerCase()) out.push(`list entry ${item}`);
      out.push(...await stillListed(b, at, null));
      return out;
    }, what);
    if (problems === false) return;
    bkLog(problems.length ? t("bkVerifyBad", { what: problems.join(", ") }) : t("bkAddOk", { addr: backup }), problems.length ? "line-warn" : "line-ok");
    await readBackup();
  } catch (e) {
    if (e && (e.code === "ACTION_REJECTED" || e.code === 4001)) bkLog(t("bkCancelled"), "line-warn");
    else bkLog(t("bkError", { err: e.shortMessage || e.message }), "line-err");
  } finally {
    setBusy(false);
  }
});

// The phone key of the UP Wallet app (0.9.0): a controller with no admin permissions, which can still use all
// the UP's funds (AUDIT 2026-10-26 PK-3). SUPER_CALL and
// SUPER_TRANSFERVALUE (plain CALL and TRANSFERVALUE would need a list of allowed contracts), SIGN, the 4337
// permission (gas paid by the site) and SETDATA restricted by AllowedERC725YDataKeys to LSP3Profile. Never
// ADDCONTROLLER, EDITPERMISSIONS or extensions. Revoked with "Remove the selected controller".
const LSP3_PROFILE_KEY = "0x5ef83ad9559033e6e941db7d7c495acdce616347d28e90c7ce47cbfcfcad3bc5";
const PHONE_PERMS = 0x100n | 0x400n | 0x40000n | 0x200000n | BK.ERC4337;   // SUPER_TRANSFERVALUE, SUPER_CALL, SETDATA, SIGN, ERC4337
const PHONE_DATA_KEYS = ethers.concat(["0x0020", LSP3_PROFILE_KEY]);       // CompactBytesArray: one 32-byte key
$("addPhoneBtn").addEventListener("click", async () => {
  if (bkBusy) return;
  bkSeparator();
  setBusy(true);
  try {
    const b = await freshAdminState();
    if (!b) return;
    const rawAddr = $("phoneAddress").value.trim();
    if (!ethers.isAddress(rawAddr) || BigInt(rawAddr) === 0n) { bkLog(t("bkBadAddr"), "line-err"); return; }
    // An address from the link is someone else's until the admin compares it with the app (AUDIT 2026-10-26 PK-1).
    if (phoneFromLink() && !$("phoneLinkAck").checked) { bkLog(t("bkPhoneLinkAck"), "line-err"); return; }
    const phone = ethers.getAddress(rawAddr);
    if (phone === b.signer) { bkLog(t("bkSameAsSigner"), "line-err"); return; }
    if ([b.up, b.km, BK.ENTRY_POINT].map(x => x.toLowerCase()).includes(phone.toLowerCase()) || phone.toLowerCase() === b.r.urd || KNOWN_ADDRESSES[phone.toLowerCase()]) { bkLog(t("bkSystem"), "line-err"); return; }
    const listed = b.r.controllers.find(c => c.address === phone);
    if (listed && (listed.perms & BK.ADMIN) === BK.ADMIN) { bkLog(t("bkPhoneAdmin"), "line-err"); return; }
    const upData = new ethers.Contract(b.up, UP_DATA_IFACE, b.provider);
    const [existing] = await upData.getDataBatch([BK.permKey(phone)]);
    if ((existing && existing !== "0x" && BigInt(existing) !== 0n) || listed) { bkLog(t("bkAlready"), "line-err"); return; }
    // The phone key is a plain account: never a contract.
    if ((await b.provider.getCode(phone)) !== "0x") { bkLog(t("bkContract"), "line-err"); return; }
    const perms = ethers.zeroPadValue(ethers.toBeHex(PHONE_PERMS), 32);
    const keys = [BK.ARRAY_KEY, BK.indexKey(b.r.len), BK.permKey(phone), BK.dataKeysKey(phone)];
    const vals = [ethers.toBeHex(b.r.len + 1, 16), phone, perms, PHONE_DATA_KEYS];
    bkLog(t("bkPlanPhone", { signer: b.signer, km: b.km, len: b.r.len, len1: b.r.len + 1, phone, perms: permHex(PHONE_PERMS), names: permNames(PHONE_PERMS) }), "line-dim");
    const data = KM_EXEC_IFACE.encodeFunctionData("execute", [UP_DATA_IFACE.encodeFunctionData("setDataBatch", [keys, vals])]);
    const what = { it: `Autorizza il dispositivo ${phone} sulla UP ${b.up}: nessun permesso di amministrazione, ma accesso ai fondi della UP`, en: `Authorizes the device ${phone} on the UP ${b.up}: no admin permissions, but access to the UP's funds` };
    const problems = await sendBackupTx(b, data, async (at) => {
      const [p, dk, lenRaw, item] = await upData.getDataBatch([BK.permKey(phone), BK.dataKeysKey(phone), BK.ARRAY_KEY, BK.indexKey(b.r.len)], at);
      const out = [];
      if (String(p).toLowerCase() !== perms.toLowerCase()) out.push(`permissions ${p}`);
      if (String(dk).toLowerCase() !== PHONE_DATA_KEYS.toLowerCase()) out.push(`allowed data keys ${dk}`);
      if (BigInt(lenRaw || "0x0") !== BigInt(b.r.len + 1)) out.push(`list length ${lenRaw}`);
      if (String(item).toLowerCase() !== phone.toLowerCase()) out.push(`list entry ${item}`);
      out.push(...await stillListed(b, at, null));
      return out;
    }, what);
    if (problems === false) return;
    bkLog(problems.length ? t("bkVerifyBad", { what: problems.join(", ") }) : t("bkPhoneOk", { addr: phone }), problems.length ? "line-warn" : "line-ok");
    await readBackup();
  } catch (e) {
    if (e && (e.code === "ACTION_REJECTED" || e.code === 4001)) bkLog(t("bkCancelled"), "line-warn");
    else bkLog(t("bkError", { err: e.shortMessage || e.message }), "line-err");
  } finally {
    setBusy(false);
  }
});

$("removeBtn").addEventListener("click", async () => {
  if (bkBusy) return;
  bkSeparator();
  if (!$("removeAck").checked) { bkLog(t("bkAckRequired"), "line-err"); return; }
  const chosen = $("removeSelect").value;
  if (!chosen) { bkLog(t("bkPickRemove"), "line-err"); return; }
  setBusy(true);
  try {
    const b = await freshAdminState();
    if (!b) return;
    const target = b.r.controllers.find(c => c.role === "controller" && c.address === chosen);
    if (!target || target.address === b.signer) { bkLog(t("bkChangedRead"), "line-err"); return; }
    const last = b.r.len - 1;
    const lastEntry = b.r.controllers[last];
    if (!lastEntry || !lastEntry.address) { bkLog(t("bkRoleBad"), "line-err"); return; }
    const upData = new ethers.Contract(b.up, UP_DATA_IFACE, b.provider);
    const [calls, dataKeys] = await upData.getDataBatch([BK.callsKey(target.address), BK.dataKeysKey(target.address)]);
    // Remove from AddressPermissions[]: move the last entry into the removed slot, shorten the list.
    const keys = [], vals = [];
    if (target.index !== last) { keys.push(BK.indexKey(target.index)); vals.push(lastEntry.address); }
    keys.push(BK.indexKey(last), BK.ARRAY_KEY, BK.permKey(target.address));
    vals.push("0x", ethers.toBeHex(last, 16), "0x");
    let cleared = false;
    if (calls && calls !== "0x") { keys.push(BK.callsKey(target.address)); vals.push("0x"); cleared = true; }
    if (dataKeys && dataKeys !== "0x") { keys.push(BK.dataKeysKey(target.address)); vals.push("0x"); cleared = true; }
    bkLog(t("bkPlanRemove", { signer: b.signer, km: b.km, target: target.address, index: target.index, len: b.r.len, len1: last,
      moved: target.index !== last ? t("bkPlanMoved", { addr: lastEntry.address }) : "", extra: cleared ? t("bkPlanClear") : "" }), "line-dim");
    if (b.genesis.includes(target.address.toLowerCase())) bkLog(t("bkGenesisWarn"), "line-warn");
    if (!backupAmong(b.r.controllers.filter(c => c !== target))) bkLog(t("bkNoBackupAfter"), "line-warn");
    const data = KM_EXEC_IFACE.encodeFunctionData("execute", [UP_DATA_IFACE.encodeFunctionData("setDataBatch", [keys, vals])]);
    const what = { it: `Toglie il controller ${target.address} dalla UP ${b.up}`, en: `Removes the controller ${target.address} from the UP ${b.up}` };
    const problems = await sendBackupTx(b, data, async (at) => {
      const [p, lenRaw] = await upData.getDataBatch([BK.permKey(target.address), BK.ARRAY_KEY], at);
      const len = Number(BigInt(lenRaw || "0x0"));
      const list = len > 0 && len <= 50 ? await upData.getDataBatch(Array.from({ length: len }, (_, k) => BK.indexKey(k)), at) : [];
      const out = [];
      if (p && p !== "0x") out.push(`permissions ${p}`);
      if (len !== last) out.push(`list length ${len}`);
      if (list.some(v => v && v.toLowerCase() === target.address.toLowerCase())) out.push("still listed");
      out.push(...await stillListed(b, at, target.address));
      return out;
    }, what);
    if (problems === false) return;
    bkLog(problems.length ? t("bkVerifyBad", { what: problems.join(", ") }) : t("bkRemoveOk", { addr: target.address }), problems.length ? "line-warn" : "line-ok");
    $("removeAck").checked = false;
    await readBackup();
  } catch (e) {
    if (e && (e.code === "ACTION_REJECTED" || e.code === 4001)) bkLog(t("bkCancelled"), "line-warn");
    else bkLog(t("bkError", { err: e.shortMessage || e.message }), "line-err");
  } finally {
    setBusy(false);
  }
});

// Changing the UP, the network or the RPC asks for a fresh read.
["upAddress", "customRpc", "customExplorer"].forEach(id => $(id).addEventListener("input", resetBackupView));
networkSelectEl.addEventListener("change", resetBackupView);

// The phone's address as the link gave it, while the field still holds it.
let phoneLinkAddr = null;
function phoneFromLink() {
  const v = $("phoneAddress").value.trim();
  return !!phoneLinkAddr && ethers.isAddress(v) && ethers.getAddress(v) === phoneLinkAddr;
}
function syncPhoneLink() {
  const fromLink = phoneFromLink();
  $("phoneLinkRow").hidden = !fromLink;
  if (!fromLink) $("phoneLinkAck").checked = false;
}
$("phoneAddress").addEventListener("input", syncPhoneLink);

// Links from the deploy page and from the alert on the other pages: ?network=<key>&up=<address>
{
  const q = new URLSearchParams(location.search);
  const presetNet = q.get("network"), presetUp = q.get("up");
  if (presetNet && NETWORKS.some(c => c.key === presetNet)) {
    networkSelectEl.value = presetNet;
    $("customRpcWrap").style.display = presetNet === "custom" ? "block" : "none";
  }
  if (presetUp && ethers.isAddress(presetUp)) $("upAddress").value = ethers.getAddress(presetUp);
  // From the UP Wallet app's "This phone" panel: ?phone=<the phone key's address>. Anyone can make such a
  // link, so an address from it needs the admin's confirmation that it matches the app (AUDIT 2026-10-26 PK-1).
  const presetPhone = q.get("phone");
  if (presetPhone && ethers.isAddress(presetPhone)) {
    phoneLinkAddr = ethers.getAddress(presetPhone);
    $("phoneAddress").value = phoneLinkAddr;
  }
  syncPhoneLink();
}

applyI18n();
// Shared look of the site (site-ui.js): the main networks as buttons with their logo, a green dot where the UP exists.
SiteUI.netPicker({ select: document.getElementById("network"), filter: document.getElementById("networkFilter"), upInput: document.getElementById("upAddress") });
SiteUI.clampNotes();   // long explanations: three lines and "Read more"
</script>
