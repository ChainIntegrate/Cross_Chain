<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="script-src 'self' https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.4/">
<script src="theme.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Crea una Universal Profile — ChainIntegrate</title>
<meta name="description" content="Crea su LUKSO una Universal Profile per un cliente: profilo, chiavi e permessi, gas pagato dall'operatore. Il cliente non ha bisogno di LYX né di account social.">
<link rel="icon" href="favicon.ico">
<meta property="og:type" content="website">
<meta property="og:title" content="Crea una Universal Profile — ChainIntegrate">
<meta property="og:description" content="Crea su LUKSO una Universal Profile per un cliente: profilo, chiavi e permessi, gas pagato dall'operatore.">
<meta property="og:image" content="https://crosschain-lukso.chainintegrate.it/og-image.png">
<meta property="og:url" content="https://crosschain-lukso.chainintegrate.it/up-create.html">
<meta name="twitter:card" content="summary">
<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.4/ethers.umd.min.js" integrity="sha384-6Zl0Pc8zjSz8KvmNeXRvUQgY4ryFb+BwDvKCmLYcBME0joAaru491tQgi9B7zsMM" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="chains.js"></script>
<script src="site-ui.js"></script>
<script src="backup-check.js"></script>
<script src="deploy-check.js"></script>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --border: #2a2f3a; --field: #10131a; --chip: #2a2f3a; --disabled: #3a3f4b; --raised: #1d2330;
    --text: #e6e8ec; --text-dim: #9aa1ad;
    --accent: #5b8cff; --ok: #3fbf6f; --warn: #e0a83c; --err: #e05a5a;
  }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
         max-width: 820px; margin: 0 auto; padding: 32px 20px 80px; }
  .header-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
  .brand-row { margin-bottom: 24px; }
  .brand-logo { display: block; width: 100%; height: auto; border-radius: 10px; }
  .site-footer { margin-top: 40px; padding: 18px 20px; background: #f5f6f8; border: 1px solid #e3e5ea; border-radius: 10px; color: #4b4f58; }
  .footer-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .footer-logo { height: 48px; width: auto; flex-shrink: 0; }
  .footer-text { font-size: 13px; line-height: 1.6; }
  .footer-li { display: inline-flex; vertical-align: middle; margin: 0 2px; }
  .site-footer a { color: #2563eb; text-decoration: none; font-weight: 600; }
  .site-footer a:hover { text-decoration: underline; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .subtitle { color: var(--text-dim); font-size: 13px; margin-bottom: 28px; }
  #langToggle { width: auto; background: var(--chip); padding: 8px 14px; font-size: 12.5px; font-weight: 600;
                border-radius: 6px; border: 1px solid var(--border); color: var(--text); cursor: pointer; margin-top: 2px; flex-shrink: 0; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 20px; }
  .panel h2 { font-size: 14px; margin: 0 0 14px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.03em; }
  label { display: block; font-size: 13px; color: var(--text-dim); margin: 14px 0 6px; }
  label:first-child { margin-top: 0; }
  select, input, textarea { width: 100%; background: var(--field); border: 1px solid var(--border); color: var(--text);
                  border-radius: 6px; padding: 10px 12px; font-size: 13.5px; font-family: inherit; }
  textarea { font-family: monospace; font-size: 11.5px; min-height: 90px; resize: vertical; word-break: break-all; }
  button { width: 100%; background: var(--accent); color: white; border: none; border-radius: 6px;
           padding: 12px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 12px; }
  button:disabled { background: var(--disabled); cursor: not-allowed; }
  button.danger { background: var(--err); }
  button.secondary { background: var(--chip); }
  .status-box { background: var(--field); border: 1px solid var(--border); border-radius: 6px; padding: 12px;
                font-family: monospace; font-size: 12.5px; margin-top: 12px; word-break: break-all; }
  .status-box .empty { color: var(--text-dim); }
  .line-ok { color: var(--ok); } .line-warn { color: var(--warn); } .line-err { color: var(--err); } .line-dim { color: var(--text-dim); }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-family: monospace; }
  .badge.ok { background: rgba(63,191,111,0.15); color: var(--ok); }
  .badge.err { background: rgba(224,90,90,0.15); color: var(--err); }
  .badge.warn { background: rgba(224,168,60,0.15); color: var(--warn); }
  .ctrl-card { background: var(--field); border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; margin-top: 8px; }
  .ctrl-card .addr { font-family: monospace; font-size: 12.5px; }
  .ctrl-card .flags { font-size: 11px; color: var(--text-dim); margin-top: 4px; }
  .divider { color: var(--text-dim); font-size: 12px; text-align: center; margin: 16px 0 6px; }
  .note { font-size: 12px; color: var(--text-dim); margin-bottom: 10px; line-height: 1.5; }
  .note b { color: var(--text); }
  .check-row { display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; color: var(--text); margin-top: 12px; }
  .check-row input { width: auto; margin-top: 2px; }
  .check-row[hidden] { display: none; }
  #log { font-family: monospace; font-size: 12.5px; white-space: pre-wrap; word-break: break-all; line-height: 1.6; margin-top: 10px; }
  /* While a backup action runs: a fixed box that says what is happening, so the wait before the wallet opens is never silent. */
  #busyToast { display: none; position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 50;
               width: calc(100% - 32px); max-width: 720px; background: var(--raised); border: 2px solid var(--warn); border-radius: 10px;
               padding: 12px 16px; font-size: 14px; line-height: 1.5; color: var(--text); box-shadow: 0 6px 24px rgba(0,0,0,0.5); }
  #busyToast.on { display: flex; gap: 12px; align-items: center; }
  #busyToast .spin { width: 18px; height: 18px; flex: 0 0 18px; border: 3px solid var(--warn); border-top-color: transparent; border-radius: 50%; animation: spin 0.9s linear infinite; }
  #busyToast .msg { word-break: break-word; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { #busyToast .spin { animation: none; } }
  .ctrl-row { display: grid; grid-template-columns: 1fr; gap: 6px; background: var(--field); border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; margin-top: 8px; }
  .ctrl-row .two { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .ctrl-row button { margin-top: 0; padding: 8px; font-size: 12.5px; }
  @media (max-width: 560px) { .ctrl-row .two { grid-template-columns: 1fr; } }
  .img-prev { display: flex; gap: 12px; align-items: center; margin-top: 8px; font-size: 12px; color: var(--text-dim); }
  .img-prev img { max-width: 96px; max-height: 96px; border-radius: 8px; border: 1px solid var(--border); }
  .row-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .row-btns button { margin-top: 12px; }
  .result a { color: var(--accent); }
  .mono { font-family: monospace; font-size: 12.5px; word-break: break-all; }
</style>
</head>
<body>

<div class="brand-row">
  <img src="banner.png" alt="ChainIntegrate" class="brand-logo">
</div>

<div class="header-row">
  <div>
    <h1 data-i18n="h1">Crea una Universal Profile</h1>
    <div class="subtitle" data-i18n="subtitle"></div>
  </div>
  <button id="langToggle" type="button">English</button>
</div>

<div class="panel">
  <h2 data-i18n="panel0Title">0 · Cosa fa questa pagina</h2>
  <div class="note" data-i18n-html="introNote"></div>
</div>

<div class="panel">
  <h2 data-i18n="panel1Title">1 · Rete</h2>
  <select id="network"></select>
  <div class="row-btns">
    <button id="saveDraft" class="secondary" type="button" data-i18n="saveDraftBtn">Salva la richiesta (file)</button>
    <button id="loadDraft" class="secondary" type="button" data-i18n="loadDraftBtn">Carica una richiesta</button>
  </div>
  <input type="file" id="draftFile" accept="application/json,.json" hidden>
  <div class="note" style="margin-top:10px;" data-i18n-html="draftNote"></div>
</div>

<div class="panel">
  <h2 data-i18n="panel2Title">2 · Il profilo</h2>
  <label for="pName" data-i18n="nameLabel">Nome (persona o società)</label>
  <input type="text" id="pName" maxlength="64" autocomplete="off">
  <label for="pDesc" data-i18n="descLabel">Descrizione</label>
  <textarea id="pDesc" maxlength="1000" style="font-family:inherit; font-size:13.5px; word-break:normal;"></textarea>
  <label for="pTags" data-i18n="tagsLabel">Tag, separati da virgole</label>
  <input type="text" id="pTags" maxlength="200" autocomplete="off" data-i18n-placeholder="tagsPh">
  <label for="pLinks" data-i18n="linksLabel">Link, uno per riga: titolo | indirizzo</label>
  <textarea id="pLinks" style="font-family:inherit; font-size:13.5px; min-height:70px; word-break:normal;" data-i18n-placeholder="linksPh"></textarea>
  <label for="pAvatar" data-i18n="avatarLabel">Immagine del profilo (facoltativa)</label>
  <input type="file" id="pAvatar" accept="image/*">
  <div class="img-prev" id="avatarPrev"></div>
  <label for="pCover" data-i18n="coverLabel">Immagine di copertina (facoltativa)</label>
  <input type="file" id="pCover" accept="image/*">
  <div class="img-prev" id="coverPrev"></div>
</div>

<div class="panel">
  <h2 data-i18n="panel3Title">3 · Le chiavi del cliente</h2>
  <div class="note" data-i18n-html="ctrlNote"></div>
  <div id="ctrlRows"></div>
  <button id="addCtrl" class="secondary" type="button" data-i18n="addCtrlBtn">+ Aggiungi una chiave</button>
  <div class="status-box" id="ctrlStatus" style="margin-top:12px;"></div>
</div>

<div class="panel">
  <h2 data-i18n="panel4Title">4 · Dove salvare i dati del profilo</h2>
  <label class="check-row"><input type="radio" name="store" value="ipfs" id="storeIpfs"> <span data-i18n-html="storeIpfs"></span></label>
  <div id="ipfsBox" style="margin-left:24px;">
    <label for="pinataJwt" data-i18n="jwtLabel">JWT di Pinata (dell'operatore)</label>
    <input type="password" id="pinataJwt" autocomplete="off" placeholder="eyJ...">
    <label class="check-row"><input type="checkbox" id="rememberJwt"> <span data-i18n="rememberJwt"></span></label>
  </div>
  <label class="check-row"><input type="radio" name="store" value="chain" id="storeChain" checked> <span data-i18n-html="storeChain"></span></label>
</div>

<div class="panel">
  <h2 data-i18n="panel5Title">5 · Crea la UP</h2>
  <div class="note" data-i18n-html="deployNote"></div>
  <button id="connectBtn" class="secondary" type="button" data-i18n="connectBtn">Collega il wallet dell'operatore</button>
  <div id="walletPick"></div>
  <div class="status-box" id="walletStatus"><span class="empty" data-i18n="notConnected">Non collegato.</span></div>
  <button id="previewBtn" class="secondary" type="button" data-i18n="previewBtn">Prepara e controlla</button>
  <div class="status-box" id="previewStatus"><span class="empty" data-i18n="notPrepared">Non ancora preparata.</span></div>
  <label class="check-row"><input type="checkbox" id="ackCreate"> <span data-i18n="ackCreate"></span></label>
  <button id="createBtn" type="button" disabled data-i18n="createBtn">Crea la Universal Profile</button>
  <div class="status-box result" id="resultBox" hidden></div>
  <div id="fundBox" hidden>
    <div class="divider" data-i18n="fundDivider">— poi, qualche LYX alle chiavi del cliente —</div>
    <div class="note" data-i18n-html="fundNote"></div>
    <label for="fundAmount" data-i18n="fundLabel">LYX per ogni chiave</label>
    <input type="text" id="fundAmount" value="0.5" inputmode="decimal">
    <button id="fundBtn" class="secondary" type="button" data-i18n="fundBtn">Manda i LYX alle chiavi</button>
  </div>
  <div id="log"></div>
  <button id="copyLog" class="secondary" type="button" data-i18n="copyLogBtn">Copia il log</button>
</div>

<div id="busyToast" role="status" aria-live="polite"><div class="spin"></div><div class="msg" id="busyMsg"></div></div>

<div class="site-footer">
  <div class="footer-row">
    <img src="logo.png" alt="ChainIntegrate" class="footer-logo">
    <div class="footer-text" data-i18n-html="footerHtml"></div>
  </div>
</div>

<script src="up-create.js"></script>
</body>
</html>
