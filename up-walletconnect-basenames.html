<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>UP WalletConnect — Basenames demo — ChainIntegrate</title>
<link rel="icon" href="favicon.ico">
<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.4/ethers.umd.min.js" integrity="sha384-6Zl0Pc8zjSz8KvmNeXRvUQgY4ryFb+BwDvKCmLYcBME0joAaru491tQgi9B7zsMM" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="vendor/walletkit-1.6.0.min.js"></script>
<!-- Site configuration, created on the server from config.example.js (not in the repository). -->
<script src="config.js"></script>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --border: #2a2f3a;
    --text: #e6e8ec; --text-dim: #9aa1ad;
    --accent: #5b8cff; --ok: #3fbf6f; --warn: #e0a83c; --err: #e05a5a;
  }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
         max-width: 760px; margin: 0 auto; padding: 32px 20px 80px; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .subtitle { color: var(--text-dim); font-size: 13px; margin-bottom: 28px; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 20px; }
  .panel h2 { font-size: 14px; margin: 0 0 14px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.03em; }
  .note { font-size: 12.5px; color: var(--text-dim); line-height: 1.5; margin-bottom: 12px; }
  label { display: block; font-size: 13px; color: var(--text-dim); margin: 14px 0 6px; }
  label:first-child { margin-top: 0; }
  select, input { width: 100%; background: #10131a; border: 1px solid var(--border); color: var(--text);
                  border-radius: 6px; padding: 10px 12px; font-size: 14px; font-family: inherit; }
  button { width: 100%; background: var(--accent); color: white; border: none; border-radius: 6px;
           padding: 12px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 12px; }
  button:disabled { background: #3a3f4b; cursor: not-allowed; }
  button.danger { background: var(--err); }
  .status-box { background: #10131a; border: 1px solid var(--border); border-radius: 6px; padding: 12px;
                font-family: monospace; font-size: 12.5px; margin-top: 12px; }
  .status-box .empty { color: var(--text-dim); }
  #log { font-family: monospace; font-size: 12.5px; white-space: pre-wrap; word-break: break-all; line-height: 1.6; }
  .line-ok { color: var(--ok); } .line-warn { color: var(--warn); } .line-err { color: var(--err); } .line-dim { color: var(--text-dim); }
  .line-compare { color: var(--warn); font-weight: 700; border: 1px solid var(--warn); border-radius: 6px; padding: 8px 10px; margin: 6px 0; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-family: monospace; }
  .badge.ok { background: rgba(63,191,111,0.15); color: var(--ok); }
  .badge.err { background: rgba(224,90,90,0.15); color: var(--err); }
  .balance-big { font-size: 22px; font-weight: 600; margin-top: 4px; }
  .brand-row { margin-bottom: 24px; }
  .brand-logo { display: block; width: 100%; height: auto; border-radius: 10px; }
  .top-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .lang-btn { width: auto; background: #2a2f3a; padding: 6px 14px; font-size: 12px; margin-top: 0; flex-shrink: 0; }
  .site-footer { margin-top: 40px; padding: 18px 20px; background: #f5f6f8; border: 1px solid #e3e5ea; border-radius: 10px; color: #4b4f58; }
  .footer-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .footer-logo { height: 48px; width: auto; flex-shrink: 0; }
  .footer-text { font-size: 13px; line-height: 1.6; }
  .footer-li { display: inline-flex; vertical-align: middle; margin: 0 2px; }
  .site-footer a { color: #2563eb; text-decoration: none; font-weight: 600; }
  .site-footer a:hover { text-decoration: underline; }
  .kv { display: grid; grid-template-columns: 170px 1fr; gap: 6px 12px; font-size: 13px; margin-top: 10px; }
  .kv .k { color: var(--text-dim); }
  .kv .v { font-family: monospace; word-break: break-all; }
  .check-row { display: flex; align-items: center; gap: 8px; margin-top: 14px; font-size: 13.5px; }
  .check-row input { width: auto; }
  .warn-box { margin-top: 12px; padding: 12px 14px; border: 1px solid var(--warn); border-radius: 8px; background: rgba(224,168,60,0.08); font-size: 13px; line-height: 1.5; }
  button.secondary { background: #2a2f3a; }
  .kv pre { margin: 0; white-space: pre-wrap; word-break: break-all; font-size: 12px; max-height: 320px; overflow: auto; }
</style>
</head>
<body>

<div class="brand-row">
  <img src="banner.png" alt="ChainIntegrate" class="brand-logo" onerror="this.style.display='none'">
</div>

<div class="top-row">
  <div>
    <h1 data-i18n="h1">UP WalletConnect — demo Basenames</h1>
    <div class="subtitle" data-i18n="subtitle"></div>
  </div>
  <button class="lang-btn" id="langToggle" data-i18n="langToggleBtn">English</button>
</div>

<div class="panel">
  <h2 data-i18n="panel0Title">0 · Come funziona</h2>
  <div class="note" data-i18n-html="panel0Note"></div>
  <div class="warn-box" style="border-color: var(--err); background: rgba(224,90,90,0.08);" data-i18n-html="demoWarning"></div>
  <div class="check-row"><input type="checkbox" id="ackRisk"><label for="ackRisk" style="margin:0; color: var(--text);" data-i18n="ackLabel">Ho letto e accetto</label></div>
</div>

<div class="panel">
  <h2 data-i18n="panel1Title">1 · La tua UP su Base</h2>
  <button id="connectUp" class="secondary" data-i18n="connectUpBtn">Leggi l'indirizzo dall'estensione UP</button>
  <label for="upAddress" data-i18n="upAddressLabel">Indirizzo della UP</label>
  <input type="text" id="upAddress" placeholder="0x...">
  <button id="checkUpBtn" data-i18n="checkUpBtn">Controlla la UP su Base</button>
  <div class="status-box" id="upStatus"><span class="empty" data-i18n="notChecked">Non ancora controllata.</span></div>
</div>

<div class="panel">
  <h2 data-i18n="panel2Title">2 · Wallet del controller (firma)</h2>
  <div class="note" data-i18n="panel2Note"></div>
  <button id="connectSigner" data-i18n="connectSignerBtn">Connetti MetaMask (controller)</button>
  <div class="status-box" id="signerStatus"><span class="empty" data-i18n="notConnected">Non connesso.</span></div>
</div>

<div class="panel">
  <h2 data-i18n="panel3Title">3 · Collega Basenames con WalletConnect</h2>
  <div class="note" data-i18n-html="panel3Note"></div>
  <label for="wcUri" data-i18n="wcUriLabel">Link WalletConnect (wc:...)</label>
  <input type="text" id="wcUri" placeholder="wc:...">
  <button id="pairBtn" data-i18n="pairBtn">Collega</button>
  <div class="status-box" id="wcStatus"><span class="empty" data-i18n="wcIdle">Nessuna sessione.</span></div>
  <button id="disconnectBtn" class="secondary" disabled data-i18n="disconnectBtn">Disconnetti tutte le sessioni</button>
</div>

<div class="panel">
  <h2 data-i18n="panel4Title">4 · Richiesta dalla dApp</h2>
  <div class="check-row"><input type="checkbox" id="simulateOnly" checked><label for="simulateOnly" style="margin:0;" data-i18n="simulateOnlyLabel">Solo simulazione (non inviare nulla)</label></div>
  <div class="note" style="margin-top:6px;" data-i18n="simulateOnlyNote"></div>
  <div id="requestBox" class="status-box"><span class="empty" data-i18n="noRequest">Nessuna richiesta in attesa.</span></div>
  <button id="sendBtn" class="danger" disabled data-i18n="sendBtn">Firma e invia (irreversibile)</button>
  <button id="signBtn" class="danger" disabled data-i18n="signBtn">Firma il messaggio per la UP</button>
  <button id="rejectBtn" class="secondary" disabled data-i18n="rejectBtn">Rifiuta la richiesta</button>
  <div id="log" class="line-dim" style="margin-top:10px;"></div>
</div>

<div class="site-footer">
  <div class="footer-row">
    <img src="logo.png" alt="ChainIntegrate" class="footer-logo" onerror="this.style.display='none'">
    <div class="footer-text" data-i18n-html="footerHtml"></div>
  </div>
</div>

<script>

const WALLETCONNECT_PROJECT_ID = (window.CROSSCHAIN_CONFIG && window.CROSSCHAIN_CONFIG.walletConnectProjectId) || "";

      "function available(string name) view returns (bool)",

  },

}

// All data coming from the dApp, wallets or RPCs is written with textContent, never innerHTML.
function setStatus(id, text, cls) {
  const el = $(id);
  el.textContent = "";
  const span = document.createElement("span");
  if (cls) span.className = cls;
  span.textContent = text;
  el.appendChild(span);
}
function log(msg, cls) {
  const l = document.createElement("div");
  if (cls) l.className = cls;
  l.textContent = msg;
  $("log").appendChild(l);
}
// The log keeps the history of the session: each request starts with a separator.
function logSeparator() {
  const l = document.createElement("div");
  l.className = "line-dim";
  l.textContent = `—— ${new Date().toLocaleTimeString()} ——`;
  $("log").appendChild(l);
}
function renderKv(rows) {
  const box = $("requestBox");
  box.textContent = "";
  const grid = document.createElement("div");
  grid.className = "kv";
  for (const [k, v, asBlock] of rows) {
    const kd = document.createElement("div"); kd.className = "k"; kd.textContent = k;
    const vd = document.createElement("div"); vd.className = "v";
    if (asBlock) { const pre = document.createElement("pre"); pre.textContent = v; vd.appendChild(pre); }
    else vd.textContent = v;
    grid.appendChild(kd); grid.appendChild(vd);
  }
  box.appendChild(grid);
}
const rpc = new ethers.JsonRpcProvider(BASE.rpc, BASE.chainId, { staticNetwork: true, batchMaxCount: 1 });

// Upper bound of the gas price, read straight from the RPC (2 * baseFee + priority fee).
async function estimateMaxGasPrice() {
  const gasPrice = BigInt(await rpc.send("eth_gasPrice", []));
  const block = await rpc.send("eth_getBlockByNumber", ["latest", false]);
  if (!block || !block.baseFeePerGas) return gasPrice;
  const baseFee = BigInt(block.baseFeePerGas);
  const tip = gasPrice > baseFee ? gasPrice - baseFee : 0n;
  return 2n * baseFee + tip;
}

// ==================== 1. UP ====================
let upAddress = null, kmAddress = null;

$("connectUp").addEventListener("click", async () => {
  if (!window.lukso) { setStatus("upStatus", t("extNotFound"), "line-err"); return; }
  try {
    const accounts = await window.lukso.request({ method: "eth_requestAccounts" });
    $("upAddress").value = accounts[0];
    resetUp();
  } catch (e) {
    setStatus("upStatus", t("connectionRejected"), "line-err");
  }
});
function resetUp() { upAddress = null; kmAddress = null; setStatus("upStatus", t("notChecked"), "empty"); }
$("upAddress").addEventListener("input", resetUp);

$("checkUpBtn").addEventListener("click", async () => {
  resetUp();
  const raw = $("upAddress").value.trim();
  if (!ethers.isAddress(raw)) { setStatus("upStatus", t("invalidUp"), "line-err"); return; }
  const up = ethers.getAddress(raw);
  try {
    const rpcChainId = Number(await rpc.send("eth_chainId", []));
    if (rpcChainId !== BASE.chainId) { setStatus("upStatus", t("rpcWrongChain", { id: rpcChainId }), "line-err"); return; }
    if ((await rpc.getCode(up)) === "0x") { setStatus("upStatus", t("upNotDeployed"), "line-err"); return; }
    const km = ethers.getAddress(await new ethers.Contract(up, ["function owner() view returns (address)"], rpc).owner());
    if ((await rpc.getCode(km)) === "0x") { setStatus("upStatus", t("upNotKm"), "line-err"); return; }
    const bal = await rpc.getBalance(up);
    upAddress = up; kmAddress = km;
    setStatus("upStatus", t("upOk", { km, bal: ethers.formatEther(bal) }), "line-ok");
  } catch (e) {
    setStatus("upStatus", t("genericError", { err: e.shortMessage || e.message }), "line-err");
  }
});

let signerProvider = null, signerAddress = null;
const discoveredProviders = [];
window.addEventListener("eip6963:announceProvider", (e) => discoveredProviders.push(e.detail));

$("connectSigner").addEventListener("click", async () => {
  let candidate = discoveredProviders.find(p => !/lukso|universal profile/i.test(p.info.name))?.provider;
  if (!candidate && window.ethereum && window.ethereum !== window.lukso) candidate = window.ethereum;
  if (!candidate) { setStatus("signerStatus", t("noSignerFound"), "line-err"); return; }
  try {
    const accounts = await candidate.request({ method: "eth_requestAccounts" });
    signerAddress = accounts[0];
    signerProvider = candidate;
    let chainLabel = "";
    try { chainLabel = ` · chainId ${parseInt(await candidate.request({ method: "eth_chainId" }), 16)}`; } catch (e) { /* shown without chain */ }
    setStatus("signerStatus", signerAddress + chainLabel, "line-ok");
  } catch (e) {
    setStatus("signerStatus", t("connectionRejected"), "line-err");
  }
});

async function walletOnBase() {
  try {
    const id = parseInt(await signerProvider.request({ method: "eth_chainId" }), 16);
    return id === BASE.chainId ? { ok: true } : { ok: false, msg: t("walletWrongChain", { id }) };
  } catch (e) {
    return { ok: false, msg: t("walletChainUnknown") };
  }
}

let walletKit = null;
let pending = null; // { kind: "tx" | "sign", topic, id, ... }

async function getWalletKit() {
  if (walletKit) return walletKit;
  if (!WALLETCONNECT_PROJECT_ID) throw new Error(t("noProjectId"));
  const { Core, WalletKit } = window.WalletKitBundle;
  const core = new Core({ projectId: WALLETCONNECT_PROJECT_ID });
  walletKit = await WalletKit.init({
    core,
    metadata: {
      name: "ChainIntegrate UP bridge (demo)",
      description: "Universal Profile bridge for Basenames on Base",
      url: location.origin,
      icons: [location.origin + "/favicon.ico"],
    },
  });
  walletKit.on("session_proposal", onSessionProposal);
  walletKit.on("session_request", onSessionRequest);
  walletKit.on("session_delete", () => { showSessions(); log(t("sessionClosed"), "line-dim"); });
  showSessions();
  return walletKit;
}

function showSessions() {
  const sessions = walletKit ? Object.values(walletKit.getActiveSessions()) : [];
  $("disconnectBtn").disabled = sessions.length === 0;
  if (!sessions.length) { setStatus("wcStatus", t("wcIdle"), "empty"); return; }
  const s = sessions[sessions.length - 1];
  const acc = (s.namespaces.eip155?.accounts?.[0] || "").split(":").pop();
  setStatus("wcStatus", t("sessionActive", { name: s.peer.metadata.name, url: s.peer.metadata.url, acc }), "line-ok");
}

// Nothing connects or sends until the disclaimer has been accepted.
const riskAccepted = () => $("ackRisk").checked;

$("pairBtn").addEventListener("click", async () => {
  const uri = $("wcUri").value.trim();
  if (!riskAccepted()) { setStatus("wcStatus", t("ackRequired"), "line-err"); return; }
  if (!upAddress) { setStatus("wcStatus", t("checkUpFirst"), "line-err"); return; }
  if (!uri.startsWith("wc:")) { setStatus("wcStatus", t("invalidUri"), "line-err"); return; }
  try {
    const kit = await getWalletKit();
    setStatus("wcStatus", t("pairing"), "empty");
    await kit.pair({ uri });
    $("wcUri").value = "";
  } catch (e) {
    setStatus("wcStatus", t("genericError", { err: e.message }), "line-err");
  }
});

$("disconnectBtn").addEventListener("click", async () => {
  if (!walletKit) return;
  const { getSdkError } = window.WalletKitBundle;
  for (const s of Object.values(walletKit.getActiveSessions())) {
    try { await walletKit.disconnectSession({ topic: s.topic, reason: getSdkError("USER_DISCONNECTED") }); } catch (e) { /* already gone */ }
  }
  showSessions();
});

async function onSessionProposal({ id, params, verifyContext }) {
  const { buildApprovedNamespaces, getSdkError } = window.WalletKitBundle;
  const meta = params.proposer.metadata || {};
  const verify = verifyContext?.verified?.validation || "UNKNOWN";
  log(t("proposalFrom", { name: meta.name, url: meta.url, verify }), "line-dim");
  if (!/^https:\/\/(www\.)?base\.org(\/|$)/.test(meta.url || "")) log(t("proposalNotBase"), "line-warn");
  if (!upAddress || !riskAccepted()) {
    await walletKit.rejectSession({ id, reason: getSdkError("USER_REJECTED") });
    setStatus("wcStatus", t("checkUpFirst"), "line-err");
    return;
  }
  try {
    // The UP address is the account presented to the dApp, on Base only.
    const namespaces = buildApprovedNamespaces({
      proposal: params,
      supportedNamespaces: {
        eip155: {
          chains: [CAIP_CHAIN],
          methods: ["eth_sendTransaction", "personal_sign", "eth_signTypedData_v4", "eth_signTypedData", "eth_sign", "wallet_switchEthereumChain"],
          events: ["accountsChanged", "chainChanged"],
          accounts: [`${CAIP_CHAIN}:${upAddress}`],
        },
      },
    });
    await walletKit.approveSession({ id, namespaces });
    showSessions();
  } catch (e) {
    log(t("proposalRejectedChains", { err: e.message }), "line-err");
    try { await walletKit.rejectSession({ id, reason: getSdkError("UNSUPPORTED_CHAINS") }); } catch (e2) { /* ignore */ }
  }
}

}
async function respondError(topic, id, message, code = 5000) {
  await walletKit.respondSessionRequest({ topic, response: { id, jsonrpc: "2.0", error: { code, message } } });
}
function clearPending(msg) {
  pending = null;
  $("sendBtn").disabled = true;
  $("signBtn").disabled = true;
  $("rejectBtn").disabled = true;
  if (msg) setStatus("requestBox", msg, "empty");
}

async function onSessionRequest(event) {
  const { topic, id, params, verifyContext } = event;
  const { request, chainId } = params;
  logSeparator();
  log(t("reqMethod", { method: request.method }), "line-dim");

  // eth_sign signs a raw hash (it can authorise anything, even a transaction); eth_signTypedData
  // (v1/v3) are legacy formats. They are never signed.
  if (["eth_sign", "eth_signTypedData", "eth_signTypedData_v3"].includes(request.method)) {
    log(t("signLegacyRejected", { method: request.method }), "line-err");
    return respondError(topic, id, `Rejected: ${request.method} is never signed by this bridge`, 5000);
  }
  if (request.method === "personal_sign" || request.method === "eth_signTypedData_v4") {
    if (pending) {
      log(t("reqBusy"), "line-warn");
      return respondError(topic, id, "Another request is pending", 5000);
    }
    return handleSignRequest(topic, id, chainId, request, verifyContext);
  }
  if (request.method === "wallet_switchEthereumChain") {
    const wanted = parseInt(request.params?.[0]?.chainId, 16);
    return wanted === BASE.chainId ? respondResult(topic, id, null) : respondError(topic, id, "Only Base is supported", 4902);
  }
  if (request.method !== "eth_sendTransaction") {
    log(t("reqUnsupported", { method: request.method }), "line-warn");
    return respondError(topic, id, `Unsupported method: ${request.method}`, 4200);
  }
  if (pending) {
    log(t("reqBusy"), "line-warn");
    return respondError(topic, id, "Another request is pending", 5000);
  }
  await handleSendTransaction(topic, id, chainId, request.params?.[0] || {});
}

async function handleSendTransaction(topic, id, chainId, tx) {
  const reject = async (msg) => { log(msg, "line-err"); await respondError(topic, id, "Rejected by the UP bridge", 5000); };

  if (!riskAccepted()) return reject(t("ackRequired"));
  if (chainId !== CAIP_CHAIN) return reject(t("reqWrongChain", { chain: chainId }));
  if (!upAddress || !kmAddress) return reject(t("checkUpFirst"));
  if (!tx.from || tx.from.toLowerCase() !== upAddress.toLowerCase()) return reject(t("reqWrongFrom", { from: tx.from }));
  const to = (tx.to || "").toLowerCase();
  const target = BASENAMES_TARGETS[to];
  if (!target) return reject(t("reqWrongTarget", { to: tx.to }));

  const iface = new ethers.Interface(target.abi);
  let decoded;
  try {
    decoded = iface.parseTransaction({ data: tx.data || "0x", value: tx.value || 0 });
  } catch (e) { decoded = null; }
  if (!decoded || decoded.name !== "register") return reject(t("reqWrongMethod"));

  const req = decoded.args[0];
  if (req.owner.toLowerCase() !== upAddress.toLowerCase()) return reject(t("reqWrongOwner", { owner: req.owner }));

  let value;
  try { value = BigInt(tx.value || 0); } catch (e) { value = -1n; }
  if (value < 0n) return reject(t("invalidValue"));
  const controller = new ethers.Contract(tx.to, iface, rpc);
  try {
    const [price, available, upBal] = await Promise.all([
      controller.registerPrice(req.name, req.duration),
      controller.available(req.name),
      rpc.getBalance(upAddress),
    ]);
    renderKv([
      [t("kName"), `${req.name}.base.eth`],
      [t("kOwner"), req.owner],
      [t("kDuration"), `${(Number(req.duration) / 86400).toFixed(0)} ${t("days")}`],
      [t("kValue"), `${ethers.formatEther(value)} ETH`],
      [t("kPrice"), `${ethers.formatEther(price)} ETH`],
      [t("kPrimary"), req.reverseRecord ? t("yes") : t("no")],
      [t("kTarget"), `${target.label} ${ethers.getAddress(tx.to)}`],
      [t("kKm"), kmAddress],
      [t("kSigner"), signerAddress || "—"],
    ]);
    if (!available) return reject(t("notAvailable"));
    if (value < price) return reject(t("valueBelowPrice"));
    if (upBal < value) return reject(t("upNoFunds", { need: ethers.formatEther(value), have: ethers.formatEther(upBal) }));

    if (!signerAddress) return reject(t("connectSignerFirst"));
    const chains = await walletOnBase();
    if (!chains.ok) return reject(chains.msg);
    log(t("chainsOk"), "line-ok");

    // Wrap: the controller calls KeyManager.execute(UP.execute(CALL, controller, value, data)),
    // so Basenames sees msg.sender = UP and the payment comes from the UP's balance.
    const upIface = new ethers.Interface(["function execute(uint256 operationType, address target, uint256 value, bytes data) payable returns (bytes)"]);
    const kmIface = new ethers.Interface(["function execute(bytes payload) payable returns (bytes)"]);
    const inner = upIface.encodeFunctionData("execute", [0, ethers.getAddress(tx.to), value, tx.data]);
    const wrapped = kmIface.encodeFunctionData("execute", [inner]);

    log(t("simulating"), "line-dim");
    let gas;
    try {
      await rpc.call({ from: signerAddress, to: kmAddress, data: wrapped });
      gas = await rpc.estimateGas({ from: signerAddress, to: kmAddress, data: wrapped });
    } catch (e) {
      return reject(t("simFail", { err: e.shortMessage || e.reason || e.message }));
    }
    log(t("simOk", { gas: gas.toString() }), "line-ok");

    const gasLimit = gas + gas / 4n;
    const need = gasLimit * (await estimateMaxGasPrice());
    const signerBal = await rpc.getBalance(signerAddress);
    if (signerBal < need) return reject(t("signerNoGas", { need: ethers.formatEther(need), have: ethers.formatEther(signerBal) }));

    if ($("simulateOnly").checked) {
      log(t("simOnlyDone"), "line-warn");
      await respondError(topic, id, "Simulation only: transaction not sent", 5000);
      return;
    }

    pending = { kind: "tx", topic, id, wrapped, gasLimit, name: req.name, signer: signerAddress };
    $("sendBtn").disabled = false;
    $("rejectBtn").disabled = false;
    log(t("readyToSend"), "line-warn");
  } catch (e) {
    return reject(t("genericError", { err: e.shortMessage || e.message }));
  }
}

// ==================== 4b. Message signatures (ERC-1271) ====================
// The controller signs; the UP validates the signature through its Key Manager
// (LSP6 isValidSignature: the recovered signer must have the SIGN permission).
const ERC1271_MAGIC = "0x1626ba7e";
const PERMIT2 = "0x000000000022d473030f116ddee9f6b43ac78ba3";
const PERM_PREFIX = "0x4b80742de2bf82acb3630000"; // LSP6 AddressPermissions:Permissions:<address>
const PERMISSION_SIGN = 1n << 21n;

function sessionPeer(topic) {
  const s = walletKit?.getActiveSessions?.()[topic];
  return s ? `${s.peer.metadata.name} (${s.peer.metadata.url})` : "—";
}

// Returns the message as readable text, or null when it is a hash or binary data.
function readableText(bytes) {
  if (!bytes.length) return null;
  let text;
  try { text = new TextDecoder("utf-8", { fatal: true }).decode(bytes); } catch (e) { return null; }
  return /^[\P{C}\n\r\t]*$/u.test(text) ? text : null;
}

async function handleSignRequest(topic, id, chainId, request, verifyContext) {
  const reject = async (msg) => { log(msg, "line-err"); await respondError(topic, id, "Rejected by the UP bridge", 5000); };

  if (!riskAccepted()) return reject(t("ackRequired"));
  if (chainId !== CAIP_CHAIN) return reject(t("reqWrongChain", { chain: chainId }));
  if (!upAddress || !kmAddress) return reject(t("checkUpFirst"));

  // Step 1: domain verification by WalletConnect/Reown.
  const verified = verifyContext?.verified || {};
  const validation = verified.validation || "UNKNOWN";
  if (verified.isScam || validation === "INVALID") return reject(t("verifyBad", { v: verified.isScam ? "SCAM" : validation }));
  if (validation === "VALID") log(t("verifyOk"), "line-ok"); else log(t("verifyWarn", { v: validation }), "line-warn");

  // Step 2: decode what the site wants signed and compute the hash the UP will check.
  const p = request.params || [];
  const up = upAddress.toLowerCase();
  let account, hash, rows = [], warnings = [], walletParams, compare;
  try {
    if (request.method === "personal_sign") {
      // Standard order is [message, address]; some dApps swap it.
      const [a, b] = p;
      const swapped = typeof a === "string" && a.toLowerCase() === up && !(typeof b === "string" && b.toLowerCase() === up);
      const message = swapped ? b : a;
      account = swapped ? a : b;
      if (typeof message !== "string") throw new Error("missing message");
      const bytes = ethers.isHexString(message) ? ethers.getBytes(message) : ethers.toUtf8Bytes(message);
      const text = readableText(bytes);
      hash = ethers.hashMessage(bytes);
      walletParams = [ethers.hexlify(bytes), null];
      rows.push([t("kContentType"), text !== null ? t("ctText") : t("ctOpaque")]);
      compare = text !== null ? text : ethers.hexlify(bytes);
      rows.push([t("kContent"), compare, true]);
      if (text === null) warnings.push(t("signOpaque"));
    } else {
      account = p[0];
      const raw = p[1];
      const data = typeof raw === "string" ? JSON.parse(raw) : raw;
      if (!data || typeof data !== "object" || !data.types || !data.message) throw new Error("missing types or message");
      const domain = data.domain || {};
      if (domain.chainId !== undefined && domain.chainId !== null && Number(domain.chainId) !== BASE.chainId) {
        return reject(t("signWrongDomainChain", { id: String(domain.chainId) }));
      }
      // Without a chainId the signature is not bound to a network: it may be valid wherever the UP exists.
      if (domain.chainId === undefined || domain.chainId === null) warnings.push(t("signNoChain"));
      const types = { ...data.types };
      delete types.EIP712Domain;
      hash = ethers.TypedDataEncoder.hash(domain, types, data.message);
      walletParams = [null, typeof raw === "string" ? raw : JSON.stringify(raw)];
      rows.push([t("kContentType"), t("ctTyped")]);
      rows.push([t("kDomain"), JSON.stringify(domain, null, 2), true]);
      rows.push([t("kPrimaryType"), String(data.primaryType || "—")]);
      rows.push([t("kContent"), JSON.stringify(data.message, null, 2), true]);
      compare = `${data.primaryType || "?"} · ${domain.name || "?"} · verifyingContract ${domain.verifyingContract || "—"} · chainId ${domain.chainId ?? "—"}`;
      const vc = String(domain.verifyingContract || "").toLowerCase();
      if (/permit/i.test(String(data.primaryType || "")) || vc === PERMIT2 || /permit2/i.test(String(domain.name || ""))) warnings.push(t("signPermit"));
    }
  } catch (e) {
    return reject(t("signBadData", { err: e.shortMessage || e.message }));
  }
  if (typeof account !== "string" || account.toLowerCase() !== up) return reject(t("signWrongAccount", { acc: String(account) }));

  renderKv([
    [t("kMethod"), request.method],
    [t("kSite"), sessionPeer(topic)],
    [t("kVerify"), validation],
    [t("kAccount"), upAddress],
    [t("kSigner"), signerAddress || "—"],
    [t("kKm"), kmAddress],
    ...rows,
    [t("kHash"), hash],
  ]);
  for (const w of warnings) log(w, "line-warn");
  log(t("signReplay"), "line-dim");

  // Step 3: the controller must be connected, on Base, and hold the SIGN permission on the UP.
  if (!signerAddress) return reject(t("connectSignerFirst"));
  const chains = await walletOnBase();
  if (!chains.ok) return reject(chains.msg);
  log(t("chainsOk"), "line-ok");
  try {
    const key = PERM_PREFIX + signerAddress.slice(2).toLowerCase();
    const raw = await new ethers.Contract(upAddress, ["function getData(bytes32) view returns (bytes)"], rpc).getData(key);
    const perms = raw && raw !== "0x" ? BigInt(raw) : 0n;
    const permsHex = "0x" + perms.toString(16).padStart(6, "0");
    if (perms === 0n) return reject(t("signNotController", { signer: signerAddress, up: upAddress }));
    if ((perms & PERMISSION_SIGN) === 0n) return reject(t("signNoPermission", { perms: permsHex }));
    log(t("signPermOk", { perms: permsHex }), "line-ok");
  } catch (e) {
    return reject(t("genericError", { err: e.shortMessage || e.message }));
  }

  pending = { kind: "sign", topic, id, method: request.method, walletParams, hash, signer: signerAddress };
  $("signBtn").disabled = false;
  $("rejectBtn").disabled = false;
  log(t("signCompare", { c: compare }), "line-compare");
  log(t("signReady"), "line-warn");
}

$("signBtn").addEventListener("click", async () => {
  if (!pending || pending.kind !== "sign") return;
  if (!riskAccepted()) { log(t("ackRequired"), "line-err"); return; }
  const p = pending;
  $("signBtn").disabled = true;
  $("rejectBtn").disabled = true;
  const fail = async (msg, reason) => { log(msg, "line-err"); try { await respondError(p.topic, p.id, reason, 5000); } catch (e) { /* ignore */ } clearPending(); };
  try {
    const chains = await walletOnBase();
    if (!chains.ok) return fail(chains.msg, "Wrong network");
    const accounts = await signerProvider.request({ method: "eth_accounts" });
    if (!accounts?.[0] || accounts[0].toLowerCase() !== p.signer.toLowerCase()) return fail(t("signerChanged"), "Signer changed");

    // Step 4: the controller signs in MetaMask the same content shown above.
    log(t("signing"), "line-dim");
    const signature = p.method === "personal_sign"
      ? await signerProvider.request({ method: "personal_sign", params: [p.walletParams[0], p.signer] })
      : await signerProvider.request({ method: "eth_signTypedData_v4", params: [p.signer, p.walletParams[1]] });

    // Step 5: the signature must come from the controller...
    const recovered = ethers.recoverAddress(p.hash, signature);
    log(t("signRecovered", { addr: recovered }), "line-dim");
    if (recovered.toLowerCase() !== p.signer.toLowerCase()) return fail(t("signWrongSigner"), "Signature check failed");

    // ...and the UP on Base must accept it (ERC-1271), otherwise it is useless to the site.
    log(t("signCheckingUp"), "line-dim");
    let answer;
    try {
      answer = await new ethers.Contract(upAddress, ["function isValidSignature(bytes32,bytes) view returns (bytes4)"], rpc).isValidSignature(p.hash, signature);
    } catch (e) {
      answer = "revert";
    }
    if (String(answer).toLowerCase() !== ERC1271_MAGIC) return fail(t("signInvalid", { r: String(answer) }), "Signature not accepted by the UP");

    await respondResult(p.topic, p.id, signature);
    log(t("signValid"), "line-ok");
    clearPending();
  } catch (e) {
    await fail(t("genericError", { err: e.shortMessage || e.message }), "Signing failed");
  }
});

$("rejectBtn").addEventListener("click", async () => {
  if (!pending) return;
  const { topic, id } = pending;
  clearPending(t("noRequest"));
  log(t("rejectedByUser"), "line-dim");
  await respondError(topic, id, "User rejected", 5000);
});

$("sendBtn").addEventListener("click", async () => {
  if (!pending || pending.kind !== "tx") return;
  if (!riskAccepted()) { log(t("ackRequired"), "line-err"); return; }
  const p = pending;
  $("sendBtn").disabled = true;
  $("rejectBtn").disabled = true;
  try {
    const chains = await walletOnBase();
    if (!chains.ok) { log(chains.msg, "line-err"); await respondError(p.topic, p.id, "Wrong network", 5000); return clearPending(); }
    const signer = await new ethers.BrowserProvider(signerProvider).getSigner();
    if (signer.address.toLowerCase() !== p.signer.toLowerCase()) {
      log(t("signerChanged"), "line-err");
      await respondError(p.topic, p.id, "Signer changed", 5000);
      return clearPending();
    }
    log(t("sending"), "line-dim");
    const sent = await signer.sendTransaction({ to: kmAddress, data: p.wrapped, gasLimit: p.gasLimit });
    log(t("txSent", { hash: sent.hash }), "line-dim");
    log(BASE.explorer + "tx/" + sent.hash, "line-dim");
    // From here the transaction exists on-chain: never report it as failed or ask to repeat it.
    clearPending();
    // The dApp tracks the transaction by its hash; the transaction is the wrapped one.
    try { await respondResult(p.topic, p.id, sent.hash); }
    catch (e) { log(t("txNotDelivered", { err: e.message || String(e) }), "line-err"); }

    log(t("waiting"), "line-dim");
    const receipt = await sent.wait();
    if (!receipt || receipt.status !== 1) { log(t("txFailed"), "line-err"); return; }
    const tokenId = BigInt(ethers.id(p.name));
    const owner = await new ethers.Contract(BASE_REGISTRAR, ["function ownerOf(uint256) view returns (address)"], rpc).ownerOf(tokenId);
    if (owner.toLowerCase() === upAddress.toLowerCase()) log(t("ownerOk", { name: p.name, up: upAddress }), "line-ok");
    else log(t("ownerMismatch", { owner }), "line-warn");
  } catch (e) {
    log(t("genericError", { err: e.shortMessage || e.message }), "line-err");
    if (pending) { try { await respondError(p.topic, p.id, "Send failed", 5000); } catch (e2) { /* ignore */ } clearPending(); }
  }
});

applyI18n();
</script>
