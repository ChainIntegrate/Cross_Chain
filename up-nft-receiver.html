<style>

  }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
         max-width: 760px; margin: 0 auto; padding: 32px 20px 80px; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .subtitle { color: var(--text-dim); font-size: 13px; margin-bottom: 28px; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 20px; }
  .panel h2 { font-size: 14px; margin: 0 0 14px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.03em; }
  .note { font-size: 12.5px; color: var(--text-dim); line-height: 1.5; margin-bottom: 12px; }
  label { display: block; font-size: 13px; color: var(--text-dim); margin: 14px 0 6px; }
  select, input { width: 100%; background: #10131a; border: 1px solid var(--border); color: var(--text);
                  border-radius: 6px; padding: 10px 12px; font-size: 14px; font-family: inherit; }
  button { width: 100%; background: var(--accent); color: white; border: none; border-radius: 6px;
           padding: 12px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 12px; }
  button:disabled { background: #3a3f4b; cursor: not-allowed; }
  button.danger { background: var(--err); }
  button.secondary { background: #2a2f3a; }
  .status-box { background: #10131a; border: 1px solid var(--border); border-radius: 6px; padding: 12px;
                font-family: monospace; font-size: 12.5px; margin-top: 12px; }
  .status-box .empty { color: var(--text-dim); }
  #log { font-family: monospace; font-size: 12.5px; white-space: pre-wrap; word-break: break-all; line-height: 1.6; }
  .line-ok { color: var(--ok); } .line-warn { color: var(--warn); } .line-err { color: var(--err); } .line-dim { color: var(--text-dim); }
  .line-compare { color: var(--warn); font-weight: 700; border: 1px solid var(--warn); border-radius: 6px; padding: 8px 10px; margin: 6px 0; }
  .brand-row { margin-bottom: 24px; }
  .brand-logo { display: block; width: 100%; height: auto; border-radius: 10px; }
  .top-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .lang-btn { width: auto; background: #2a2f3a; padding: 6px 14px; font-size: 12px; margin-top: 0; flex-shrink: 0; }
  .site-footer { margin-top: 40px; padding: 18px 20px; background: #f5f6f8; border: 1px solid #e3e5ea; border-radius: 10px; color: #4b4f58; }
  .footer-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .footer-logo { height: 48px; width: auto; flex-shrink: 0; }
  .footer-text { font-size: 13px; line-height: 1.6; }
  .footer-li { display: inline-flex; vertical-align: middle; margin: 0 2px; }
  .site-footer a { color: #2563eb; text-decoration: none; font-weight: 600; }
  .kv { display: grid; grid-template-columns: 210px 1fr; gap: 6px 12px; font-size: 13px; margin-top: 10px; }
  .kv .k { color: var(--text-dim); }
  .kv .v { font-family: monospace; word-break: break-all; }
  .kv .v.ok { color: var(--ok); } .kv .v.warn { color: var(--warn); } .kv .v.err { color: var(--err); }

  .check-row { display: flex; align-items: center; gap: 8px; margin-top: 14px; font-size: 13.5px; }
  .check-row input { width: auto; }
  .warn-box { margin-top: 12px; padding: 12px 14px; border: 1px solid var(--err); border-radius: 8px; background: rgba(224,90,90,0.08); font-size: 13px; line-height: 1.5; }

</head>

<div class="brand-row">

</div>

<div class="top-row">

<div class="panel">

  <div class="note" data-i18n-html="panel0Note"></div>

</div>

<div class="panel">

  <select id="network" style="margin-top:8px;"></select>

    <label data-i18n="customRpcLabel">RPC URL custom</label>
    <input type="text" id="customRpc" placeholder="https://...">
    <label data-i18n="customExplorerLabel">Explorer URL custom (opzionale)</label>
    <input type="text" id="customExplorer" placeholder="https://.../tx/">
  </div>
</div>

<div class="panel">
  <h2 data-i18n="panel2Title">2 · La tua UP</h2>
  <button id="connectUp" class="secondary" data-i18n="connectUpBtn">Leggi l'indirizzo dall'estensione UP</button>
  <label for="upAddress" data-i18n="upAddressLabel">Indirizzo della UP</label>
  <input type="text" id="upAddress" placeholder="0x...">
</div>

<div class="panel">
  <h2 data-i18n="panel3Title">3 · Controller (MetaMask) e verifica</h2>
  <div class="note" data-i18n="panel3Note"></div>
  <button id="connectSigner" data-i18n="connectSignerBtn">Connetti MetaMask (controller)</button>
  <div class="status-box" id="checkBox"><span class="empty" data-i18n="checkIdle">La verifica parte da sola quando rete, UP e MetaMask sono impostati.</span></div>
  <button id="recheckBtn" class="secondary" data-i18n="recheckBtn">Ricontrolla</button>
</div>

<div class="panel">
  <h2 data-i18n="panel4Title">4 · Azioni</h2>
  <div class="note" data-i18n-html="panel4Note"></div>
  <button id="publishBtn" disabled data-i18n="publishBtn">Pubblica l'estensione su questa rete</button>
  <button id="prepareBtn" disabled data-i18n="prepareBtn">Prepara e simula l'abilitazione</button>
  <div class="status-box plan" id="planBox"><span class="empty" data-i18n="noPlan">Nessuna operazione preparata.</span></div>
  <div class="check-row" id="replaceRow" style="display:none;"><input type="checkbox" id="ackReplace"><label for="ackReplace" style="margin:0; color: var(--warn);" data-i18n="ackReplaceLabel">Ho capito che sostituisco le estensioni esistenti indicate sopra</label></div>
  <button id="enableBtn" class="danger" disabled data-i18n="enableBtn">Firma e invia (una sola transazione)</button>
  <div id="log" class="line-dim" style="margin-top:10px;"></div>
</div>

<div class="site-footer">
  <div class="footer-row">
    <img src="logo.png" alt="ChainIntegrate" class="footer-logo" onerror="this.style.display='none'">
    <div class="footer-text" data-i18n-html="footerHtml"></div>

</div>

  document.documentElement.lang = LANG;
  document.title = t("pageTitle");
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.getAttribute("data-i18n")); });
  document.querySelectorAll("[data-i18n-html]").forEach(el => { el.innerHTML = t(el.getAttribute("data-i18n-html")); });
  document.querySelectorAll("[data-i18n-placeholder]").forEach(el => { el.placeholder = t(el.getAttribute("data-i18n-placeholder")); });
  if (lastCheck) renderCheck(lastCheck);
}
$("langToggle").addEventListener("click", () => { LANG = LANG === "it" ? "en" : "it"; applyI18n(); });

// ==================== HELPERS ====================
// Data from wallets and RPCs is written with textContent, never innerHTML.
function setStatus(id, text, cls) {
  const el = $(id);
  el.textContent = "";
  const span = document.createElement("span");
  if (cls) span.className = cls;
  span.textContent = text;
  el.appendChild(span);
}
function log(msg, cls) {
  const l = document.createElement("div");
  if (cls) l.className = cls;
  l.textContent = msg;
  $("log").appendChild(l);
}
function logSeparator() {
  const l = document.createElement("div");
  l.className = "line-dim";
  l.textContent = `—— ${new Date().toLocaleTimeString()} ——`;
  $("log").appendChild(l);
}
const riskAccepted = () => $("ackRisk").checked;
const tr = (v) => Array.isArray(v) ? t(v[0], v[1]) : v;

// Upper bound of the gas price, read straight from the RPC (2 * baseFee + priority fee).
async function estimateMaxGasPrice(provider) {
  const gasPrice = BigInt(await provider.send("eth_gasPrice", []));
  const block = await provider.send("eth_getBlockByNumber", ["latest", false]);
  if (!block || !block.baseFeePerGas) return gasPrice;
  const baseFee = BigInt(block.baseFeePerGas);
  const tip = gasPrice > baseFee ? gasPrice - baseFee : 0n;
  return 2n * baseFee + tip;
}
function revertReason(e) {
  const data = e?.data || e?.info?.error?.data || e?.error?.data;
  if (typeof data === "string" && data.length >= 10) {
    try { const d = KM_IFACE.parseError(data); return `${d.name}(${d.args.map(String).join(", ")})`; } catch (x) { /* not an LSP6 error */ }
  }
  return e?.shortMessage || e?.reason || e?.message || String(e);
}

// ==================== 1. Network ====================
const networkSelectEl = $("network");
function renderNetworkOptions(filter) {
  const f = (filter || "").toLowerCase();
  networkSelectEl.innerHTML = "";
  CHAINS.filter(c => c.name.toLowerCase().includes(f)).forEach(c => {
    const opt = document.createElement("option");
    opt.value = c.key;
    opt.textContent = c.chainId ? `${c.name} (chainId ${c.chainId})` : c.name;
    networkSelectEl.appendChild(opt);
  });
}
renderNetworkOptions("");
const presetNetworkKey = new URLSearchParams(location.search).get("network");
if (presetNetworkKey && CHAINS.some(c => c.key === presetNetworkKey)) networkSelectEl.value = presetNetworkKey;

function getNetwork() {
  const c = CHAINS.find(x => x.key === networkSelectEl.value);
  if (!c) return null;
  if (c.key === "custom") {
    return { key: "custom", name: t("customNetName"), chainId: null, rpc: $("customRpc").value.trim(), explorer: $("customExplorer").value.trim() || null, currency: "" };
  }
  return { ...c };
}
function onInputsChanged() {
  $("customRpcWrap").style.display = networkSelectEl.value === "custom" ? "block" : "none";
  scheduleCheck();
}
$("networkFilter").addEventListener("input", (e) => { renderNetworkOptions(e.target.value); onInputsChanged(); });
networkSelectEl.addEventListener("change", onInputsChanged);
$("customRpc").addEventListener("input", onInputsChanged);

// ==================== 2. UP ====================
$("connectUp").addEventListener("click", async () => {
  if (!window.lukso) { setStatus("checkBox", t("extNotFound"), "line-err"); return; }
  try {
    const accounts = await window.lukso.request({ method: "eth_requestAccounts" });
    $("upAddress").value = accounts[0];
    scheduleCheck();
  } catch (e) {
    setStatus("checkBox", t("connectionRejected"), "line-err");
  }
});
$("upAddress").addEventListener("input", () => scheduleCheck());

// ==================== 3. Controller + check ====================
let signerProvider = null, signerAddress = null;
const discoveredProviders = [];
window.addEventListener("eip6963:announceProvider", (e) => discoveredProviders.push(e.detail));
window.dispatchEvent(new Event("eip6963:requestProvider"));

$("connectSigner").addEventListener("click", async () => {
  let candidate = discoveredProviders.find(p => !/lukso|universal profile/i.test(p.info.name))?.provider;
  if (!candidate && window.ethereum && window.ethereum !== window.lukso) candidate = window.ethereum;
  if (!candidate) { setStatus("checkBox", t("noSignerFound"), "line-err"); return; }
  try {
    const accounts = await candidate.request({ method: "eth_requestAccounts" });
    signerAddress = accounts[0];
    if (signerProvider !== candidate && candidate.on) {
      candidate.on("accountsChanged", (acc) => { signerAddress = acc?.[0] || null; scheduleCheck(0); });
      candidate.on("chainChanged", () => scheduleCheck(0));
    }
    signerProvider = candidate;
    scheduleCheck(0);
  } catch (e) {
    setStatus("checkBox", t("connectionRejected"), "line-err");
  }
});
$("recheckBtn").addEventListener("click", () => scheduleCheck(0));
$("ackRisk").addEventListener("change", updateButtons);

let check = null, lastCheck = null, checkRun = 0, checkTimer = null, plan = null;

function scheduleCheck(delay = 500) {
  check = null;
  clearPlan();
  updateButtons();
  clearTimeout(checkTimer);
  checkTimer = setTimeout(runCheck, delay);
}
async function runCheck() {
  const run = ++checkRun;
  check = null;
  updateButtons();
  setStatus("checkBox", t("checkRunning"), "empty");
  const res = await computeCheck();
  if (run !== checkRun) return null;
  lastCheck = res;
  check = res.ok ? res : null;
  renderCheck(res);
  updateButtons();
  return res;
}

// Step-by-step report; stops at the first blocking problem.
async function computeCheck() {
  const res = { ok: false, missing: false, steps: [], verdict: [] };
  const step = (key, text, cls) => res.steps.push([key, text, cls]);
  const net = getNetwork();
  const rawUp = $("upAddress").value.trim();
  if (!net || !net.rpc || !ethers.isAddress(rawUp) || !signerProvider || !signerAddress) {
    res.missing = true;
    step("cUp", ethers.isAddress(rawUp) ? ethers.getAddress(rawUp) : ["upMissing"], ethers.isAddress(rawUp) ? "" : "err");
    step("cWallet", signerAddress || ["walletMissing"], signerAddress ? "" : "err");
    return res;
  }
  let provider, rpcId;
  try {
    rpcId = Number(await new ethers.JsonRpcProvider(net.rpc, undefined, { batchMaxCount: 1 }).send("eth_chainId", []));
    provider = new ethers.JsonRpcProvider(net.rpc, rpcId, { staticNetwork: true, batchMaxCount: 1 });
  } catch (e) {
    step("cNetwork", net.name, "");
    step("cRpc", ["rpcFail", { err: e.shortMessage || e.message }], "err");
    return res;
  }
  const chainId = net.chainId || rpcId;
  if (!net.chainId) net.name = `${t("customNetName")} (chainId ${rpcId})`;
  step("cNetwork", net.chainId ? `${net.name} (chainId ${net.chainId})` : net.name, "");
  if (rpcId !== chainId) { step("cRpc", ["rpcWrong", { id: rpcId, exp: chainId }], "err"); return res; }
  step("cRpc", ["rpcOk", { id: rpcId }], "ok");

  let walletId;
  try { walletId = parseInt(await signerProvider.request({ method: "eth_chainId" }), 16); }
  catch (e) { step("cWallet", ["walletUnknown"], "err"); return res; }
  if (walletId !== chainId) { step("cWallet", ["walletWrong", { addr: signerAddress, id: walletId, exp: chainId }], "err"); return res; }
  step("cWallet", ["walletOk", { addr: signerAddress, id: walletId }], "ok");

  try {
    const up = ethers.getAddress(rawUp);
    if ((await provider.getCode(up)) === "0x") { step("cUp", ["upNotDeployed"], "err"); return res; }
    step("cUp", ["upOk", { addr: up }], "ok");
    const upC = new ethers.Contract(up, UP_IFACE, provider);
    const km = ethers.getAddress(await upC.owner());
    if ((await provider.getCode(km)) === "0x") { step("cKm", ["kmBad", { addr: km }], "err"); return res; }
    step("cKm", ["kmOk", { addr: km }], "ok");

    const permKey = PERM_PREFIX + signerAddress.slice(2).toLowerCase();
    const permRaw = await upC.getData(permKey);
    const perms = permRaw && permRaw !== "0x" ? BigInt(permRaw) : 0n;
    if (perms === 0n) { step("cPerms", ["permsNone"], "err"); return res; }
    step("cPerms", ["permsList", { hex: "0x" + perms.toString(16).padStart(6, "0"), names: permNames(perms) }], "");

    // The extension: code at the deterministic address must be exactly the expected runtime.
    const extCode = await provider.getCode(EXT_ADDRESS);
    let extState;
    if (extCode === "0x") extState = "missing";
    else if (ethers.keccak256(extCode) === EXT_RUNTIME_HASH) extState = "ok";
    else extState = "wrong";
    step("cExt", extState === "ok" ? ["extOk", { addr: EXT_ADDRESS }] : extState === "missing" ? ["extMissing", { addr: EXT_ADDRESS }] : ["extWrongCode", { addr: EXT_ADDRESS }],
      extState === "ok" ? "ok" : extState === "missing" ? "warn" : "err");
    let factoryOk = true;
    if (extState === "missing") {
      factoryOk = (await provider.getCode(NICK_FACTORY)) !== "0x";
      step("cFactory", factoryOk ? ["factoryOk"] : ["factoryMissing"], factoryOk ? "ok" : "err");
    }
    if (extState === "wrong") return res;

    // Current value of the four LSP17 keys.
    const values = await upC.getDataBatch(HOOKS.map(h => LSP17_KEY(h.sel)));
    const hooks = HOOKS.map((h, i) => {
      const v = values[i];
      if (!v || v === "0x") return { ...h, state: "empty" };
      const ext = ethers.dataLength(v) >= 20 ? ethers.getAddress(ethers.dataSlice(v, 0, 20)) : v;
      return { ...h, state: String(ext).toLowerCase() === EXT_ADDRESS.toLowerCase() && ethers.dataLength(v) === 20 ? "ok" : "other", ext };
    });
    step("cHooks", hooks.map(h => h.state === "ok" ? t("hookOk", h) : h.state === "empty" ? t("hookEmpty", h) : t("hookOther", h)).join("\n"), hooks.every(h => h.state === "ok") ? "ok" : "warn");

    const base = { net, chainId, provider, up, km, signer: signerAddress, permKey, permRaw, perms, extState, hooks };
    if (hooks.every(h => h.state === "ok")) { Object.assign(res, base, { ok: true, done: true }); res.verdict.push([["verdictDone"], "line-ok"]); return res; }

    // Permissions needed: ADDEXTENSIONS for empty keys, CHANGEEXTENSIONS for keys holding another value.
    let needed = 0n;
    if (hooks.some(h => h.state === "empty")) needed |= P.ADDEXTENSIONS;
    if (hooks.some(h => h.state === "other")) needed |= P.CHANGEEXTENSIONS;
    const missing = needed & ~perms;
    if (missing && !(perms & P.EDITPERMISSIONS)) { res.verdict.push([["verdictNoEdit", { missing: permNames(missing) }], "line-err"]); return res; }
    if (missing && ethers.dataLength(permRaw) !== 32) { step("cPerms", ["genericError", { err: "permission value is not 32 bytes" }], "err"); return res; }
    Object.assign(res, base, { ok: true, done: false, missing });
    if (extState === "missing") { if (!factoryOk) { res.ok = false; return res; } res.verdict.push([["verdictNeedPublish"], "line-warn"]); }
    else res.verdict.push([["verdictReady"], "line-ok"]);
  } catch (e) {
    step("cUp", ["genericError", { err: e.shortMessage || e.message }], "err");
    res.ok = false;
  }
  return res;
}

function renderCheck(res) {
  const box = $("checkBox");
  box.textContent = "";
  const grid = document.createElement("div");
  grid.className = "kv";
  for (const [k, v, cls] of res.steps) {
    const kd = document.createElement("div"); kd.className = "k"; kd.textContent = t(k);
    const vd = document.createElement("div"); vd.className = "v" + (cls ? " " + cls : ""); vd.style.whiteSpace = "pre-wrap"; vd.textContent = tr(v);
    grid.appendChild(kd); grid.appendChild(vd);
  }
  box.appendChild(grid);
  const verdict = res.verdict.map(([v, cls]) => [tr(v), cls]);
  if (res.missing) verdict.push([t("verdictMissing"), "line-dim"]);
  else if (!res.ok && !res.verdict.length) verdict.push([t("verdictFail"), "line-err"]);
  for (const [text, cls] of verdict) {
    const d = document.createElement("div"); d.className = "verdict " + cls; d.textContent = text; box.appendChild(d);
  }
}

function updateButtons() {
  const ready = !!check && riskAccepted();
  $("publishBtn").disabled = !(ready && check.extState === "missing");
  $("prepareBtn").disabled = !(ready && !check.done && check.extState === "ok");
  $("enableBtn").disabled = !(ready && plan);
}
function clearPlan() {
  plan = null;
  setStatus("planBox", t("noPlan"), "empty");
  $("replaceRow").style.display = "none";
  $("ackReplace").checked = false;
}

// Re-run right before acting: accounts, networks and UP data may have changed.
async function freshCheck() {
  clearTimeout(checkTimer);
  const res = await runCheck();
  return res && res.ok ? res : null;
}

// ==================== 4. Publish the extension ====================
$("publishBtn").addEventListener("click", async () => {
  if (!riskAccepted()) { log(t("ackRequired"), "line-err"); return; }
  logSeparator();
  const c = await freshCheck();
  if (!c || c.extState !== "missing") { log(t("checkFirst"), "line-err"); return; }
  $("publishBtn").disabled = true;
  try {
    const data = ethers.concat([EXT_SALT, EXT_INIT_CODE]);
    log(t("publishSim"), "line-dim");
    let gas;
    try {
      const out = await c.provider.call({ from: c.signer, to: NICK_FACTORY, data });
      if (!out || ethers.getAddress(ethers.dataSlice(out, 0, 20)) !== ethers.getAddress(EXT_ADDRESS)) throw new Error(`factory returned ${out}`);
      gas = await c.provider.estimateGas({ from: c.signer, to: NICK_FACTORY, data });
    } catch (e) { log(t("publishSimFail", { err: revertReason(e) }), "line-err"); return; }
    log(t("simOk", { gas: gas.toString() }), "line-ok");
    log(t("publishing"), "line-dim");
    const signer = await new ethers.BrowserProvider(signerProvider).getSigner();
    if (signer.address.toLowerCase() !== c.signer.toLowerCase()) { log(t("stale"), "line-err"); return; }
    const sent = await signer.sendTransaction({ to: NICK_FACTORY, data, gasLimit: gas + gas / 4n });
    log(t("txSent", { hash: sent.hash }), "line-dim");
    if (c.net.explorer) log(c.net.explorer + sent.hash, "line-dim");
    log(t("waiting"), "line-dim");
    const receipt = await c.provider.waitForTransaction(sent.hash);
    if (!receipt || receipt.status !== 1) { log(t("txFailed"), "line-err"); return; }
    // A load-balanced RPC may answer from a node that has not seen the block yet: retry a few times.
    let verified = false;
    for (let i = 0; i < 6 && !verified; i++) {
      if (i) await new Promise(r => setTimeout(r, 1500));
      const code = await c.provider.getCode(EXT_ADDRESS, receipt.blockNumber);
      verified = code !== "0x" && ethers.keccak256(code) === EXT_RUNTIME_HASH;
    }
    log(verified ? t("publishOk") : t("publishBadCode"), verified ? "line-ok" : "line-err");
  } catch (e) {
    log(t("genericError", { err: e.shortMessage || e.message }), "line-err");
  } finally {
    scheduleCheck(0);
  }
});

// ==================== 4. Enable: one atomic executeBatch ====================
function buildPayloads(c) {
  const todo = c.hooks.filter(h => h.state !== "ok");
  const setExt = UP_IFACE.encodeFunctionData("setDataBatch", [todo.map(h => LSP17_KEY(h.sel)), todo.map(() => EXT_ADDRESS)]);
  if (!c.missing) return { todo, payloads: [setExt] };
  const granted = ethers.zeroPadValue(ethers.toBeHex(c.perms | c.missing), 32);
  return {
    todo,
    payloads: [
      UP_IFACE.encodeFunctionData("setData", [c.permKey, granted]),
      setExt,
      // Restore the exact bytes read from the UP, not a recomputed value.
      UP_IFACE.encodeFunctionData("setData", [c.permKey, c.permRaw]),
    ],
  };
}

$("prepareBtn").addEventListener("click", async () => {
  if (!riskAccepted()) { log(t("ackRequired"), "line-err"); return; }
  logSeparator();
  clearPlan();
  updateButtons();
  const c = await freshCheck();
  if (!c || c.done || c.extState !== "ok") { log(t("checkFirst"), "line-err"); return; }
  const { todo, payloads } = buildPayloads(c);
  const hex = (n) => "0x" + n.toString(16).padStart(6, "0");
  const lines = [t("planTitle", { signer: c.signer, km: c.km })];
  let n = 1;
  if (c.missing) { lines.push(t("planGrant", { bits: permNames(c.missing), from: hex(c.perms), to: hex(c.perms | c.missing) })); n++; }
  else lines.push(t("planNoGrant"));
  lines.push(t("planSet", { n, ext: EXT_ADDRESS, names: todo.map(h => h.name).join(", ") })); n++;
  if (c.missing) lines.push(t("planRestore", { n, from: hex(c.perms) }));
  lines.push(t("planAtomic"));
  const replacing = todo.some(h => h.state === "other");
  if (replacing) lines.push(t("planReplaceWarn"));
  setStatus("planBox", lines.join("\n"), "");
  $("replaceRow").style.display = replacing ? "flex" : "none";
  log(lines.join("\n"), "line-compare");

  const data = payloads.length === 1
    ? KM_IFACE.encodeFunctionData("execute", [payloads[0]])
    : KM_IFACE.encodeFunctionData("executeBatch", [payloads.map(() => 0), payloads]);
  log(t("simulating"), "line-dim");
  let gas;
  try {
    await c.provider.call({ from: c.signer, to: c.km, data });
    gas = await c.provider.estimateGas({ from: c.signer, to: c.km, data });
  } catch (e) { log(t("simFail", { err: revertReason(e) }), "line-err"); return; }
  log(t("simOk", { gas: gas.toString() }), "line-ok");
  const gasLimit = gas + gas / 4n;
  const need = gasLimit * (await estimateMaxGasPrice(c.provider));
  const bal = await c.provider.getBalance(c.signer);
  const cur = c.net.currency || "";
  if (bal < need) { log(t("signerNoGas", { need: `${ethers.formatEther(need)} ${cur}`, have: `${ethers.formatEther(bal)} ${cur}` }), "line-err"); return; }
  plan = { data, gasLimit, c, replacing };
  log(t("readyToSign"), "line-warn");
  updateButtons();
});
$("ackReplace").addEventListener("change", updateButtons);

$("enableBtn").addEventListener("click", async () => {
  if (!plan || !riskAccepted()) return;
  if (plan.replacing && !$("ackReplace").checked) { log(t("replaceAckRequired"), "line-err"); return; }
  const p = plan;
  $("enableBtn").disabled = true;
  try {
    // The data was built from the UP's state at preparation time: it must not have changed.
    const c = await freshCheck();
    const same = c && !c.done && c.chainId === p.c.chainId && c.up === p.c.up && c.km === p.c.km &&
      c.signer.toLowerCase() === p.c.signer.toLowerCase() && c.permRaw === p.c.permRaw &&
      JSON.stringify(c.hooks.map(h => h.state + (h.ext || ""))) === JSON.stringify(p.c.hooks.map(h => h.state + (h.ext || "")));
    if (!same) { log(t("stale"), "line-err"); return; }
    const signer = await new ethers.BrowserProvider(signerProvider).getSigner();
    if (signer.address.toLowerCase() !== p.c.signer.toLowerCase()) { log(t("stale"), "line-err"); return; }
    log(t("sending"), "line-dim");
    const sent = await signer.sendTransaction({ to: p.c.km, data: p.data, gasLimit: p.gasLimit });
    clearPlan();
    log(t("txSent", { hash: sent.hash }), "line-dim");
    if (p.c.net.explorer) log(p.c.net.explorer + sent.hash, "line-dim");
    log(t("waiting"), "line-dim");
    const receipt = await p.c.provider.waitForTransaction(sent.hash);
    if (!receipt || receipt.status !== 1) { log(t("txFailed"), "line-err"); return; }

    log(t("verifying"), "line-dim");
    // Read at the transaction's block, with a few retries for RPC nodes that lag behind.
    const upC = new ethers.Contract(p.c.up, UP_IFACE, p.c.provider);
    const at = { blockTag: receipt.blockNumber };
    let problems = ["not read"];
    for (let i = 0; i < 6 && problems.length; i++) {
      if (i) await new Promise(r => setTimeout(r, 1500));
      try {
        const [vals, permNow, s721, s1155] = await Promise.all([
          upC.getDataBatch(HOOKS.map(h => LSP17_KEY(h.sel)), at),
          upC.getData(p.c.permKey, at),
          upC.supportsInterface("0x150b7a02", at),
          upC.supportsInterface("0x4e2312e0", at),
        ]);
        problems = [];
        if (!vals.every(v => String(v).toLowerCase() === EXT_ADDRESS.toLowerCase())) problems.push("extension keys");
        if (permNow !== p.c.permRaw) problems.push(`controller permissions ${permNow}`);
        if (!s721 || !s1155) problems.push("supportsInterface");
      } catch (e) { problems = [e.shortMessage || e.message]; }
    }
    if (problems.length) log(t("finalBad", { what: problems.join(", ") }), "line-warn");
    else log(t("finalOk"), "line-ok");
  } catch (e) {
    log(t("genericError", { err: e.shortMessage || e.message }), "line-err");
  } finally {
    scheduleCheck(0);
  }
});

applyI18n();
onInputsChanged();
</script>
